name: Repair HomeEasy Auth 3C minimal diffs

on:
  push:
    branches:
      - feature/auth-rbac
    paths:
      - .github/workflows/repair-auth-3c-diff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth-rbac
          fetch-depth: 0

      - name: Restore exact pre-wire bytes and insert one guard line
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          base = '4d5e7c0427b657643d7bf4a10499e611100c2a31'
          files = [
              'clientes.html','ventas.html','cotizacion.html','seguimiento.html',
              'pedido.html','abono.html','caja.html','documentos.html',
              'calendario.html','reportes.html','configuracion.html'
          ]
          guard = b'<script src="homeeasy-page-guard.js?v=3C"></script>'

          for name in files:
              original = subprocess.check_output(['git','show',f'{base}:{name}'])
              if guard in original:
                  data = original
              else:
                  matches = list(re.finditer(br'<script[^>]+src=["\'][^"\']*homeeasy-core\.js[^"\']*["\'][^>]*>\s*</script>', original, re.I))
                  if matches:
                      pos = matches[-1].end()
                      newline = b'\r\n' if b'\r\n' in original else b'\n'
                      indent = b'    '
                      data = original[:pos] + newline + indent + guard + original[pos:]
                  else:
                      lower = original.lower()
                      pos = lower.rfind(b'</head>')
                      if pos < 0:
                          raise SystemExit(f'{name}: no insertion point')
                      newline = b'\r\n' if b'\r\n' in original else b'\n'
                      data = original[:pos] + b'    ' + guard + newline + original[pos:]
              Path(name).write_bytes(data)

      - name: Validate minimal diffs and AR isolation
        shell: bash
        run: |
          set -euo pipefail
          for f in clientes.html ventas.html cotizacion.html seguimiento.html pedido.html abono.html caja.html documentos.html calendario.html reportes.html configuracion.html; do
            grep -q 'homeeasy-page-guard.js?v=3C' "$f"
          done
          if git diff --name-only | grep -E '^ar-|^ar-sheer-' ; then
            echo 'AR file changed unexpectedly.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import subprocess
          files=['clientes.html','ventas.html','cotizacion.html','seguimiento.html','pedido.html','abono.html','caja.html','documentos.html','calendario.html','reportes.html','configuracion.html']
          bad=[]
          for f in files:
              out=subprocess.check_output(['git','diff','--numstat','4d5e7c0427b657643d7bf4a10499e611100c2a31','--',f], text=True).strip()
              if not out: bad.append((f,'no diff')); continue
              a,d,_=out.split('\t')
              if int(a)>2 or int(d)>1: bad.append((f,out))
          if bad: raise SystemExit('Non-minimal diffs: '+repr(bad))
          print('All module diffs are minimal.')
          PY

      - name: Commit repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-auth-3c-diff.yml
          git config user.name 'HomeEasy Auth Bot'
          git config user.email 'actions@github.com'
          git add clientes.html ventas.html cotizacion.html seguimiento.html pedido.html abono.html caja.html documentos.html calendario.html reportes.html configuracion.html .github/workflows/repair-auth-3c-diff.yml
          git commit -m 'Keep RBAC guard integration minimal and preserve HTML bytes'
          git push origin HEAD:feature/auth-rbac
