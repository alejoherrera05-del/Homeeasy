name: WhatsApp maintenance QA
on:
  push:
    branches: [main]
    paths:
      - 'infra/whatsapp/**'
      - 'homeeasy-whatsapp-settings.js'
      - 'homeeasy-whatsapp-client.js'
      - 'tests/whatsapp-maintenance.cjs'
      - 'tests/whatsapp-diagnostics.cjs'
      - 'CNAME'
      - '.github/workflows/whatsapp-maintenance.yml'
  pull_request:
    paths:
      - 'infra/whatsapp/**'
      - 'homeeasy-whatsapp-settings.js'
      - 'homeeasy-whatsapp-client.js'
      - 'homeeasy-page-guard.js'
      - 'homeeasy-whatsapp-doc-actions.js'
      - 'cotizacion.html'
      - 'pedido.html'
      - 'abono.html'
      - 'clientes.html'
      - 'ventas.html'
      - 'configuracion.html'
      - 'tests/whatsapp-reliability.cjs'
      - 'tests/whatsapp-maintenance.cjs'
      - 'tests/whatsapp-diagnostics.cjs'
      - '.github/workflows/whatsapp-maintenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --no-package-lock jsdom@26
      - run: node --test tests/whatsapp-maintenance.cjs tests/whatsapp-reliability.cjs tests/whatsapp-diagnostics.cjs
      - run: python infra/whatsapp/maintenance/test_worker.py
      - name: Hommy Inbox and Intelligence regression tests
        run: node --test infra/whatsapp/bridge/inbox.test.js infra/whatsapp/bridge/intelligence.test.js infra/whatsapp/bridge/hommy-workspace.test.js infra/whatsapp/bridge/operational-overview.test.js infra/whatsapp/bridge/team-ai.test.js
      - name: Bridge and updater syntax checks
        run: |
          node --check infra/whatsapp/bridge/server.js
          node --check infra/whatsapp/bridge/intelligence.js
          node --check infra/whatsapp/bridge/inbox.js
          node --check infra/whatsapp/bridge/hommy-workspace.js
          node --check infra/whatsapp/bridge/operational-overview.js
          node --check infra/whatsapp/bridge/team-ai.js
          node --check homeeasy-hommy-operations-ui.js
          node --check homeeasy-whatsapp-client.js
          bash -n infra/whatsapp/update-bridge.sh
