name: final HomeEasy 3.0 HTML audit

on:
  push:
    branches: [main]
    paths:
      - 'tools/final-v3-html-audit.js'
      - '.github/workflows/final-v3-html-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve final app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/final-v3-audit.log 2>&1 &
          sleep 2

      - name: Audit every HTML
        run: node tools/final-v3-html-audit.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-homeeasy-v3-html-audit
          path: final-v3-html-audit.json
          if-no-files-found: warn
