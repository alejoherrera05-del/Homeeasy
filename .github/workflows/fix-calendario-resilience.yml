name: fix Calendario resilience

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix-calendario-resilience.py'
      - '.github/workflows/fix-calendario-resilience.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply calendar repair
        run: |
          python3 tools/fix-calendario-resilience.py
          grep -q 'calendario-resilience-v2' calendario.html
          ! grep -q 'material-icons-round' calendario.html
          grep -q 'procesarEventosLocales();' calendario.html

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/calendario.log 2>&1 &
          sleep 2

      - name: Test offline and online calendar rendering
        run: |
          cat > qa-calendario.js <<'NODE'
          const { chromium } = require('playwright');

          async function prepare(page, mode) {
            await page.route('**/homeeasy-page-guard.js*', r => r.fulfill({status:200,contentType:'application/javascript',body:''}));
            await page.route('**/homeeasy-core.js*', r => r.fulfill({status:200,contentType:'application/javascript',body:'window.HomeEasyCore={};'}));
            await page.route('**/script.google.com/**', r => {
              if (mode === 'offline') return r.fulfill({status:503,contentType:'application/json',body:'{}'});
              const now = new Date();
              const y = now.getFullYear();
              const m = String(now.getMonth()+1).padStart(2,'0');
              const d = String(now.getDate()).padStart(2,'0');
              return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({eventos:[{id:'qa-1',fecha:`${y}-${m}-${d}`,hora:'11:59 PM',titulo:'Prueba agenda',categoria:'Visitas técnicas',cliente:'QA',referencia:'N/A',estado:'PENDIENTE'}]})});
            });
          }

          (async()=>{
            const browser = await chromium.launch({headless:true});

            const offline = await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:2,locale:'es-CO'});
            await prepare(offline,'offline');
            await offline.goto('http://127.0.0.1:4173/calendario.html?qa=offline',{waitUntil:'domcontentloaded'});
            await offline.evaluate(()=>localStorage.removeItem('CACHE_EVENTOS'));
            await offline.reload({waitUntil:'domcontentloaded'});
            await offline.waitForTimeout(450);
            const state = await offline.evaluate(()=>{
              const brand=document.querySelector('.header-brand').getBoundingClientRect();
              const icons=document.querySelector('.header-icons').getBoundingClientRect();
              return {
                days:document.querySelectorAll('#calendarDays .day').length,
                month:document.getElementById('currentMonthYear').textContent.trim(),
                selected:document.getElementById('selectedDateText').textContent.trim(),
                materialText:document.body.innerText.match(/calendar_month|event_upcoming|chevron_left|chevron_right|\badd\b|\bupcoming\b/g),
                materialClasses:document.querySelectorAll('.material-icons-round').length,
                navIcons:document.querySelectorAll('.month-header .fa-chevron-left,.month-header .fa-chevron-right').length,
                fabPlus:!!document.querySelector('.fab .fa-plus'),
                headerSearch:!!document.querySelector('.header-icons .fa-search'),
                headerUpcoming:!!document.querySelector('.header-icons .fa-calendar-check'),
                overflow:document.documentElement.scrollWidth>innerWidth+1,
                headerOverlap:brand.right+6>icons.left
              };
            });
            console.log('CALENDAR_OFFLINE',state);
            if(state.days < 28 || !state.month) throw new Error('calendar grid did not render offline');
            if(state.selected === 'Hoy') throw new Error('selected date was not initialized offline');
            if(state.materialText || state.materialClasses) throw new Error('material icon text dependency remains');
            if(state.navIcons !== 2 || !state.fabPlus || !state.headerSearch || !state.headerUpcoming) throw new Error('replacement icons missing');
            if(state.overflow || state.headerOverlap) throw new Error('mobile layout regression');
            await offline.screenshot({path:'calendario-mobile-fixed.png',fullPage:true});

            const online = await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:2,locale:'es-CO'});
            await prepare(online,'online');
            await online.goto('http://127.0.0.1:4173/calendario.html?qa=online',{waitUntil:'domcontentloaded'});
            await online.evaluate(()=>localStorage.removeItem('CACHE_EVENTOS'));
            await online.reload({waitUntil:'domcontentloaded'});
            await online.waitForTimeout(450);
            const onlineState=await online.evaluate(()=>({days:document.querySelectorAll('#calendarDays .day').length,eventDots:document.querySelectorAll('#calendarDays .day.has-event').length,events:document.querySelectorAll('.events-container .evento-swipe-wrapper').length}));
            console.log('CALENDAR_ONLINE',onlineState);
            if(onlineState.days<28 || onlineState.eventDots<1 || onlineState.events<1) throw new Error('online event rendering regression');

            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node qa-calendario.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendario-fixed-preview
          path: calendario-mobile-fixed.png
          if-no-files-found: ignore

      - name: Commit tested repair
        run: |
          git config user.name 'homeeasy-ci'
          git config user.email 'homeeasy-ci@users.noreply.github.com'
          git add calendario.html
          git commit -m 'Repair calendar rendering and icons'
          git push
