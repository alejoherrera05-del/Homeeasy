name: Stage HomeEasy Performance 10G

on:
  push:
    branches:
      - performance-audit-2026-09-04
    paths:
      - 'scripts/patch_homeeasy_performance_10g.py'
      - 'scripts/patch_homeeasy_performance_10g_v2.py'
      - 'tests/homeeasy-performance-10g-contract.mjs'
      - '.github/workflows/homeeasy-performance-10g-stage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-audit-2026-09-04
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply safe performance patch
        run: python scripts/patch_homeeasy_performance_10g_v2.py
      - name: Install ephemeral browser-test dependency
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Validate root JavaScript syntax
        run: |
          for file in homeeasy-*.js seguimiento-hommy.js; do
            if [ -f "$file" ]; then node --check "$file"; fi
          done
      - name: Validate modified inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          files = ['index.html','cotizacion.html','pedido.html','abono.html','calendario.html','reportes.html']
          for name in files:
              source = Path(name).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', source, flags=re.I)
              for idx, code in enumerate(scripts, 1):
                  if not code.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as tmp:
                      tmp.write(code)
                      temp_name = tmp.name
                  subprocess.run(['node', '--check', temp_name], check=True)
          print('Modified inline JavaScript syntax: PASS')
          PY
      - name: Run 10G performance safety contracts
        run: node tests/homeeasy-performance-10g-contract.mjs
      - name: Run exhaustive static performance audit
        run: node tests/homeeasy-performance-audit.mjs
      - name: Run Seguimiento regression contracts
        run: |
          node tests/seguimiento-hommy-10b-qa.mjs
          node tests/seguimiento-hommy-transient-retry-10d2.mjs
          node tests/seguimiento-hommy-history-10e.mjs
          node tests/seguimiento-hommy-fluid-10f.mjs
      - name: Diff hygiene
        run: git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check
      - name: Commit certified runtime changes
        run: |
          git config user.name 'homeeasy-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html homeeasy-core.js homeeasy-auth.js cotizacion.html pedido.html abono.html calendario.html reportes.html
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit'
          else
            git commit -m 'Performance 10G: remove avoidable startup and input latency'
            git push origin HEAD:performance-audit-2026-09-04
          fi
