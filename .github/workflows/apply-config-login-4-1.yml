name: Apply Config Login 4.1

on:
  push:
    paths:
      - '.github/workflows/apply-config-login-4-1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and regression-check Configuración login
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, base64, re
          def dec(v): return base64.b64decode(v).decode('utf-8')
          path=Path('configuracion.html')
          raw=path.read_bytes()
          git_sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          expected='4f2bd59b49307d739080633b2818fc821cf7d46a'
          if git_sha != expected:
              raise SystemExit(f'SAFETY STOP: configuracion.html SHA {git_sha} != {expected}')
          text=raw.decode('utf-8')
          old=dec('')
          new=dec('')
          oldcap=dec('PGRpdiBjbGFzcz0iYWNjZXNzLWNhcHRpb24iPkFjY2VzbyBhZG1pbmlzdHJhdGl2byDCtyBTaXN0ZW1hIEhvbW15PC9kaXY+')
          newcap=dec('PGRpdiBjbGFzcz0iYWNjZXNzLWNhcHRpb24iPlNpc3RlbWEgSG9tbXk8L2Rpdj4=')
          css=dec('')
          if 'CONFIGURACIÓN 4.0 — PULIDO VISUAL DEL LOGIN' not in text:
              raise SystemExit('SAFETY STOP: Config 4.0 base marker missing')
          if 'CONFIGURACIÓN 4.1 — CABECERA ÚNICA + GLASS NEUTRO' in text:
              raise SystemExit('SAFETY STOP: Config 4.1 already present')
          if text.count(old) != 1 or text.count(oldcap) != 1:
              raise SystemExit('SAFETY STOP: expected login HTML targets not unique')
          ids_before=re.findall(r'id="([^"]+)"',text)
          if len(ids_before) != len(set(ids_before)):
              raise SystemExit('SAFETY STOP: duplicate IDs already present')
          app_before=text[text.index('<main class="settings-app"'):]
          app_hash=hashlib.sha256(app_before.encode()).hexdigest()
          scripts_before='\n'.join(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',text,re.S))
          scripts_hash=hashlib.sha256(scripts_before.encode()).hexdigest()
          text=text.replace(old,new,1).replace(oldcap,newcap,1)
          text=text.replace('</style>',css+'\n    </style>',1)
          ids_after=re.findall(r'id="([^"]+)"',text)
          if ids_after != ids_before:
              raise SystemExit('SAFETY STOP: ID sequence changed')
          if len(ids_after) != len(set(ids_after)):
              raise SystemExit('SAFETY STOP: duplicate IDs introduced')
          app_after=text[text.index('<main class="settings-app"'):]
          if hashlib.sha256(app_after.encode()).hexdigest() != app_hash:
              raise SystemExit('SAFETY STOP: internal Settings app changed')
          scripts_after='\n'.join(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',text,re.S))
          if hashlib.sha256(scripts_after.encode()).hexdigest() != scripts_hash:
              raise SystemExit('SAFETY STOP: inline JavaScript changed')
          if 'Ajustes de HomeEasy</div>' in text:
              raise SystemExit('SAFETY STOP: redundant eyebrow still present')
          required=['access-heading','access-heading-copy','Acceso protegido','Sistema Hommy','CONFIGURACIÓN 4.1 — CABECERA ÚNICA + GLASS NEUTRO']
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing expected 4.1 markers: '+','.join(missing))
          path.write_text(text,encoding='utf-8',newline='\n')
          Path('/tmp/inline.js').write_text(scripts_after,encoding='utf-8')
          print('OK: IDs',len(ids_after),'| app hash unchanged | scripts hash unchanged')
          PY
          node --check /tmp/inline.js
      - name: Commit final visual polish and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-config-login-4-1.yml
          git config user.name "HomeEasy Update"
          git config user.email "actions@users.noreply.github.com"
          git add configuracion.html .github/workflows/apply-config-login-4-1.yml
          git commit -m "Polish Configuración login 4.1"
          git push
