name: Hommy 2 QA

on:
  push:
    branches:
      - hommy-2.0
    paths:
      - 'Hommychat.html'
      - 'hommy-chat.css'
      - 'hommy-ios.css'
      - 'hommy-polish.css'
      - 'hommy-chat.js'
      - 'hommy-transport.js'
      - 'hommy-richtext.js'
      - 'index.html'
      - 'hommy_backend/**'
      - 'servidor.py'
      - 'requirements.txt'
      - 'render.yaml'
      - '.env.example'
      - '.python-version'
      - 'tests/**'
      - '.github/workflows/hommy-2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: test-key-not-for-network-calls
      HOMMY_CONVERSATION_SECRET: hommy-ci-conversation-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile servidor.py hommy_backend/*.py

      - name: Validate JavaScript syntax
        run: |
          node --check hommy-chat.js
          node --check hommy-transport.js
          node --check hommy-richtext.js
          node --check tests/hommy-browser-qa.mjs

      - name: Run Hommy contracts
        run: python -m unittest discover -s tests -v

      - name: Import production server
        run: python -c "import servidor; print('Hommy server import OK')"

      - name: Verify current OpenAI SDK contracts
        run: |
          python - <<'PY'
          import inspect
          from openai import OpenAI

          client = OpenAI(api_key='test-key-not-for-network-calls')
          assert hasattr(client, 'responses'), 'Responses API missing from installed SDK'
          assert hasattr(client, 'conversations'), 'Conversations API missing from installed SDK'
          assert hasattr(client, 'realtime') and hasattr(client.realtime, 'calls'), 'Realtime calls API missing from installed SDK'

          response_params = inspect.signature(client.responses.create).parameters
          conversation_params = inspect.signature(client.conversations.create).parameters
          realtime_params = inspect.signature(client.realtime.calls.create).parameters
          assert 'safety_identifier' in response_params, 'Responses safety_identifier parameter missing'
          assert 'metadata' in conversation_params, 'Conversations metadata parameter missing'
          assert 'sdp' in realtime_params and 'session' in realtime_params, 'Realtime create-call contract changed'
          print('OpenAI Responses, Conversations and Realtime contracts available')
          PY

      - name: Smoke production WSGI process
        run: |
          set -euo pipefail
          PORT=5050 gunicorn --bind 127.0.0.1:5050 --workers 1 --threads 2 --timeout 30 servidor:app > /tmp/hommy-gunicorn.log 2>&1 &
          GUNICORN_PID=$!
          trap 'kill "$GUNICORN_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 20); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:5050/api/health > /tmp/hommy-health.json; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            echo 'Gunicorn did not become ready:'
            cat /tmp/hommy-gunicorn.log
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/hommy-health.json').read_text())
          assert payload['ok'] is True
          assert payload['service'] == 'Hommy'
          assert payload['version'] == '2.1.0'
          print('Gunicorn health contract OK:', payload['version'])
          PY

          UNAUTH_STATUS=$(curl --silent --output /tmp/hommy-unauth.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:5050/api/hommy/chat \
            -H 'Content-Type: application/json' \
            --data '{"message":"hola"}')
          echo "Unauthenticated chat status: $UNAUTH_STATUS"
          cat /tmp/hommy-unauth.json
          echo
          test "$UNAUTH_STATUS" = '401'
          grep -q 'AUTH_REQUIRED' /tmp/hommy-unauth.json

          for ENDPOINT in bootstrap realtime/sync; do
            STATUS=$(curl --silent --output "/tmp/hommy-${ENDPOINT//\//-}.json" --write-out '%{http_code}' \
              -X POST "http://127.0.0.1:5050/api/hommy/$ENDPOINT" \
              -H 'Content-Type: application/json' \
              --data '{}')
            echo "Unauthenticated $ENDPOINT status: $STATUS"
            test "$STATUS" = '401'
            grep -q 'AUTH_REQUIRED' "/tmp/hommy-${ENDPOINT//\//-}.json"
          done

          LEGACY_STATUS=$(curl --silent --output /tmp/hommy-legacy.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:5050/api/chat \
            -H 'Content-Type: application/json' \
            --data '{"pregunta":"hola"}')
          echo "Legacy chat status: $LEGACY_STATUS"
          cat /tmp/hommy-legacy.json
          echo
          test "$LEGACY_STATUS" = '426'
          grep -q 'CLIENT_UPGRADE_REQUIRED' /tmp/hommy-legacy.json

          PREFLIGHT_STATUS=$(curl --silent --output /dev/null --dump-header /tmp/hommy-cors.txt --write-out '%{http_code}' \
            -X OPTIONS http://127.0.0.1:5050/api/hommy/chat \
            -H 'Origin: https://alejoherrera05-del.github.io' \
            -H 'Access-Control-Request-Method: POST')
          echo "Preflight status: $PREFLIGHT_STATUS"
          cat /tmp/hommy-cors.txt
          test "$PREFLIGHT_STATUS" = '204'
          grep -qi '^Access-Control-Allow-Origin: https://alejoherrera05-del.github.io' /tmp/hommy-cors.txt
          grep -qi '^X-Content-Type-Options: nosniff' /tmp/hommy-cors.txt
          echo 'Production WSGI smoke tests passed'

      - name: Run Hommy browser QA
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo 'No Chromium/Chrome executable found on runner.'
            exit 1
          fi
          echo "Using browser: $CHROME_PATH"
          npm install --no-save --no-package-lock playwright-core@1.55.0
          python -m http.server 8000 > /tmp/hommy-static.log 2>&1 &
          STATIC_PID=$!
          trap 'kill "$STATIC_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8000/Hommychat.html > /dev/null; then
              break
            fi
            sleep 0.25
          done
          CHROME_PATH="$CHROME_PATH" node tests/hommy-browser-qa.mjs

      - name: Upload Hommy visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hommy-2-browser-qa
          path: qa/hommy-2-browser/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Hommy staging live contracts
        run: |
          set -euo pipefail
          BASE='https://homeeasy-hommy-staging.onrender.com'
          EXPECTED_VERSION=$(python -c 'from hommy_backend import __version__; print(__version__)')

          READY=0
          for attempt in $(seq 1 8); do
            HEALTH_STATUS=$(curl --silent --show-error --location --max-time 25 --connect-timeout 10 \
              --output /tmp/hommy-staging-health.json --write-out '%{http_code}' \
              "$BASE/api/health" || true)
            echo "Staging health attempt $attempt: HTTP $HEALTH_STATUS"
            CURRENT_VERSION=$(python -c "import json; print(json.load(open('/tmp/hommy-staging-health.json')).get('version', ''))" 2>/dev/null || true)
            echo "Staging version attempt $attempt: ${CURRENT_VERSION:-unknown}; expected $EXPECTED_VERSION"
            if [ "$HEALTH_STATUS" = '200' ] && [ "$CURRENT_VERSION" = "$EXPECTED_VERSION" ]; then
              READY=1
              break
            fi
            sleep 5
          done
          if [ "$READY" -ne 1 ]; then
            echo 'Staging did not become healthy.'
            cat /tmp/hommy-staging-health.json 2>/dev/null || true
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/hommy-staging-health.json').read_text())
          assert payload['ok'] is True
          assert payload['service'] == 'Hommy'
          assert payload['version'] == '2.1.0'
          print('Staging health contract OK:', payload['version'])
          PY

          ROOT_STATUS=$(curl --silent --show-error --location --max-time 20 --connect-timeout 8 \
            --output /tmp/hommy-staging-root.json --write-out '%{http_code}' "$BASE/")
          echo "Staging root status: $ROOT_STATUS"
          test "$ROOT_STATUS" = '200'

          UNAUTH_STATUS=$(curl --silent --show-error --max-time 20 --connect-timeout 8 \
            --output /tmp/hommy-staging-unauth.json --write-out '%{http_code}' \
            -X POST "$BASE/api/hommy/chat" \
            -H 'Content-Type: application/json' \
            --data '{"message":"hola"}')
          echo "Staging unauthenticated chat status: $UNAUTH_STATUS"
          test "$UNAUTH_STATUS" = '401'
          grep -q 'AUTH_REQUIRED' /tmp/hommy-staging-unauth.json

          for ENDPOINT in bootstrap realtime/sync; do
            STATUS=$(curl --silent --show-error --max-time 20 --connect-timeout 8 \
              --output "/tmp/hommy-staging-${ENDPOINT//\//-}.json" --write-out '%{http_code}' \
              -X POST "$BASE/api/hommy/$ENDPOINT" \
              -H 'Content-Type: application/json' \
              --data '{}')
            echo "Staging unauthenticated $ENDPOINT status: $STATUS"
            test "$STATUS" = '401'
            grep -q 'AUTH_REQUIRED' "/tmp/hommy-staging-${ENDPOINT//\//-}.json"
          done

          LEGACY_STATUS=$(curl --silent --show-error --max-time 20 --connect-timeout 8 \
            --output /tmp/hommy-staging-legacy.json --write-out '%{http_code}' \
            -X POST "$BASE/api/chat" \
            -H 'Content-Type: application/json' \
            --data '{"pregunta":"hola"}')
          echo "Staging legacy chat status: $LEGACY_STATUS"
          test "$LEGACY_STATUS" = '426'
          grep -q 'CLIENT_UPGRADE_REQUIRED' /tmp/hommy-staging-legacy.json

          PREFLIGHT_STATUS=$(curl --silent --show-error --max-time 20 --connect-timeout 8 \
            --output /dev/null --dump-header /tmp/hommy-staging-cors.txt --write-out '%{http_code}' \
            -X OPTIONS "$BASE/api/hommy/chat" \
            -H 'Origin: https://alejoherrera05-del.github.io' \
            -H 'Access-Control-Request-Method: POST')
          echo "Staging preflight status: $PREFLIGHT_STATUS"
          test "$PREFLIGHT_STATUS" = '204'
          grep -qi '^Access-Control-Allow-Origin: https://alejoherrera05-del.github.io' /tmp/hommy-staging-cors.txt
          grep -qi '^X-Content-Type-Options: nosniff' /tmp/hommy-staging-cors.txt
          if grep -qi '^Access-Control-Allow-Credentials:' /tmp/hommy-staging-cors.txt; then
            echo 'Unexpected Access-Control-Allow-Credentials header in staging.'
            cat /tmp/hommy-staging-cors.txt
            exit 1
          fi

          echo 'Hommy staging live contracts passed'
