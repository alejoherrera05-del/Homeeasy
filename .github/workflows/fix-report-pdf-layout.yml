name: fix report PDF layout charts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-report-pdf-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix PDF pagination and chart rendering
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('reportes-diseno-v4.html')
          s=p.read_text(encoding='utf-8')

          # Exactly two physical A4 pages; no synthetic page break between fixed-height sheets.
          old='.board-pdf-page{width:210mm;min-height:297mm;padding:13mm 14mm 12mm;background:#fff;position:relative;page-break-after:always;break-after:page}.board-pdf-page:last-child{page-break-after:auto;break-after:auto}'
          new='.board-pdf-page{width:210mm;height:297mm;padding:13mm 14mm 12mm;background:#fff;position:relative;overflow:hidden}'
          if old not in s:
              raise SystemExit('board page CSS marker missing')
          s=s.replace(old,new,1)

          marker='.board-pdf-svg{display:block;width:100%;height:auto}'
          additions=marker+'''.board-pdf-goal-meter{width:100%;display:grid;gap:4mm}.board-pdf-goal-meter-head{display:flex;align-items:end;justify-content:space-between;gap:8px}.board-pdf-goal-meter-head strong{font-size:27pt;line-height:1;color:#b2566c;letter-spacing:-1px}.board-pdf-goal-meter-head span{font-size:8pt;text-transform:uppercase;letter-spacing:.55px;color:#8b8589;font-weight:750}.board-pdf-progress{height:7mm;border-radius:999px;background:#eee9eb;overflow:hidden}.board-pdf-progress>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#b2566c,#c9798c)}.board-pdf-bars-html{height:48mm;display:grid;grid-template-columns:repeat(12,1fr);gap:2.2mm;align-items:end;padding:2mm 1mm 0}.board-pdf-bar-col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1.7mm}.board-pdf-bar-track{width:100%;height:39mm;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid #eee9eb}.board-pdf-bar-fill{width:68%;min-height:1.2mm;border-radius:2mm 2mm .7mm .7mm;background:#b2566c}.board-pdf-bar-fill.active{background:#c2a468}.board-pdf-bar-label{font-size:7.2pt;color:#817b7f}.board-pdf-payment-visual{display:grid;gap:4mm;align-content:center}.board-pdf-payment-total strong{display:block;font-size:20pt;letter-spacing:-.7px}.board-pdf-payment-total span{display:block;margin-top:1mm;color:#817b7f;font-size:8pt}.board-pdf-payment-stack{height:8mm;border-radius:999px;display:flex;overflow:hidden;background:#eee9eb}.board-pdf-payment-stack i{display:block;height:100%}.board-pdf-payment-caption{font-size:7.8pt;color:#8b8589}'''
          if '.board-pdf-goal-meter{' not in s:
              if marker not in s: raise SystemExit('board pdf svg marker missing')
              s=s.replace(marker,additions,1)

          helper_marker="function pdfPaymentSvg(entries,total){"
          if helper_marker not in s:
              raise SystemExit('pdf payment SVG marker missing')
          helpers=r'''function pdfGoalHtml(pct){const p=Math.max(0,Math.min(100,Number(pct)||0));return `<div class="board-pdf-goal-meter"><div class="board-pdf-goal-meter-head"><strong>${Math.round(p)}%</strong><span>cumplimiento</span></div><div class="board-pdf-progress"><i style="width:${p}%"></i></div></div>`}
function pdfTrendHtml(vals,active){const data=Array.isArray(vals)?vals:Array(12).fill(0),max=Math.max(...data,1);return `<div class="board-pdf-bars-html">${data.map((value,i)=>{const h=value>0?Math.max(3,value/max*100):1.5;return `<div class="board-pdf-bar-col"><div class="board-pdf-bar-track"><i class="board-pdf-bar-fill ${i===active?'active':''}" style="height:${h}%"></i></div><span class="board-pdf-bar-label">${monthShort[i]}</span></div>`}).join('')}</div>`}
function pdfPaymentHtml(entries,total){const rows=Array.isArray(entries)?entries:[],sum=Number(total)||0;if(!rows.length||sum<=0)return `<div class="board-pdf-payment-visual"><div class="board-pdf-payment-total"><strong>$0</strong><span>Sin pagos registrados</span></div><div class="board-pdf-payment-stack"></div></div>`;const segments=rows.map(([name,value],i)=>{const pct=Math.max(0,Number(value)||0)/sum*100;return `<i style="width:${pct}%;background:${paymentColors[i%paymentColors.length]}"></i>`}).join('');return `<div class="board-pdf-payment-visual"><div class="board-pdf-payment-total"><strong>${pdfEsc(money(sum))}</strong><span>Recaudado en el periodo</span></div><div class="board-pdf-payment-stack">${segments}</div><div class="board-pdf-payment-caption">La barra representa la participación de cada medio de pago.</div></div>`}
'''
          if 'function pdfGoalHtml(' not in s:
              s=s.replace(helper_marker,helpers+helper_marker,1)

          # Use capture-safe HTML charts rather than inline SVG.
          replacements={
            '${pdfGoalSvg(m.pct)}':'${pdfGoalHtml(m.pct)}',
            '${pdfTrendSvg(m.vp,m.rg.activeMonth)}':'${pdfTrendHtml(m.vp,m.rg.activeMonth)}',
            '${pdfPaymentSvg(payEntries,m.ra)}':'${pdfPaymentHtml(payEntries,m.ra)}'
          }
          for a,b in replacements.items():
              if a not in s:
                  raise SystemExit('missing PDF expression: '+a)
              s=s.replace(a,b,1)

          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'board-pdf-page{width:210mm;height:297mm' reportes-diseno-v4.html
          grep -q 'function pdfGoalHtml' reportes-diseno-v4.html
          grep -q 'function pdfTrendHtml' reportes-diseno-v4.html
          grep -q 'function pdfPaymentHtml' reportes-diseno-v4.html
          grep -q '\${pdfTrendHtml(m.vp,m.rg.activeMonth)}' reportes-diseno-v4.html
          git diff --check
      - name: Commit product fix and remove temporary workflow
        run: |
          git config user.name 'homeeasy-ci'
          git config user.email 'homeeasy-ci@users.noreply.github.com'
          git rm .github/workflows/fix-report-pdf-layout.yml
          git add reportes-diseno-v4.html
          git commit -m 'Finalize executive report PDF layout and charts'
          git push
