name: HomeEasy Auth 9A smoke test

on:
  push:
    branches:
      - feature/auth-rbac
    paths:
      - .github/workflows/auth-9a-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-auth-state:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify deployed AUTH_ESTADO endpoint
        shell: bash
        env:
          HOMEEASY_BACKEND_URL: https://script.google.com/macros/s/AKfycbyZHaIe7hb28KKtaPBORASy_maSZ2co8dZFce44GQRiZGYg_6WoU7qn4qC-lYCQO6ZL/exec
        run: |
          set -euo pipefail

          RESPONSE="$(curl --fail-with-body --silent --show-error --location --max-time 40 \
            --data-raw '{"tipo":"AUTH_ESTADO","meta":{"pagina":"github-actions-smoke","versionApp":"2.9A"}}' \
            "$HOMEEASY_BACKEND_URL")"

          echo "AUTH_ESTADO response: $RESPONSE"

          python3 - "$RESPONSE" <<'PY'
          import json
          import sys

          data = json.loads(sys.argv[1])
          expected = {
              "status": "ok",
              "etapa": "9A",
              "modo": "PREPARACION",
              "firebaseConfigurado": True,
              "loginDisponible": True,
              "rutasBloqueadas": 0,
          }

          problems = []
          for key, value in expected.items():
              if data.get(key) != value:
                  problems.append(f"{key}: expected {value!r}, got {data.get(key)!r}")

          if not isinstance(data.get("usuarios"), int) or data["usuarios"] < 0:
              problems.append(f"usuarios: expected a non-negative integer, got {data.get('usuarios')!r}")

          if problems:
              raise SystemExit("Smoke test failed:\n- " + "\n- ".join(problems))

          print("HomeEasy Auth 9A backend verified successfully.")
          PY
