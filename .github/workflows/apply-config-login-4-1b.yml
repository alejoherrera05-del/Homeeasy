name: Apply Config Login 4.1b

on:
  push:
    paths:
      - '.github/workflows/apply-config-login-4-1b.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply visual-only login patch with regression barriers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, base64, re
          def dec(v): return base64.b64decode(v).decode('utf-8')
          p=Path('configuracion.html'); raw=p.read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          expected='4f2bd59b49307d739080633b2818fc821cf7d46a'
          if sha != expected: raise SystemExit(f'SAFETY STOP sha {sha} != {expected}')
          s=raw.decode('utf-8')
          old=dec('')
          new=dec('')
          oldcap=dec('PGRpdiBjbGFzcz0iYWNjZXNzLWNhcHRpb24iPkFjY2VzbyBhZG1pbmlzdHJhdGl2byDCtyBTaXN0ZW1hIEhvbW15PC9kaXY+')
          newcap=dec('PGRpdiBjbGFzcz0iYWNjZXNzLWNhcHRpb24iPlNpc3RlbWEgSG9tbXk8L2Rpdj4=')
          css=dec('')
          if 'CONFIGURACIÓN 4.0 — PULIDO VISUAL DEL LOGIN' not in s: raise SystemExit('SAFETY STOP: base 4.0 marker missing')
          if 'CONFIGURACIÓN 4.1 — CABECERA ÚNICA + GLASS NEUTRO' in s: raise SystemExit('SAFETY STOP: already patched')
          if s.count(old)!=1 or s.count(oldcap)!=1: raise SystemExit('SAFETY STOP: targets not unique')
          ids=re.findall(r'id="([^"]+)"',s)
          if len(ids)!=len(set(ids)): raise SystemExit('SAFETY STOP: duplicate IDs before')
          app=s[s.index('<main class="settings-app"'):]
          app_hash=hashlib.sha256(app.encode()).hexdigest()
          scripts='\n'.join(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S))
          scripts_hash=hashlib.sha256(scripts.encode()).hexdigest()
          s=s.replace(old,new,1).replace(oldcap,newcap,1).replace('</style>',css+'\n    </style>',1)
          ids2=re.findall(r'id="([^"]+)"',s)
          if ids2!=ids or len(ids2)!=len(set(ids2)): raise SystemExit('SAFETY STOP: IDs changed')
          if hashlib.sha256(s[s.index('<main class="settings-app"'):].encode()).hexdigest()!=app_hash: raise SystemExit('SAFETY STOP: settings app changed')
          scripts2='\n'.join(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S))
          if hashlib.sha256(scripts2.encode()).hexdigest()!=scripts_hash: raise SystemExit('SAFETY STOP: inline JS changed')
          if 'Ajustes de HomeEasy</div>' in s: raise SystemExit('SAFETY STOP: redundant title remains')
          if 'Acceso administrativo · Sistema Hommy' in s: raise SystemExit('SAFETY STOP: redundant footer remains')
          p.write_text(s,encoding='utf-8',newline='\n')
          print('PASS: IDs unchanged, JS unchanged, internal app unchanged, duplicate copy removed')
          PY
      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply-config-login-4-1.yml .github/workflows/apply-config-login-4-1b.yml
          git config user.name "HomeEasy Update"
          git config user.email "actions@users.noreply.github.com"
          git add configuracion.html .github/workflows/apply-config-login-4-1.yml .github/workflows/apply-config-login-4-1b.yml
          git commit -m "Polish Configuración login 4.1"
          git push
