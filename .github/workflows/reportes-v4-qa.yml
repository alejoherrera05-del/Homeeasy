name: reportes v4 QA

on:
  push:
    branches: [main]
    paths: ['reportes-diseno-v4.html','ventas.html','homeeasy-page-guard.js','.github/workflows/reportes-v4-qa.yml']
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install QA tools
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y poppler-utils python3-pil
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/reportes-http.log 2>&1 &
          sleep 2
      - name: Browser integration and export QA
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const API='https://script.google.com/macros/s/AKfycbyZHaIe7hb28KKtaPBORASy_maSZ2co8dZFce44GQRiZGYg_6WoU7qn4qC-lYCQO6ZL/exec';
          const reportData={ordenes:[
            {numero:37,fecha:'2026-08-08T12:00:00',total:1800000,abonoInicial:1000000,estado:'ACTIVO'},
            {numero:38,fecha:'2026-08-14T12:00:00',total:2900000,abonoInicial:1450000,estado:'ACTIVO'},
            {numero:39,fecha:'2026-08-19T12:00:00',total:1350000,abonoInicial:675000,estado:'ACTIVO'},
            {numero:36,fecha:'2026-08-03T12:00:00',total:1149000,abonoInicial:1149000,estado:'COMPLETADO'},
            {numero:20,fecha:'2026-07-10T12:00:00',total:22567000,abonoInicial:10000000,estado:'ACTIVO'}],abonos:[{fecha:'2026-08-21T12:00:00',valor:2390000,medio:'TRANSFERENCIA'}]};
          const H=['Fecha','Numero_OP','Cedula','Nombre_Cliente','Descripcion_Detallada','Valor_Total','Abono_Inicial','Abono_2','Abono_3','Abono_4','Abono_5','Abono_6','Abono_7','Abono_8','Abono_9','Abono_10','Saldo_Pendiente','Estado','URL_PDF_OP','Observaciones'];
          const R=(f,o,c,n,d,t,p,s,e)=>[f,o,c,n,d,t,p,0,0,0,0,0,0,0,0,0,s,e,'',''];
          const sheet={status:'ok',ordenes:[H,R('2026-08-08T12:00:00',37,'76324080','EDUARDO ANDRES MERA GUTIERREZ','Combo',1800000,1000000,800000,'ACTIVO'),R('2026-08-14T12:00:00',38,'1061763473','CRISTHIAN GUZMAN MELIZO','Combo Portobello',2900000,1450000,1450000,'ACTIVO'),R('2026-08-19T12:00:00',39,'34535683','RUBIELA DAGUA FERNANDEZ','Blackout',1350000,675000,675000,'ACTIVO'),R('2026-08-03T12:00:00',36,'111','CLIENTE COMPLETADO','Venta cerrada',1149000,1149000,0,'COMPLETADO'),R('2026-07-10T12:00:00',20,'222','CLIENTE JULIO','Venta julio',22567000,10000000,12567000,'ACTIVO')]};
          const b64=o=>Buffer.from(JSON.stringify(o)).toString('base64url');
          const idToken=`x.${b64({aud:'homeeasy-auth',iss:'https://securetoken.google.com/homeeasy-auth',sub:'qa',user_id:'qa',email:'qa@homeeasy.test'})}.x`;
          const session={version:2,persistence:'session',localId:'qa',email:'qa@homeeasy.test',displayName:'QA',idToken,refreshToken:'qa-refresh',expiresAt:Date.now()+3600000,appSessionToken:'QA_APP_SESSION',appSessionExpiresAt:new Date(Date.now()+3600000).toISOString(),appSessionValidatedAt:Date.now(),profile:{uid:'qa',nombre:'QA',email:'qa@homeeasy.test',rol:'ADMIN',estado:'ACTIVO',emailVerificado:true},permissions:['reportes.read','ventas.read']};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000},locale:'es-CO',acceptDownloads:true});
            await page.addInitScript(s=>sessionStorage.setItem('HOMEEASY_AUTH_SESSION_V1',JSON.stringify(s)),session);
            const seen=[];
            await page.route('**/exec?**',async route=>{const u=new URL(route.request().url());if(!u.href.startsWith(API))return route.continue();const token=u.searchParams.get('appSessionToken'),pagina=u.searchParams.get('pagina'),tipo=u.searchParams.get('tipo'),init=u.searchParams.get('init');seen.push({token,pagina,tipo,init});if(token!=='QA_APP_SESSION')return route.fulfill({status:401,contentType:'application/json',body:'{"status":"error","requiresLogin":true}'});if(tipo==='GET_META')return route.fulfill({status:200,contentType:'application/json',body:'{"meta":10000000}'});if(tipo==='GET_REPORTES')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(reportData)});if(init==='LOAD')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(sheet)});return route.continue()});
            await page.goto('http://127.0.0.1:4173/reportes-diseno-v4.html?periodo=este_mes',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>portfolio.textContent.trim()==='$2.925.000',{timeout:20000});
            const base=await page.evaluate(()=>({p:portfolio.textContent.trim(),note:portfolioNote.textContent.trim(),winner:winnerDetail.textContent.trim(),error:errorBanner.classList.contains('show')}));
            if(base.error||base.p!=='$2.925.000'||base.note!=='3 OP activas · saldo pendiente del periodo.'||base.note.includes('Haz clic')||!base.winner.includes('CRISTHIAN GUZMAN MELIZO'))throw new Error('Reporte base incorrecto '+JSON.stringify(base));
            const board=await page.evaluate(()=>{const root=buildBoardReport(),x={pages:root.querySelectorAll('.board-pdf-page').length,text:root.innerText.toLowerCase(),goal:parseFloat(root.querySelector('.board-pdf-progress>i')?.style.width||'0'),bars:root.querySelectorAll('.board-pdf-bar-fill').length,pay:root.querySelectorAll('.board-pdf-payment-stack i').length};root.remove();return x});
            console.log('BOARD_DOM',board);
            if(board.pages!==2||Math.abs(board.goal-72)>.05||board.bars!==12||board.pay<2)throw new Error('Gráficos PDF incompletos '+JSON.stringify(board));
            for(const t of ['resumen ejecutivo','cumplimiento de meta','cartera activa del periodo','cristhian guzman melizo','metodología del reporte'])if(!board.text.includes(t))throw new Error('Falta texto PDF '+t);
            const dl=page.waitForEvent('download',{timeout:30000});await page.click('#exportBtn');await (await dl).saveAs('HomeEasy-board-report.pdf');await page.waitForFunction(()=>!exportBtn.disabled,{timeout:30000});
            const reportCalls=()=>seen.filter(x=>x.pagina==='reportes-diseno-v4.html'&&(x.tipo==='GET_META'||x.tipo==='GET_REPORTES'||x.init==='LOAD')).length;
            const before=reportCalls();await page.click('#portfolioCard');await page.waitForURL(/ventas\.html/);await page.waitForFunction(()=>statBalance.textContent.trim()==='$2.925.000');const sales=await page.evaluate(()=>({year:yearFilter.value,month:monthFilter.value,status:statusFilter.value,sort:sortFilter.value,balance:statBalance.textContent.trim()}));if(JSON.stringify(sales)!==JSON.stringify({year:'2026',month:'7',status:'ACTIVO',sort:'BALANCE_DESC',balance:'$2.925.000'}))throw new Error('Filtros incorrectos');await page.click('#backBtn');await page.waitForURL(/reportes-diseno-v4\.html/);await page.waitForTimeout(500);const back=await page.evaluate(()=>({display:getComputedStyle(loaderFinance).display,opacity:getComputedStyle(loaderFinance).opacity,p:portfolio.textContent.trim()}));if(reportCalls()!==before||back.p!=='$2.925.000'||(back.display!=='none'&&+back.opacity>.05))throw new Error('Regreso desde cartera recargó '+JSON.stringify(back));
            const beforeWin=reportCalls();await page.click('#winnerCard');await page.waitForURL(/ventas\.html/);await page.waitForFunction(()=>detailDrawer.classList.contains('open'));const win=await page.evaluate(()=>({title:drawerTitle.textContent.trim(),body:drawerBody.textContent}));if(win.title!=='OP-38'||!win.body.includes('CRISTHIAN GUZMAN MELIZO'))throw new Error('Ganadora incorrecta');await page.click('#drawerClose');await page.waitForFunction(()=>!detailDrawer.classList.contains('open'));await page.click('#backBtn');await page.waitForURL(/reportes-diseno-v4\.html/);await page.waitForTimeout(500);if(reportCalls()!==beforeWin)throw new Error('Regreso desde ganadora recargó');await page.screenshot({path:'reportes-final-screen.png',fullPage:true});await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Validate exported PDF pages
        run: |
          test -s HomeEasy-board-report.pdf
          pdfinfo HomeEasy-board-report.pdf | tee board-report-pdfinfo.txt
          test "$(pdfinfo HomeEasy-board-report.pdf | awk '/^Pages:/ {print $2}')" = "2"
          pdftoppm -png -f 1 -l 2 -r 140 HomeEasy-board-report.pdf board-report-page
          python3 <<'PY'
          from PIL import Image
          for path in ['board-report-page-1.png','board-report-page-2.png']:
              im=Image.open(path).convert('RGB'); px=list(im.getdata()); ratio=sum(1 for r,g,b in px if min(r,g,b)<245)/len(px); print(path,round(ratio,4)); assert ratio>.055, f'{path} parece vacía'
          PY
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-v4-qa
          path: |
            HomeEasy-board-report.pdf
            board-report-pdfinfo.txt
            board-report-page-1.png
            board-report-page-2.png
            reportes-final-screen.png
          if-no-files-found: ignore
