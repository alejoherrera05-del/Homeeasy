name: qa reportes mobile goal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-reportes-mobile-goal.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/he-goal.log 2>&1 &
          sleep 2
      - name: Validate mobile goal composition
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:3,locale:'es-CO'});
            await page.route('**/homeeasy-page-guard.js*',route=>route.fulfill({status:200,contentType:'application/javascript',body:'window.HomeEasyPageGuard={ready:Promise.resolve(true)};'}));
            await page.route('**/homeeasy-core.js*',route=>route.fulfill({status:200,contentType:'application/javascript',body:'window.HomeEasyCore={get:async()=>({}),post:async()=>({status:"ok"})};'}));
            await page.goto('http://127.0.0.1:4173/reportes.html?periodo=este_mes',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(500);
            await page.evaluate(()=>{
              const t=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
              const l=document.getElementById('loaderFinance');if(l)l.style.display='none';
              t('dateDisplay','Mostrando: 1/8/2026 - 31/8/2026');
              t('goalKicker','Meta de ventas · Agosto');
              t('goalTotal','$10.000.000');
              t('goalAchieved','$7.199.000');
              const rem=document.getElementById('goalRemaining');if(rem)rem.innerHTML='Nos faltan <strong>$2.801.000</strong> para cumplir la meta.';
              t('goalPct','72%');
              t('goalIndex','72 de cada 100');
              const ring=document.getElementById('ring');if(ring)ring.style.background='conic-gradient(#B2566C 0 72%,#E9E6E7 72% 100%)';
            });
            const m=await page.evaluate(()=>{
              const r=s=>{const e=document.querySelector(s),x=e.getBoundingClientRect();return{top:x.top,bottom:x.bottom,left:x.left,right:x.right,width:x.width,height:x.height,display:getComputedStyle(e).display,font:parseFloat(getComputedStyle(e).fontSize)||0}};
              return{vw:innerWidth,scrollWidth:document.documentElement.scrollWidth,hero:r('.goal-hero'),total:r('.goal-total'),ring:r('.ring'),note:r('.ring-note'),stage:r('.hommy-stage'),art:r('.hommy-art img'),bubble:r('.hommy-bubble'),copy:r('.goal-copy')};
            });
            console.log('GOAL_MOBILE',JSON.stringify(m,null,2));
            if(m.scrollWidth>m.vw+1)throw new Error('horizontal overflow');
            if(m.hero.height>490)throw new Error('goal hero still too tall: '+m.hero.height);
            if(m.note.display!=='none')throw new Error('redundant ring note still visible');
            if(m.bubble.display!=='none')throw new Error('bubble still visible on mobile');
            if(m.total.font>41)throw new Error('goal total too large');
            if(m.art.width>125)throw new Error('Hommy still too dominant');
            if(m.ring.right+16>m.art.left)throw new Error('ring and Hommy visually collide');
            await page.screenshot({path:'reportes-mobile-goal.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-mobile-goal-qa
          path: reportes-mobile-goal.png
          if-no-files-found: ignore
