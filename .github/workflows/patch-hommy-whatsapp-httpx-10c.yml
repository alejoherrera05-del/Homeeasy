name: Patch Hommy WhatsApp HTTPX 10C

on:
  push:
    branches:
      - hommy-whatsapp-context-10c
    paths:
      - '.github/workflows/patch-hommy-whatsapp-httpx-10c.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hommy-whatsapp-context-10c
          fetch-depth: 0

      - name: Patch transport
        run: python hommy_backend/patch_whatsapp_httpx_10c.py

      - name: Validate syntax
        run: python -m py_compile hommy_backend/whatsapp_context.py

      - name: Commit fix
        run: |
          if git diff --quiet -- hommy_backend/whatsapp_context.py; then
            echo 'No httpx patch required.'
            exit 0
          fi
          git config user.name 'homeeasy-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add hommy_backend/whatsapp_context.py
          git commit -m 'Use isolated httpx client for WhatsApp context reads'
          git push origin HEAD:hommy-whatsapp-context-10c
