name: HomeEasy Formal PDF Visual Regression

on:
  pull_request:
    paths:
      - 'cotizacion.html'
      - 'homeeasy-docs.js'
      - 'tests/cotizacion-pdf-browser-regression.mjs'
      - '.github/workflows/homeeasy-formal-pdf-qa.yml'
  push:
    branches: [main]
    paths:
      - 'cotizacion.html'
      - 'homeeasy-docs.js'
      - 'tests/cotizacion-pdf-browser-regression.mjs'
      - '.github/workflows/homeeasy-formal-pdf-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check original document and scripts
        run: |
          node tests/homeeasy-inline-js-syntax.mjs
          node --check homeeasy-docs.js
          node --check tests/cotizacion-pdf-browser-regression.mjs
      - name: Install isolated QA tools
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 bootstrap@5.3.3 @fontsource/montserrat@5.2.6 @fortawesome/fontawesome-free@6.4.0 jspdf@2.5.1 html2canvas@1.4.1
          npx playwright install --with-deps chromium
      - name: Serve checked-out Hommy without live backend
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/homeeasy-formal-pdf-http.log 2>&1 &
          sleep 2
      - name: Generate PDF in real Chromium for three isolated scenarios
        run: node tests/cotizacion-pdf-browser-regression.mjs
      - name: Inspect PDF pagination and produce visual previews
        if: always()
        run: |
          for pdf in qa/cotizacion-pdf/*.pdf; do
            [ -f "$pdf" ] || continue
            echo "PDF: $pdf"
            pdfinfo "$pdf" | grep -E 'Pages:|Page size:|File size:'
            pdftoppm -png -scale-to 950 "$pdf" "${pdf%.pdf}-render" >/dev/null 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homeeasy-formal-pdf-qa
          path: qa/cotizacion-pdf/
          retention-days: 14
