name: reportes v4 diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'reportes-diseno-v4.html'
      - 'homeeasy-page-guard.js'
      - '.github/workflows/reportes-v4-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Confirm backend requires session
        shell: bash
        run: |
          set -euo pipefail
          API='https://script.google.com/macros/s/AKfycbyZHaIe7hb28KKtaPBORASy_maSZ2co8dZFce44GQRiZGYg_6WoU7qn4qC-lYCQO6ZL/exec'
          curl -L --fail --silent --show-error "$API?tipo=GET_REPORTES" -o /tmp/reportes.json
          node <<'NODE'
          const data=require('/tmp/reportes.json');
          console.log('UNAUTH_BACKEND', data);
          if(data.code!=='INVALID_APP_SESSION' || data.requiresLogin!==true){
            throw new Error('Backend no está aplicando la sesión esperada');
          }
          NODE

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/reportes-http.log 2>&1 &
          sleep 2

      - name: Authenticated browser integration test
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const API='https://script.google.com/macros/s/AKfycbyZHaIe7hb28KKtaPBORASy_maSZ2co8dZFce44GQRiZGYg_6WoU7qn4qC-lYCQO6ZL/exec';
          const fixture={
            ordenes:[
              {numero:24,fecha:'2026-08-16T12:00:00',total:18450000,abonoInicial:5000000,estado:'ACTIVA'},
              {numero:19,fecha:'2026-07-22T12:00:00',total:16100000,abonoInicial:0,estado:'ACTIVA'}
            ],
            abonos:[
              {fecha:'2026-08-20T12:00:00',valor:7900000,medio:'TRANSFERENCIA'}
            ]
          };
          const b64url=o=>Buffer.from(JSON.stringify(o)).toString('base64url');
          const idToken=`x.${b64url({aud:'homeeasy-auth',iss:'https://securetoken.google.com/homeeasy-auth',sub:'ci-user',user_id:'ci-user',email:'ci@homeeasy.test'})}.x`;
          const session={
            version:2,persistence:'session',localId:'ci-user',email:'ci@homeeasy.test',displayName:'CI',
            idToken,refreshToken:'ci-refresh',expiresAt:Date.now()+3600000,
            appSessionToken:'CI_APP_SESSION',appSessionExpiresAt:new Date(Date.now()+3600000).toISOString(),appSessionValidatedAt:Date.now(),
            profile:{uid:'ci-user',nombre:'CI',email:'ci@homeeasy.test',rol:'ADMIN',estado:'ACTIVO',emailVerificado:true},
            permissions:['reportes.read']
          };
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000},locale:'es-CO'});
            await page.addInitScript(s=>sessionStorage.setItem('HOMEEASY_AUTH_SESSION_V1',JSON.stringify(s)),session);
            const seen=[];
            await page.route('**/exec?**',async route=>{
              const url=new URL(route.request().url());
              if(!url.href.startsWith(API)) return route.continue();
              const tipo=url.searchParams.get('tipo');
              const token=url.searchParams.get('appSessionToken');
              const pagina=url.searchParams.get('pagina');
              seen.push({tipo,token,pagina,url:url.href});
              if(token!=='CI_APP_SESSION') return route.fulfill({status:401,contentType:'application/json',body:JSON.stringify({status:'error',requiresLogin:true,code:'INVALID_APP_SESSION'})});
              if(pagina!=='reportes-diseno-v4.html') return route.fulfill({status:400,contentType:'application/json',body:JSON.stringify({status:'error',msg:'pagina incorrecta'})});
              if(tipo==='GET_META') return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({meta:25000000})});
              if(tipo==='GET_REPORTES') return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(fixture)});
              return route.continue();
            });
            page.on('console',m=>console.log('BROWSER',m.type(),m.text()));
            page.on('pageerror',e=>console.log('PAGEERROR',e.message));
            await page.goto('http://127.0.0.1:4173/reportes-diseno-v4.html?ci=auth',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#goalTotal')?.textContent?.trim()==='$25.000.000',{timeout:20000});
            const state=await page.evaluate(()=>({
              url:location.pathname,
              guard:window.HomeEasyPageGuard?{page:HomeEasyPageGuard.currentPage,permission:HomeEasyPageGuard.requiredPermission,status:HomeEasyPageGuard.getStatus()}:null,
              date:document.querySelector('#dateDisplay')?.textContent?.trim(),
              goal:document.querySelector('#goalTotal')?.textContent?.trim(),
              achieved:document.querySelector('#goalAchieved')?.textContent?.trim(),
              collected:document.querySelector('#collected')?.textContent?.trim(),
              portfolio:document.querySelector('#portfolio')?.textContent?.trim(),
              growth:document.querySelector('#growth')?.textContent?.trim(),
              index:document.querySelector('#goalIndex')?.textContent?.trim(),
              errorVisible:document.querySelector('#errorBanner')?.classList.contains('show'),
              titleLeft:document.querySelector('.heading h1')?.getBoundingClientRect().left,
              subtitleLeft:document.querySelector('.heading p')?.getBoundingClientRect().left,
              titleTop:document.querySelector('.heading h1')?.getBoundingClientRect().top,
              subtitleTop:document.querySelector('.heading p')?.getBoundingClientRect().top
            }));
            console.log('AUTHORIZED_REQUESTS',JSON.stringify(seen,null,2));
            console.log('UI_STATE',JSON.stringify(state,null,2));
            await page.screenshot({path:'reportes-v4-authenticated.png',fullPage:true});
            if(state.guard?.permission!=='reportes.read' || state.guard?.status!=='authorized') throw new Error('Page guard no autorizó la v4');
            if(state.errorVisible) throw new Error('Error banner visible');
            if(state.goal!=='$25.000.000') throw new Error('Meta incorrecta: '+state.goal);
            if(state.achieved!=='$18.450.000') throw new Error('Vendido incorrecto: '+state.achieved);
            if(state.collected!=='$12.900.000') throw new Error('Recaudado incorrecto: '+state.collected);
            if(state.growth!=='+14,6%') throw new Error('Variación incorrecta: '+state.growth);
            if(state.index!=='74 de cada 100') throw new Error('Índice incorrecto: '+state.index);
            if(!seen.some(x=>x.tipo==='GET_META'&&x.token==='CI_APP_SESSION')) throw new Error('GET_META no llevó sesión');
            if(!seen.some(x=>x.tipo==='GET_REPORTES'&&x.token==='CI_APP_SESSION')) throw new Error('GET_REPORTES no llevó sesión');
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE

      - name: Upload verified screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-v4-authenticated
          path: reportes-v4-authenticated.png
          if-no-files-found: ignore
