name: Patch Seguimiento 10D QA Fix

on:
  push:
    branches:
      - seguimiento-10d-qa-fix
    paths:
      - 'scripts/patch_seguimiento_10d_qa_fix.py'
      - '.github/workflows/patch-seguimiento-10d-qa-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seguimiento-10d-qa-fix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply fix
        run: python scripts/patch_seguimiento_10d_qa_fix.py

      - name: Validate patched files
        run: |
          node --check seguimiento-hommy.js
          node --check homeeasy-whatsapp-client.js
          grep -Fq "seguimiento-hommy.js?v=10d1-retry" seguimiento.html
          grep -Fq "Revisar y enviar" seguimiento-hommy.js
          grep -Fq "/api/whatsapp/send-followup" homeeasy-whatsapp-client.js
          git diff --check

      - name: Commit page retry fix
        run: |
          git config user.name homeeasy-automation
          git config user.email actions@users.noreply.github.com
          git add seguimiento.html
          git commit -m 'Seguimiento 10D: align loader retry version'
          git push origin HEAD:seguimiento-10d-qa-fix
