name: release HomeEasy 3.0

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-homeeasy-v3.py'
      - '.github/workflows/release-homeeasy-v3.yml'

permissions:
  contents: write

jobs:
  patch-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply visible 3.0 version patch
        run: python3 tools/apply-homeeasy-v3.py

      - name: Static audit after patch
        run: |
          python3 tools/audit-all-html.py
          python3 - <<'PY'
          import json
          d=json.load(open('audit-html-static.json',encoding='utf-8'))
          if d['version2']:
              raise SystemExit('Version 2.0 labels remain: '+str(d['version2']))
          print('VERSION2_REMAINING=0')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve patched app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/homeeasy-v3.log 2>&1 &
          sleep 2

      - name: Full browser audit after patch
        run: node tools/audit-all-html-browser.js

      - name: Confirm 3.0 labels
        run: |
          grep -RIn --include='*.html' -E 'VERSIÓN 3\.0|Versión 3\.0|VERSION 3\.0|Version 3\.0' . || true

      - name: Commit HomeEasy 3.0 patch
        run: |
          git config user.name 'homeeasy-ci'
          git config user.email 'homeeasy-ci@users.noreply.github.com'
          git add '*.html'
          git add '**/*.html' 2>/dev/null || true
          git commit -m 'Release HomeEasy 3.0'
          git push
