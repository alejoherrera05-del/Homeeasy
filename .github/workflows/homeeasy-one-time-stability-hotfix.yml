name: HomeEasy stability hotfix

on:
  push:
    paths:
      - '.github/workflows/homeeasy-one-time-stability-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare byte-safe patch
        if: github.event.head_commit.message == 'Publish byte-safe HomeEasy hotfix'
        run: python scripts/homeeasy_stability_hotfix_once.py

      - name: Validate shared JavaScript
        if: github.event.head_commit.message == 'Publish byte-safe HomeEasy hotfix'
        run: |
          node --check homeeasy-auth-config.js
          node --check homeeasy-page-guard.js
          node --check homeeasy-core.js
          node --check homeeasy-account.js

      - name: Verify minimal diff and publish
        if: github.event.head_commit.message == 'Publish byte-safe HomeEasy hotfix'
        run: |
          git config core.whitespace cr-at-eol
          git diff --check
          git diff --stat
          git config user.name 'HomeEasy Stability Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add homeeasy-auth-config.js homeeasy-page-guard.js homeeasy-core.js homeeasy-account.js homeeasy-account-template.js '*.html'
          git diff --cached --check
          git commit -m 'Fix HomeEasy session recovery and iOS cache'
          git push origin HEAD:main
