name: validate WhatsApp phase 2

on:
  push:
    branches: [main]
    paths:
      - 'infra/whatsapp/bridge/**'
      - 'infra/whatsapp/update-bridge.sh'
      - 'infra/whatsapp/setup-https.sh'
      - 'infra/whatsapp/install-https-domain.sh'
      - 'infra/whatsapp/phase2-enable-https.sh'
      - '.github/workflows/validate-whatsapp-phase2.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          node --check infra/whatsapp/bridge/server.js
          bash -n infra/whatsapp/update-bridge.sh
          bash -n infra/whatsapp/setup-https.sh
          bash -n infra/whatsapp/install-https-domain.sh
          bash -n infra/whatsapp/phase2-enable-https.sh
      - name: Build Bridge
        run: docker build -t homeeasy-whatsapp-bridge:test infra/whatsapp/bridge
      - name: Smoke Bridge v0.2
        run: |
          docker run -d --rm --name he-bridge-test \
            -e WAHA_BASE_URL=http://127.0.0.1:39999 \
            -e WAHA_API_KEY=test-waha \
            -e BRIDGE_TOKEN=test-bridge \
            -p 127.0.0.1:18080:8080 \
            homeeasy-whatsapp-bridge:test
          for i in {1..20}; do curl -fsS http://127.0.0.1:18080/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:18080/health | grep -q '0.2.0'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/whatsapp/status)" = "401"
          docker stop he-bridge-test
      - name: Confirm phase 2 safety markers
        run: |
          grep -q 'api.homeeasy.com.co' infra/whatsapp/phase2-enable-https.sh
          grep -q 'reverse_proxy 127.0.0.1:8080' infra/whatsapp/install-https-domain.sh
          grep -q 'X-HomeEasy-Token' infra/whatsapp/phase2-enable-https.sh
          grep -q '401' infra/whatsapp/phase2-enable-https.sh
          echo PHASE2_VALIDATION_OK
