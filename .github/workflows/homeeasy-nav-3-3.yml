name: HomeEasy navigation 3.3 one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/homeeasy-nav-3-3.yml'

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply navigation patch
        run: python3 .github/scripts/homeeasy_nav_33.py

      - name: Validate
        shell: bash
        run: |
          node --check homeeasy-core.js
          grep -q "HomeEasy Core v3.3" homeeasy-core.js
          grep -q "homeeasy-core.js?v=3.3" index.html
          grep -q "HomeEasyCore.goHome" caja.html
          git diff --check -- homeeasy-core.js
          if git diff --name-only | grep -E '^(production/|products/|ar-sheer-v221/|.*\.glb$)' ; then
            echo 'Protected AR/product file changed unexpectedly.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          changed = set(__import__('subprocess').check_output(['git','diff','--name-only'], text=True).splitlines())
          if 'homeeasy-core.js' not in changed or 'index.html' not in changed or 'caja.html' not in changed:
              raise SystemExit('Expected navigation files are missing from diff')
          for name in changed:
              if name.endswith('.html'):
                  data = Path(name).read_bytes()
                  if b'homeeasy-core.js?v=3.1' in data:
                      raise SystemExit(f'Stale Core reference remains in {name}')
          print('Navigation diff validated:', ', '.join(sorted(changed)))
          PY

      - name: Commit navigation fix
        shell: bash
        run: |
          git config user.name "HomeEasy QA"
          git config user.email "homeeasy-qa@users.noreply.github.com"
          git add homeeasy-core.js *.html
          git commit -m "Fix instant return navigation to Home"
          git push origin HEAD:main
