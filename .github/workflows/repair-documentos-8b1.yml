name: Repair HomeEasy Documentos 8B.1

on:
  push:
    paths:
      - '.github/documentos-8b1-repair-trigger.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace documentos.html with audited 8B.1 build
        shell: bash
        run: |
          python3 - <<'PY2'
          import base64, gzip, hashlib, pathlib, re, subprocess

          path = pathlib.Path('documentos.html')
          if not path.exists():
              raise SystemExit('SAFETY STOP: documentos.html missing')
          index_before = hashlib.sha256(pathlib.Path('index.html').read_bytes()).hexdigest()
          payload = ''
          data = gzip.decompress(base64.b64decode(payload))
          expected = '403f7c09486debe6edb1a041d0e16d5ec48420d461b360694d43f4a31ca800b1'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'SAFETY STOP: decoded SHA {actual} != {expected}')
          text = data.decode('utf-8')
          required = [
              '<meta name="theme-color" content="#f2f2f7">',
              'class="topbar"',
              'class="tabs"',
              'data-tab="billing"',
              'data-tab="official"',
              'data-tab="history"',
              'HOMEEASY DOCUMENTOS 8B.1',
              'GET_DOCUMENTOS_SEGURA',
              'PREPARAR_CUENTA_COBRO',
              'GUARDAR_CUENTA_COBRO',
              'VALIDAR_SESION_DOCUMENTOS',
              'homeeasy-core.js?v=2.2'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('SAFETY STOP: missing intended markers: ' + ', '.join(missing))
          forbidden = ['class="app-header"', '--bg:#f5f5f7']
          present = [x for x in forbidden if x in text]
          if present:
              raise SystemExit('SAFETY STOP: wrong build markers present: ' + ', '.join(present))
          ids = re.findall(r'id="([^"]+)"', text)
          if len(ids) != len(set(ids)):
              raise SystemExit('SAFETY STOP: duplicate HTML IDs')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              tmp = pathlib.Path(f'/tmp/documentos-{i}.js')
              tmp.write_text(script, encoding='utf-8')
              subprocess.run(['node','--check',str(tmp)], check=True)
          path.write_bytes(data)
          if hashlib.sha256(pathlib.Path('index.html').read_bytes()).hexdigest() != index_before:
              raise SystemExit('SAFETY STOP: index.html changed')
          print('AUDITED_BUILD_SHA256=' + actual)
          PY2
      - name: Final scope check and commit
        shell: bash
        run: |
          grep -q 'HOMEEASY DOCUMENTOS 8B.1' documentos.html
          grep -q 'class="topbar"' documentos.html
          grep -q 'theme-color" content="#f2f2f7' documentos.html
          ! grep -q 'class="app-header"' documentos.html
          rm -f .github/workflows/repair-documentos-8b1.yml .github/documentos-8b1-repair-trigger.txt
          git config user.name 'HomeEasy Update'
          git config user.email 'actions@users.noreply.github.com'
          git add documentos.html .github/workflows/repair-documentos-8b1.yml .github/documentos-8b1-repair-trigger.txt
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' '.github/documentos-8b1-repair-trigger.txt' '.github/workflows/repair-documentos-8b1.yml' 'documentos.html' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'Repair audited HomeEasy document center build'
          git push
