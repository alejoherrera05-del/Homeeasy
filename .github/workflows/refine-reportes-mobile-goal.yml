name: refine reportes mobile goal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-reportes-mobile-goal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Simplify goal hero on mobile only
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('reportes.html')
          s=p.read_text(encoding='utf-8')
          if 'reportes-mobile-goal-v3' in s:
              raise SystemExit('mobile goal override already present')
          marker='<script src="homeeasy-core.js?v=3.5"></script>'
          if marker not in s:
              raise SystemExit('script marker missing')
          lines=[
            '<style id="reportes-mobile-goal-v3">',
            '@media (max-width:620px){',
            '.goal-hero{display:grid;grid-template-columns:minmax(0,1fr) 112px;grid-template-rows:auto auto;align-items:end;gap:0 12px;min-height:0;padding:21px 18px 15px;border-radius:25px}',
            '.goal-copy{grid-column:1/-1;grid-row:1;max-width:none;width:100%}',
            '.goal-kicker{gap:8px;font-size:15px}.goal-kicker i{width:32px;height:32px;border-radius:10px}',
            '.goal-label{margin-top:17px;font-size:14px}',
            '.goal-total-row{gap:9px;margin-top:5px;align-items:center}.goal-total{font-size:40px;line-height:1;white-space:nowrap}.edit-goal{width:36px;height:36px;border-radius:11px;font-size:14px;flex:0 0 auto}',
            '.goal-progress-copy{margin-top:18px;display:flex;align-items:baseline;gap:8px;flex-wrap:nowrap}.goal-progress-copy span{font-size:14.5px}.goal-achieved{font-size:29px;white-space:nowrap}',
            '.goal-remaining{margin-top:8px;font-size:13.5px;line-height:1.4}',
            '.goal-copy:after{content:"";display:block;height:1px;margin-top:17px;background:linear-gradient(90deg,rgba(60,60,67,.08),rgba(60,60,67,.025),transparent)}',
            '.ring-wrap{grid-column:1;grid-row:2;width:100%;padding-top:15px;align-items:center;justify-self:stretch}',
            '.ring{width:126px;height:126px;box-shadow:none}.ring:after{inset:13px}.ring-center strong{font-size:31px}.ring-center span{margin-top:6px;font-size:12.5px}',
            '.ring-note{display:none!important}',
            '.hommy-stage{grid-column:2;grid-row:2;display:block;position:relative;align-self:end;min-height:138px;height:138px;padding-top:15px;overflow:visible}',
            '.hommy-bubble{display:none!important}',
            '.hommy-art{min-height:123px;height:123px}.hommy-art:before{width:104px;height:104px;right:0;bottom:3px;background:rgba(255,255,255,.58);box-shadow:0 12px 30px rgba(178,86,108,.06)}',
            '.hommy-art img{width:118px;max-height:142px;right:-8px;bottom:-13px;filter:drop-shadow(0 10px 18px rgba(48,35,40,.10))}',
            '}',
            '@media (max-width:380px){',
            '.goal-hero{grid-template-columns:minmax(0,1fr) 96px;padding:19px 15px 14px;gap:0 8px}',
            '.goal-total{font-size:35px}.goal-achieved{font-size:26px}.goal-progress-copy span{font-size:13.5px}.goal-remaining{font-size:13px}',
            '.ring{width:116px;height:116px}.ring:after{inset:12px}.ring-center strong{font-size:28px}.ring-center span{font-size:11.5px}',
            '.hommy-stage{min-height:126px;height:126px}.hommy-art{min-height:111px;height:111px}.hommy-art:before{width:92px;height:92px}.hommy-art img{width:104px;max-height:128px;right:-7px}',
            '}',
            '</style>',
            ''
          ]
          css='\n'.join(lines)
          s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'reportes-mobile-goal-v3' reportes.html
          grep -q '.ring-note{display:none!important}' reportes.html
          grep -q 'grid-template-columns:minmax(0,1fr) 112px' reportes.html
          git diff --check
      - name: Commit mobile goal refinement
        run: |
          git config user.name 'homeeasy-ci'
          git config user.email 'homeeasy-ci@users.noreply.github.com'
          git add reportes.html
          git commit -m 'Refine sales goal card for mobile'
          git push
