name: Patch WhatsApp Context 10C

on:
  push:
    branches:
      - whatsapp-context-10c
    paths:
      - '.github/workflows/patch-whatsapp-context-10c.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: whatsapp-context-10c
          fetch-depth: 0

      - name: Patch bridge server
        run: python infra/whatsapp/patch_context_10c.py

      - name: Validate bridge syntax
        run: |
          node --check infra/whatsapp/bridge/server.js
          node --check infra/whatsapp/bridge/conversation.js

      - name: Commit patched bridge
        run: |
          if git diff --quiet -- infra/whatsapp/bridge/server.js; then
            echo 'No server patch required.'
            exit 0
          fi
          git config user.name 'homeeasy-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add infra/whatsapp/bridge/server.js
          git commit -m 'Expose authenticated WhatsApp conversation context'
          git push origin HEAD:whatsapp-context-10c
