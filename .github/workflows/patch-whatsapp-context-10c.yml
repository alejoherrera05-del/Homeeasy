name: Patch WhatsApp Context 10C

on:
  push:
    branches:
      - whatsapp-context-10c
    paths:
      - '.github/workflows/patch-whatsapp-context-10c.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: whatsapp-context-10c
          fetch-depth: 0

      - name: Patch bridge server
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('infra/whatsapp/bridge/server.js')
          text = path.read_text(encoding='utf-8')

          require_anchor = "const ops = require('./operations');"
          require_line = "const conversation = require('./conversation');"
          if require_line not in text:
              if require_anchor not in text:
                  raise SystemExit('operations require anchor missing')
              text = text.replace(require_anchor, require_anchor + '\n' + require_line, 1)

          text = text.replace("const BRIDGE_VERSION = '0.5.0';", "const BRIDGE_VERSION = '0.6.0';", 1)

          helper_anchor = "function documentPermission(payload, actor) {"
          helper = r'''
async function getConversationContext(phoneValue, options) {
  const opts = options && typeof options === 'object' ? options : {};
  const session = await getSession();
  if (!session || session.status !== 'WORKING') {
    const error = new Error(`WhatsApp is not ready (${session ? session.status : 'MISSING'})`);
    error.statusCode = 503;
    error.details = publicSession(session);
    throw error;
  }

  const phone = normalizePhone(phoneValue);
  const chatId = `${phone}@c.us`;
  const limit = Math.max(1, Math.min(80, Number(opts.limit || 50)));
  const sinceMs = conversation.timestampMs(opts.since);
  const params = new URLSearchParams({
    limit: String(limit),
    downloadMedia: 'false'
  });
  if (sinceMs) params.set('filter.timestamp.gte', String(Math.floor(sinceMs / 1000)));

  let rawMessages = [];
  try {
    rawMessages = await wahaRequest(
      'GET',
      `/api/${encodeURIComponent(WAHA_SESSION)}/chats/${encodeURIComponent(chatId)}/messages?${params.toString()}`
    );
  } catch (error) {
    if (Number(error.statusCode || 0) !== 404) throw error;
  }

  const messages = conversation.normalizeMessages(rawMessages, { since: opts.since, limit });
  const activity = conversation.normalizeActivity(ops.getActivity(150), {
    phone,
    since: opts.since,
    reference: opts.reference
  });
  const evidence = conversation.buildConversationEvidence(messages, activity);

  return {
    ok: true,
    source: 'WAHA_WEBJS',
    session: WAHA_SESSION,
    messages,
    activity,
    evidence,
    serverTime: new Date().toISOString()
  };
}

'''
          if 'async function getConversationContext(' not in text:
              if helper_anchor not in text:
                  raise SystemExit('documentPermission anchor missing')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          route_anchor = "  if (req.method === 'GET' && url.pathname === '/api/whatsapp/templates') {"
          route = r'''  if (req.method === 'GET' && url.pathname === '/api/whatsapp/conversation') {
    await auth.authorize(req, 'cotizaciones.read');
    const result = await getConversationContext(url.searchParams.get('phone') || '', {
      reference: url.searchParams.get('reference') || '',
      since: url.searchParams.get('since') || '',
      limit: url.searchParams.get('limit') || 50
    });
    return json(res, 200, result);
  }

'''
          if "url.pathname === '/api/whatsapp/conversation'" not in text:
              if route_anchor not in text:
                  raise SystemExit('templates route anchor missing')
              text = text.replace(route_anchor, route + route_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate bridge syntax
        run: |
          node --check infra/whatsapp/bridge/server.js
          node --check infra/whatsapp/bridge/conversation.js

      - name: Commit patched bridge
        run: |
          if git diff --quiet -- infra/whatsapp/bridge/server.js; then
            echo 'No server patch required.'
            exit 0
          fi
          git config user.name 'homeeasy-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add infra/whatsapp/bridge/server.js
          git commit -m 'Expose authenticated WhatsApp conversation context'
          git push origin HEAD:whatsapp-context-10c
