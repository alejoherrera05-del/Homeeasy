name: HomeEasy navigation 3.3 finish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/homeeasy-nav-3-3-finish.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Accept any unexpired cached HomeEasy session
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('homeeasy-core.js')
          s=p.read_text(encoding='utf-8')
          old="""        const validatedAt = Number(session.appSessionValidatedAt || 0);\n        return validatedAt > 0 && Date.now() - validatedAt <= 5 * 60 * 1000;"""
          new="""        return true;"""
          if old not in s:
              raise SystemExit('Expected cached-session block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check homeeasy-core.js
          git diff --check -- homeeasy-core.js
          git diff --name-only | grep -qx 'homeeasy-core.js'
      - name: Commit
        shell: bash
        run: |
          git config user.name "HomeEasy QA"
          git config user.email "homeeasy-qa@users.noreply.github.com"
          git add homeeasy-core.js
          git commit -m "Keep Home return instant for active sessions"
          git push origin HEAD:main
