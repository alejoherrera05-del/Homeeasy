name: Stage WhatsApp Bridge 0.7.1 Audit

on:
  push:
    branches:
      - seguimiento-fluid-10f
    paths:
      - 'scripts/patch_whatsapp_bridge_audit_071.py'
      - '.github/workflows/whatsapp-bridge-071-stage.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: seguimiento-fluid-10f
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Bridge 0.7.1 audit patch
        run: python scripts/patch_whatsapp_bridge_audit_071.py
      - name: Validate bridge and updater
        run: |
          node --check infra/whatsapp/bridge/server.js
          node --check infra/whatsapp/bridge/conversation.js
          node --check infra/whatsapp/bridge/auth.js
          bash -n infra/whatsapp/update-bridge.sh
      - name: Run conversation and follow-up smoke suite
        run: |
          node infra/whatsapp/bridge/test-conversation.js
          node infra/whatsapp/bridge/test-conversation-smoke.js
          node infra/whatsapp/bridge/test-followup-send-smoke.js
      - name: Verify message ID normalization and version contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('infra/whatsapp/bridge/server.js').read_text(encoding='utf-8')
          updater = Path('infra/whatsapp/update-bridge.sh').read_text(encoding='utf-8')
          smoke = Path('infra/whatsapp/bridge/test-followup-send-smoke.js').read_text(encoding='utf-8')
          assert "const BRIDGE_VERSION = '0.7.1'" in source
          assert 'function normalizeMessageIdValue' in source
          assert 'function extractMessageId' in source
          assert "clean !== '[object Object]'" in source
          assert 'record.messageId = extractMessageId(result);' in source
          assert 'EXPECTED_VERSION="0.7.1"' in updater
          assert "id: { _serialized: `msg-${sendCount}`" in smoke
          for name in ('whatsapp-context-qa.yml', 'whatsapp-followup-send-10d-qa.yml'):
              text = (Path('.github/workflows') / name).read_text(encoding='utf-8')
              assert '0.7.1' in text and '0.7.0' not in text
          print('Bridge 0.7.1 object Message_ID normalization: PASS')
          PY
      - name: Diff hygiene
        run: git diff --check
      - name: Commit certified Bridge 0.7.1 patch
        run: |
          git config user.name 'homeeasy-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add infra/whatsapp/bridge/server.js infra/whatsapp/bridge/test-followup-send-smoke.js infra/whatsapp/update-bridge.sh .github/workflows/whatsapp-context-qa.yml .github/workflows/whatsapp-followup-send-10d-qa.yml
          if git diff --cached --quiet; then
            echo 'No Bridge runtime changes to commit'
          else
            git commit -m 'WhatsApp Bridge 0.7.1: normalize WebJS message IDs'
            git push origin HEAD:seguimiento-fluid-10f
          fi
