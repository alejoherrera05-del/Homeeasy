name: Seguimiento Hommy QA

on:
  push:
    branches:
      - main
      - hommy-followup-ui-10b
      - seguimiento-hommy-loader-10c2
    paths:
      - 'seguimiento.html'
      - 'seguimiento-hommy.js'
      - 'tests/seguimiento-hommy-10b-qa.mjs'
      - '.github/workflows/seguimiento-hommy-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate extension syntax
        run: node --check seguimiento-hommy.js

      - name: Install ephemeral browser-test dependency
        run: npm install --no-save --no-package-lock jsdom@24.1.3

      - name: Run Seguimiento Hommy browser contract
        run: node tests/seguimiento-hommy-10b-qa.mjs

      - name: Verify REVIEW-only boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('seguimiento.html').read_text(encoding='utf-8')
          source = Path('seguimiento-hommy.js').read_text(encoding='utf-8')
          tag = '<script src="seguimiento-hommy.js?v=10c2" defer></script>'
          assert page.count(tag) == 1, 'Seguimiento must load the Hommy extension exactly once'
          assert 'seguimiento-hommy.js?v=10c2-retry' in page, 'Seguimiento must retry the Hommy extension after a transient loader failure'
          assert 'const REQUEST_TIMEOUT_MS = 90_000;' in source, 'Seguimiento must keep enough time budget for the review endpoint'
          assert '/api/hommy/followup/plan' in source
          assert source.count('fetch(') == 1, '10B UI should have a single network path'
          for forbidden in (
              'ACTUALIZAR_ESTADO_SEGUIMIENTO_IA',
              'REGISTRAR_EVENTO_SEGUIMIENTO',
              '/api/whatsapp/',
              'nuevoEstado',
              'notasSeguimiento',
              'sendText(',
          ):
              assert forbidden not in source, f'REVIEW-only boundary violated: {forbidden}'
          print('Seguimiento Hommy remains REVIEW-only and loader-resilient')
          PY

      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
