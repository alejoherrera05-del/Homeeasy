name: patch reportes v4 guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-reportes-v4-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register reportes v4 in page guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('homeeasy-page-guard.js')
          s=p.read_text()
          needle="        'reportes.html': 'reportes.read',\n"
          addition="        'reportes.html': 'reportes.read',\n        'reportes-diseno-v4.html': 'reportes.read',\n"
          if "'reportes-diseno-v4.html': 'reportes.read'" not in s:
              if needle not in s:
                  raise SystemExit('reportes.html guard entry not found')
              s=s.replace(needle, addition, 1)
              p.write_text(s)
          PY

      - name: Commit guard patch
        run: |
          if git diff --quiet; then
            echo 'Guard already patched.'
            exit 0
          fi
          git config user.name 'homeeasy-ci'
          git config user.email 'homeeasy-ci@users.noreply.github.com'
          git add homeeasy-page-guard.js
          git commit -m 'Authorize reportes v4 through page guard'
          git push origin HEAD:main
