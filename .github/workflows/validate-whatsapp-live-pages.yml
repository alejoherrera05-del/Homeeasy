name: validate deployed WhatsApp Configuracion

on:
  push:
    branches: [fix/whatsapp-config-isolated]
    paths:
      - '.github/workflows/validate-whatsapp-live-pages.yml'

jobs:
  live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore validated browser QA harness
        run: |
          git show eac362a:tools/qa-whatsapp-full-config.js > qa-live-pages.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa-live-pages.js')
          s=p.read_text()
          s=s.replace("const BASE = 'http://127.0.0.1:4173/configuracion.html';", "const BASE = 'https://alejoherrera05-del.github.io/Homeeasy/configuracion.html';")
          p.write_text(s)
          PY
      - name: Install Playwright browsers
        run: |
          npm install --no-save playwright@1.58.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit
      - name: Run live GitHub Pages isolation smoke test
        run: node qa-live-pages.js
