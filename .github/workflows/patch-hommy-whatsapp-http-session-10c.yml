name: Patch Hommy WhatsApp HTTP Session 10C

on:
  push:
    branches:
      - hommy-whatsapp-context-10c
    paths:
      - '.github/workflows/patch-hommy-whatsapp-http-session-10c.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hommy-whatsapp-context-10c
          fetch-depth: 0

      - name: Patch HTTP client and tests
        run: python hommy_backend/patch_whatsapp_http_session_10c.py

      - name: Validate syntax
        run: |
          python -m py_compile hommy_backend/whatsapp_context.py tests/test_hommy_whatsapp_context.py

      - name: Commit fix
        run: |
          if git diff --quiet -- hommy_backend/whatsapp_context.py tests/test_hommy_whatsapp_context.py; then
            echo 'No HTTP-session patch required.'
            exit 0
          fi
          git config user.name 'homeeasy-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add hommy_backend/whatsapp_context.py tests/test_hommy_whatsapp_context.py
          git commit -m 'Use isolated session for WhatsApp context reads'
          git push origin HEAD:hommy-whatsapp-context-10c
