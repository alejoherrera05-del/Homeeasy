name: Publish HomeEasy stable 3.1 final

on:
  push:
    branches: [release/stable-3-1]
    paths:
      - '.github/workflows/publish-stable-3-1-final.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/stable-3-1
          fetch-depth: 0

      - name: Fetch production base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

      - name: Recover exact audited patch from repository history
        shell: bash
        run: |
          set -euo pipefail
          git show 98c6caf6c335e194a5533b0488325b91c83cae46:.release/stable-final.patch.gz > /tmp/stable-final.patch.gz
          echo 'e82c48e821ca70882496acca15c7aebad12273acaf6a8486a68f86abf4e58296  /tmp/stable-final.patch.gz' | sha256sum -c -
          gzip -dc /tmp/stable-final.patch.gz > /tmp/stable-final.patch
          echo '655e763fd25155855f9ea6fed8b9b05b49feee467d930d7e9194afef47e78d53  /tmp/stable-final.patch' | sha256sum -c -

      - name: Normalize and apply stable patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          targets = [
            'login.html','homeeasy-auth-config.js','homeeasy-auth.js','homeeasy-page-guard.js',
            'homeeasy-account.js','homeeasy-settings-auth-ui.js','homeeasy-core.js','index.html',
            'clientes.html','ventas.html','cotizacion.html','seguimiento.html','pedido.html','abono.html',
            'caja.html','documentos.html','calendario.html','reportes.html','configuracion.html',
            'Hommychat.html','asistente.html'
          ]
          for name in targets:
              p=Path(name)
              if p.exists(): p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n'))
          PY
          patch --batch --forward -p1 < /tmp/stable-final.patch

      - name: Restore verified HQ login assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9622545434/zip" \
            -o /tmp/homeeasy-hq-artifact.zip
          rm -rf /tmp/homeeasy-hq-artifact /tmp/homeeasy-hq
          mkdir -p /tmp/homeeasy-hq-artifact /tmp/homeeasy-hq
          unzip -q /tmp/homeeasy-hq-artifact.zip -d /tmp/homeeasy-hq-artifact
          inner_zip=$(find /tmp/homeeasy-hq-artifact -maxdepth 2 -type f -name '*.zip' | head -n 1 || true)
          if [ -n "$inner_zip" ]; then unzip -q "$inner_zip" -d /tmp/homeeasy-hq; else cp -R /tmp/homeeasy-hq-artifact/. /tmp/homeeasy-hq/; fi
          test -f /tmp/homeeasy-hq/assets/auth/hommy-crossed.webp
          test -f /tmp/homeeasy-hq/assets/auth/login-bg-desktop.webp
          test -f /tmp/homeeasy-hq/assets/auth/login-bg-mobile.webp
          mkdir -p assets/auth
          cp /tmp/homeeasy-hq/assets/auth/hommy-crossed.webp assets/auth/hommy-crossed.webp
          cp /tmp/homeeasy-hq/assets/auth/login-bg-desktop.webp assets/auth/login-bg-desktop.webp
          cp /tmp/homeeasy-hq/assets/auth/login-bg-mobile.webp assets/auth/login-bg-mobile.webp
          test $(stat -c%s assets/auth/hommy-crossed.webp) -gt 250000
          test $(stat -c%s assets/auth/login-bg-desktop.webp) -gt 70000
          test $(stat -c%s assets/auth/login-bg-mobile.webp) -gt 60000

      - name: Final crisp login composition
        shell: python
        run: |
          from pathlib import Path
          p=Path('login.html')
          s=p.read_text(encoding='utf-8')
          override='''\n/* HomeEasy stable 3.1 — composición HQ sin reescalado borroso */\n.visual .watermark{display:block!important;position:absolute!important;z-index:1!important;top:50%!important;left:50%!important;width:80%!important;height:auto!important;transform:translate(-57%,-52%)!important;opacity:.16!important;filter:brightness(.48) saturate(.75)!important;pointer-events:none!important}\n.visual .hommy{display:block!important;position:absolute!important;z-index:2!important;left:50%!important;bottom:-4%!important;width:auto!important;height:min(88%,850px)!important;max-width:94%!important;transform:translateX(-54%)!important;object-fit:contain!important;object-position:center bottom!important;image-rendering:auto!important;filter:none!important;pointer-events:none!important}\n'''
          s=s.replace('</style>',override+'</style>',1)
          p.write_text(s,encoding='utf-8')

      - name: Full stable QA
        shell: bash
        run: |
          set -euo pipefail
          for f in homeeasy-auth-config.js homeeasy-auth.js homeeasy-page-guard.js homeeasy-account.js homeeasy-settings-auth-ui.js homeeasy-core.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          htmls=sorted(Path('.').glob('*.html')); failures=[]
          for p in htmls:
              text=p.read_text(encoding='utf-8',errors='replace')
              for i,script in enumerate(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',text,re.I|re.S)):
                  if not script.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(script); tmp=f.name
                  r=subprocess.run(['node','--check',tmp],capture_output=True,text=True); Path(tmp).unlink(missing_ok=True)
                  if r.returncode: failures.append(f'{p}:{i}: {r.stderr.strip()}')
          if failures: print('\n'.join(failures)); sys.exit(1)
          print(f'Inline JS OK: {len(htmls)} HTML files')
          PY
          test -f login.html && test -f perfil.html && test -f activar-cuenta.html
          grep -q 'Bienvenido' login.html
          grep -q 'assets/auth/login-bg-desktop.webp' login.html
          grep -q 'assets/auth/login-bg-mobile.webp' login.html
          grep -q 'assets/auth/hommy-crossed.webp' login.html
          grep -q 'class="watermark" src="triangulo.png"' login.html
          grep -q 'Cuenta de cobro' configuracion.html
          grep -q 'Usuarios y roles' homeeasy-settings-auth-ui.js
          grep -q 'ultimaConexion' homeeasy-settings-auth-ui.js
          grep -q 'AUTH_INVITAR_USUARIO' homeeasy-settings-auth-ui.js
          grep -q 'AUTH_ACTIVAR_INVITACION' activar-cuenta.html
          ! grep -q '<option value="Alejandro">Alejandro</option>' configuracion.html
          ! grep -q 'VALIDAR_PIN_CONFIGURACION' configuracion.html
          for f in clientes.html ventas.html cotizacion.html seguimiento.html pedido.html abono.html caja.html documentos.html calendario.html reportes.html configuracion.html Hommychat.html asistente.html; do grep -q 'homeeasy-page-guard.js?v=3.1' "$f"; done
          ! grep -R --include='*.html' -n 'HOMMY.png' .

      - name: Verify AR byte-identical to production
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet origin/main -- ar-homeeasy-v3.html ar-homeeasy-v4-quicklook.html ar-sheer-v221; then
            echo 'ERROR: AR differs from production.' >&2
            git diff --name-only origin/main -- ar-homeeasy-v3.html ar-homeeasy-v4-quicklook.html ar-sheer-v221 >&2
            exit 1
          fi

      - name: Create clean stable release tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release .release2 .release3 .release4 .release5 .release6 .release7 \
            .github/workflows/apply-stable-3-1.yml \
            .github/workflows/publish-stable-3-1-final.yml \
            RELEASE_STABLE_3_1_UPLOAD_MARKER.tmp
          git config user.name 'HomeEasy Release Bot'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Prepare HomeEasy stable 3.1 frontend'
          git push origin HEAD:release/stable-3-1

      - name: Publish one clean commit to main
        shell: bash
        run: |
          set -euo pipefail
          release_sha=$(git rev-parse HEAD)
          git fetch origin main
          main_sha=$(git rev-parse origin/main)
          if ! git merge-base --is-ancestor "$main_sha" "$release_sha"; then echo 'ERROR: main advanced independently.' >&2; exit 1; fi
          if ! git diff --quiet "$main_sha" "$release_sha" -- ar-homeeasy-v3.html ar-homeeasy-v4-quicklook.html ar-sheer-v221; then echo 'ERROR: AR differs.' >&2; exit 1; fi
          rm -rf /tmp/homeeasy-prod
          git worktree add --detach /tmp/homeeasy-prod "$main_sha"
          cd /tmp/homeeasy-prod
          git read-tree --reset -u "$release_sha"
          test ! -d .release && test ! -d .release6
          test ! -e .github/workflows/publish-stable-3-1-final.yml
          git config user.name 'HomeEasy Release Bot'
          git config user.email 'actions@github.com'
          git commit -m 'Publish HomeEasy stable 3.1 authentication and profiles'
          git push origin HEAD:main
          echo "Published main: $(git rev-parse HEAD)"
