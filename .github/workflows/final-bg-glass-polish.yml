name: Final Background Glass Polish

on:
  push:
    paths:
      - '.github/final-bg-glass-trigger.txt'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only background and glass CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          def blob_sha(path):
              raw=Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()

          cfg=Path('configuracion.html')
          idx=Path('index.html')
          if blob_sha(cfg) != '3eae01960a90851480c108b3162c7a43ae5418b9':
              raise SystemExit('SAFETY STOP: configuracion.html changed since audit')
          if blob_sha(idx) != '94ee6c9ffdc2f041b02d8452bd971499d25aad9d':
              raise SystemExit('SAFETY STOP: index.html changed since audit')

          c=cfg.read_text(encoding='utf-8')
          i=idx.read_text(encoding='utf-8')
          c_app=c[c.index('<main class="settings-app"'):]
          i_body=i[i.index('<body ontouchstart="">'):]
          c_ids=set(re.findall(r'id="([^"]+)"',c)); i_ids=set(re.findall(r'id="([^"]+)"',i))
          c_js=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',c,re.S)
          i_js=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',i,re.S)

          replacements_cfg=[
              ('<meta name="theme-color" content="#a6455a">','<meta name="theme-color" content="#aa485f">'),
              ('background: #a9485f;','background: #aa485f;'),
              ('linear-gradient(160deg, #934658 0%, #a9485f 56%, #bf6e7f 100%);','linear-gradient(160deg, #934658 0%, #a9485f 56%, #aa485f 100%);'),
              ('background: rgba(255,255,255,.36);','background: rgba(255,255,255,.32);'),
              ('backdrop-filter: blur(30px) saturate(132%) brightness(1.05);','backdrop-filter: blur(26px) saturate(128%) brightness(1.045);'),
              ('-webkit-backdrop-filter: blur(30px) saturate(132%) brightness(1.05);','-webkit-backdrop-filter: blur(26px) saturate(128%) brightness(1.045);'),
              ('background: linear-gradient(145deg, rgba(255,255,255,.22), rgba(255,255,255,.08) 58%, rgba(255,255,255,.03));','background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.06) 58%, rgba(255,255,255,.02));'),
              ('background: rgba(255,255,255,.38);','background: rgba(255,255,255,.33);'),
              ('backdrop-filter: blur(28px) saturate(128%) brightness(1.055);','backdrop-filter: blur(24px) saturate(124%) brightness(1.045);'),
              ('-webkit-backdrop-filter: blur(28px) saturate(128%) brightness(1.055);','-webkit-backdrop-filter: blur(24px) saturate(124%) brightness(1.045);')
          ]
          for old,new in replacements_cfg:
              if c.count(old)!=1:
                  raise SystemExit('SAFETY STOP config target mismatch: '+old[:55])
              c=c.replace(old,new,1)

          old='body {\n    background: var(--ios-bg);'
          new='body {\n    background: var(--home-red);'
          if i.count(old)!=1:
              raise SystemExit('SAFETY STOP index body background target mismatch')
          i=i.replace(old,new,1)

          # Strict regression barriers
          if c[c.index('<main class="settings-app"'):] != c_app:
              raise SystemExit('SAFETY STOP: Config internal app changed')
          if i[i.index('<body ontouchstart="">'):] != i_body:
              raise SystemExit('SAFETY STOP: Index body/markup/logic changed')
          if set(re.findall(r'id="([^"]+)"',c)) != c_ids or set(re.findall(r'id="([^"]+)"',i)) != i_ids:
              raise SystemExit('SAFETY STOP: IDs changed')
          if re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',c,re.S) != c_js:
              raise SystemExit('SAFETY STOP: Config JS changed')
          if re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',i,re.S) != i_js:
              raise SystemExit('SAFETY STOP: Index JS changed')

          cfg.write_text(c,encoding='utf-8',newline='\n')
          idx.write_text(i,encoding='utf-8',newline='\n')
          PY
      - name: Validate final visual constants
        shell: bash
        run: |
          grep -q '<meta name="theme-color" content="#aa485f">' configuracion.html
          grep -q 'linear-gradient(160deg, #934658 0%, #a9485f 56%, #aa485f 100%);' configuracion.html
          grep -q 'background: rgba(255,255,255,.33);' configuracion.html
          grep -q 'body {' index.html
          grep -q 'background: var(--home-red);' index.html
          grep -q 'height: calc(100dvh + env(safe-area-inset-bottom, 0px));' configuracion.html
          grep -q 'height: calc(100dvh + env(safe-area-inset-bottom, 0px));' index.html
          grep -q 'HOMEEASY INDEX 4.3 — POLISH DE MICROINTERACCIONES' index.html
          grep -q 'CONFIGURACIÓN 4.1 — CABECERA ÚNICA + GLASS NEUTRO' configuracion.html
      - name: Commit and clean temporary deployment files
        shell: bash
        run: |
          rm -f .github/workflows/final-bg-glass-polish.yml .github/final-bg-glass-trigger.txt
          git config user.name 'HomeEasy Update'
          git config user.email 'actions@users.noreply.github.com'
          git add configuracion.html index.html .github/workflows/final-bg-glass-polish.yml .github/final-bg-glass-trigger.txt
          git commit -m 'Polish HomeEasy system backgrounds and Config glass'
          git push
