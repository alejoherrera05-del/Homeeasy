name: validate WhatsApp device-bound auth

on:
  push:
    branches: [fix/whatsapp-device-auth]
    paths:
      - 'infra/whatsapp/bridge/auth.js'
      - 'homeeasy-whatsapp-client.js'
      - '.github/workflows/validate-whatsapp-device-auth.yml'

jobs:
  device-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Static safety checks
        run: |
          node --check infra/whatsapp/bridge/auth.js
          node --check homeeasy-whatsapp-client.js
          ! grep -q 'restoreHomeEasySession' homeeasy-whatsapp-client.js
          ! grep -q 'signOut' homeeasy-whatsapp-client.js
          grep -q 'X-HomeEasy-Device-Id' homeeasy-whatsapp-client.js
          grep -q 'x-homeeasy-device-id' infra/whatsapp/bridge/auth.js
      - name: Test Bridge device-bound auth
        run: |
          node <<'NODE'
          const assert = require('assert');
          process.env.BRIDGE_TOKEN = 'internal-secret';
          process.env.HOMEEASY_ALLOWED_ORIGINS = 'https://alejoherrera05-del.github.io';
          let mode = 'ok';
          let backendCalls = 0;
          let lastBody = null;
          global.fetch = async (_url, options) => {
            backendCalls++;
            lastBody = JSON.parse(options.body || '{}');
            if (mode === 'wrong-device') {
              return new Response(JSON.stringify({ status:'error', valido:false, code:'DEVICE_MISMATCH' }), { status:200, headers:{'content-type':'application/json'} });
            }
            return new Response(JSON.stringify({
              status:'success', valido:true,
              perfil:{uid:'qa-user',nombre:'QA',email:'qa@homeeasy.test',rol:'ADMINISTRADOR',estado:'ACTIVO'},
              permisos:['*','config.read']
            }), { status:200, headers:{'content-type':'application/json'} });
          };
          const auth = require('./infra/whatsapp/bridge/auth.js');
          const req = headers => ({ headers:{ origin:'https://alejoherrera05-del.github.io', ...headers } });

          (async()=>{
            const good = req({
              'x-homeeasy-session':'session-good',
              'x-homeeasy-device-id':encodeURIComponent('device-123'),
              'x-homeeasy-device-name':encodeURIComponent('iPhone · Safari'),
              'x-homeeasy-platform':encodeURIComponent('iPhone'),
              'x-homeeasy-browser':encodeURIComponent('Safari')
            });
            const actor = await auth.authorize(good, 'config.read');
            assert.strictEqual(actor.profile.uid, 'qa-user');
            assert.strictEqual(lastBody.meta.dispositivoId, 'device-123');
            assert.strictEqual(lastBody.meta.dispositivoNombre, 'iPhone · Safari');
            assert.strictEqual(lastBody.meta.plataforma, 'iPhone');
            assert.strictEqual(lastBody.meta.navegador, 'Safari');

            const callsAfterGood = backendCalls;
            await auth.authorize(good, 'config.read');
            assert.strictEqual(backendCalls, callsAfterGood, 'same token+device should use cache');

            let missing;
            try { await auth.authorize(req({'x-homeeasy-session':'session-missing'}), 'config.read'); }
            catch (e) { missing = e; }
            assert(missing);
            assert.strictEqual(missing.statusCode, 401);
            assert.strictEqual(missing.details.code, 'DEVICE_CONTEXT_REQUIRED');

            mode = 'wrong-device';
            let wrong;
            try {
              await auth.authorize(req({
                'x-homeeasy-session':'session-wrong',
                'x-homeeasy-device-id':encodeURIComponent('wrong-device')
              }), 'config.read');
            } catch (e) { wrong = e; }
            assert(wrong);
            assert.strictEqual(wrong.statusCode, 401);
            assert.strictEqual(wrong.details.code, 'DEVICE_MISMATCH');

            const headers = {};
            const res = { setHeader:(k,v)=>{headers[k]=v;} };
            assert.strictEqual(auth.applyCors(good, res), true);
            assert(String(headers['Access-Control-Allow-Headers']).includes('X-HomeEasy-Device-Id'));

            console.log('BRIDGE_DEVICE_AUTH_OK');
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
      - name: Test browser client forwards device context
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          let request = null;
          const window = {
            HomeEasyAuth:{getAppSessionToken:()=> 'session-good'},
            HomeEasyCore:{getDeviceInfo:()=>({id:'device-123',name:'iPhone · Safari',platform:'iPhone',browser:'Safari'})},
            fetch:async (url,opts)=>{request={url,opts};return new Response(JSON.stringify({ok:true,whatsapp:{status:'WORKING'}}),{status:200,headers:{'content-type':'application/json'}});},
            setTimeout,
            clearTimeout,
            AbortController,
            encodeURIComponent,
            Response
          };
          window.window = window;
          vm.createContext(window);
          vm.runInContext(fs.readFileSync('homeeasy-whatsapp-client.js','utf8'), window);
          window.HomeEasyWhatsApp.status().then(()=>{
            assert(request);
            assert.strictEqual(request.opts.headers['X-HomeEasy-Session'],'session-good');
            assert.strictEqual(decodeURIComponent(request.opts.headers['X-HomeEasy-Device-Id']),'device-123');
            assert.strictEqual(decodeURIComponent(request.opts.headers['X-HomeEasy-Device-Name']),'iPhone · Safari');
            assert.strictEqual(decodeURIComponent(request.opts.headers['X-HomeEasy-Platform']),'iPhone');
            assert.strictEqual(decodeURIComponent(request.opts.headers['X-HomeEasy-Browser']),'Safari');
            console.log('CLIENT_DEVICE_CONTEXT_OK');
          }).catch(err=>{console.error(err);process.exit(1);});
          NODE
