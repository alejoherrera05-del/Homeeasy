name: Apply Config Login 4.1c

on:
  push:
    paths:
      - '.github/config-trigger-4-1c'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guarded visual-only patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, base64, re
          D=lambda v: base64.b64decode(v).decode('utf-8')
          p=Path('configuracion.html'); raw=p.read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          if sha!='4f2bd59b49307d739080633b2818fc821cf7d46a': raise SystemExit('SAFETY STOP: production base changed')
          s=raw.decode('utf-8')
          old=D('')
          new=D('')
          oldcap=D('PGRpdiBjbGFzcz0iYWNjZXNzLWNhcHRpb24iPkFjY2VzbyBhZG1pbmlzdHJhdGl2byDCtyBTaXN0ZW1hIEhvbW15PC9kaXY+')
          newcap=D('PGRpdiBjbGFzcz0iYWNjZXNzLWNhcHRpb24iPlNpc3RlbWEgSG9tbXk8L2Rpdj4=')
          css=D('')
          if s.count(old)!=1 or s.count(oldcap)!=1: raise SystemExit('SAFETY STOP: unexpected production HTML')
          ids=re.findall(r'id="([^"]+)"',s); app=s[s.index('<main class="settings-app"'):]
          apph=hashlib.sha256(app.encode()).hexdigest(); jsh=hashlib.sha256('\n'.join(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S)).encode()).hexdigest()
          s=s.replace(old,new,1).replace(oldcap,newcap,1).replace('</style>',css+'\n    </style>',1)
          if re.findall(r'id="([^"]+)"',s)!=ids: raise SystemExit('SAFETY STOP: IDs changed')
          if hashlib.sha256(s[s.index('<main class="settings-app"'):].encode()).hexdigest()!=apph: raise SystemExit('SAFETY STOP: app changed')
          if hashlib.sha256('\n'.join(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S)).encode()).hexdigest()!=jsh: raise SystemExit('SAFETY STOP: JS changed')
          p.write_text(s,encoding='utf-8',newline='\n')
          print('PASS regression barriers')
          PY
      - name: Commit and clean deployment helpers
        shell: bash
        run: |
          rm -f .github/config-trigger-4-1c .github/workflows/apply-config-login-4-1.yml .github/workflows/apply-config-login-4-1b.yml .github/workflows/apply-config-login-4-1c.yml
          git config user.name "HomeEasy Update"
          git config user.email "actions@users.noreply.github.com"
          git add configuracion.html .github
          git commit -m "Polish Configuración login 4.1"
          git push
