name: validate full Configuracion WhatsApp isolation

on:
  push:
    branches:
      - fix/whatsapp-config-isolated
    paths:
      - 'homeeasy-whatsapp-client.js'
      - 'homeeasy-whatsapp-settings.js'
      - 'configuracion.html'
      - 'tools/qa-whatsapp-full-config.js'
      - '.github/workflows/validate-whatsapp-full-config.yml'

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply isolated WhatsApp loaders to Configuracion workspace
        run: |
          python3 tools/patch-whatsapp-config-branch.py
          grep -q 'homeeasy-whatsapp-client.js?v=0.2' configuracion.html
          grep -q 'homeeasy-whatsapp-settings.js?v=0.2' configuracion.html

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright browsers
        run: |
          npm install --no-save playwright@1.58.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/homeeasy-static.log 2>&1 &
          echo $! >/tmp/homeeasy-static.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/configuracion.html >/dev/null && break || sleep 1; done

      - name: Run full Configuracion browser isolation QA
        run: node tools/qa-whatsapp-full-config.js

      - name: Commit the exact tested Configuracion to isolated branch
        run: |
          git config user.name 'homeeasy-ci'
          git config user.email 'homeeasy-ci@users.noreply.github.com'
          git add configuracion.html
          if git diff --cached --quiet; then
            echo 'Configuracion already contains tested WhatsApp v0.2 loaders.'
          else
            git commit -m 'Load isolated WhatsApp v0.2 in Configuracion'
            git push origin HEAD:fix/whatsapp-config-isolated
          fi
