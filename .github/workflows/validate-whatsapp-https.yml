name: validate WhatsApp HTTPS installer

on:
  push:
    branches: [main]
    paths:
      - 'infra/whatsapp/install-https-domain.sh'
      - '.github/workflows/validate-whatsapp-https.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTTPS installer syntax
        run: |
          bash -n infra/whatsapp/install-https-domain.sh
          grep -q 'api.homeeasy.com.co' infra/whatsapp/install-https-domain.sh
          grep -q 'reverse_proxy 127.0.0.1:8080' infra/whatsapp/install-https-domain.sh
          grep -q 'caddy validate' infra/whatsapp/install-https-domain.sh
          echo HTTPS_INSTALLER_OK
