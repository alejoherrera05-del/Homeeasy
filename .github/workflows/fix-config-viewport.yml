name: Fix Configuración viewport

on:
  push:
    paths:
      - '.github/config-viewport-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only login viewport CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('configuracion.html')
          raw=p.read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          expected='d599894153650ea042f711bf734dfd4311905ad4'
          if sha != expected:
              raise SystemExit(f'SAFETY STOP: SHA {sha} != {expected}')
          text=raw.decode('utf-8')
          app_tail=text[text.index('<main class="settings-app"'):]
          old='''            width: 100%;\n            height: 100vh;\n            height: 100dvh;\n            min-height: 100svh;\n            overflow: hidden;\n            isolation: isolate;'''
          new='''            width: 100%;\n            height: auto;\n            min-height: 0;\n            overflow: hidden;\n            overscroll-behavior: none;\n            isolation: isolate;'''
          if text.count(old) != 1:
              raise SystemExit('SAFETY STOP: viewport target count != 1')
          anchor='''        a { color: inherit; }\n'''
          lock='''        a { color: inherit; }\n\n        /* Login fijo al viewport: evita franja/overscroll de iOS. */\n        html:has(#accessScreen:not(.hidden)),\n        body:has(#accessScreen:not(.hidden)) {\n            width: 100%;\n            height: 100%;\n            overflow: hidden !important;\n            overscroll-behavior: none;\n            background: #a9485f;\n        }\n'''
          if text.count(anchor) != 1:
              raise SystemExit('SAFETY STOP: root anchor count != 1')
          if 'Login fijo al viewport' in text:
              raise SystemExit('SAFETY STOP: patch already present')
          text=text.replace(anchor,lock,1)
          text=text.replace(old,new,1)
          if text[text.index('<main class="settings-app"'):] != app_tail:
              raise SystemExit('SAFETY STOP: internal settings app changed')
          required=['accessScreen','accessCard','pinInput','pinEyeButton','pinEyeIcon','accessSubmit','accessStatus','settingsApp','lockButton']
          missing=[i for i in required if f'id="{i}"' not in text]
          if missing:
              raise SystemExit('SAFETY STOP missing IDs: '+','.join(missing))
          p.write_text(text,encoding='utf-8',newline='\n')
          PY
      - name: Validate patch
        shell: bash
        run: |
          grep -q 'Login fijo al viewport' configuracion.html
          grep -q 'height: auto;' configuracion.html
          grep -q 'overscroll-behavior: none;' configuracion.html
          grep -q 'CONFIGURACIÓN 4.1 — CABECERA ÚNICA + GLASS NEUTRO' configuracion.html
      - name: Commit and clean temporary deployment files
        shell: bash
        run: |
          rm -f .github/workflows/fix-config-viewport.yml .github/config-viewport-trigger.txt
          git config user.name 'HomeEasy Update'
          git config user.email 'actions@users.noreply.github.com'
          git add configuracion.html .github/workflows/fix-config-viewport.yml .github/config-viewport-trigger.txt
          git commit -m 'Fix Configuración viewport on iPhone'
          git push
