name: validate HomeEasy WhatsApp infra

on:
  push:
    branches: [main]
    paths:
      - 'infra/whatsapp/**'
      - '.github/workflows/validate-whatsapp-infra.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell and bridge syntax
        run: |
          bash -n infra/whatsapp/install.sh
          node --check infra/whatsapp/bridge/server.js

      - name: Validate Docker Compose
        working-directory: infra/whatsapp
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_WAHA_API_KEY/test-waha-key/' .env
          sed -i 's/CHANGE_ME_DASHBOARD_PASSWORD/test-dashboard-password/' .env
          sed -i 's/CHANGE_ME_BRIDGE_TOKEN/test-bridge-token/' .env
          docker compose config > /tmp/homeeasy-whatsapp-compose.yml

      - name: Build Bridge image
        working-directory: infra/whatsapp
        run: docker compose build bridge

      - name: Smoke test Bridge without exposing WAHA
        working-directory: infra/whatsapp
        run: |
          docker run -d --rm --name homeeasy-bridge-qa \
            -e WAHA_BASE_URL=http://127.0.0.1:39999 \
            -e WAHA_API_KEY=test-waha-key \
            -e BRIDGE_TOKEN=test-bridge-token \
            -p 127.0.0.1:18080:8080 \
            homeeasy-whatsapp-bridge:local
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health | grep -q 'homeeasy-whatsapp-bridge'
          test "$(curl -s -o /tmp/unauth -w '%{http_code}' http://127.0.0.1:18080/api/whatsapp/status)" = "401"
          docker stop homeeasy-bridge-qa
