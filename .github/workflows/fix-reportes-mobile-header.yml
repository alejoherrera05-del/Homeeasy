name: fix reportes mobile header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-reportes-mobile-header.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align Reports mobile shell with HomeEasy
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('reportes.html')
          s=p.read_text(encoding='utf-8')
          old='<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
          new='''<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<meta name="theme-color" content="#f6f6f7">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="default">'''
          if old not in s:
              raise SystemExit('viewport marker missing')
          s=s.replace(old,new,1)
          marker='</style>\n<script src="homeeasy-core.js?v=3.5"></script>'
          mobile='''
<style id="reportes-mobile-shell-v2">
@media (max-width:620px){
  html,body{background:var(--bg);}
  body{padding:0;}
  .app{padding:0 0 calc(34px + env(safe-area-inset-bottom,0px));}
  .shell{width:calc(100% - 32px);}
  .report-header{
    padding-top:max(env(safe-area-inset-top,0px),24px);
  }
  .header-main{
    height:62px;
    min-height:62px;
    padding:6px 0 5px;
    display:grid;
    grid-template-columns:44px minmax(0,1fr) 44px;
    align-items:center;
  }
  .back{
    position:relative;
    left:auto;
    top:auto;
    transform:none;
    grid-column:1;
    grid-row:1;
    width:44px;
    height:44px;
    justify-self:start;
    box-shadow:0 7px 22px rgba(30,24,27,.07);
  }
  .back:active{transform:scale(.93);}
  .heading-lockup{
    grid-column:2;
    grid-row:1;
    justify-self:center;
    display:grid;
    grid-template-columns:24px auto;
    column-gap:8px;
    align-items:center;
    max-width:100%;
  }
  .heading-lockup img{
    width:24px;
    height:28px;
    grid-row:1/3;
  }
  .heading-copy{min-width:0;text-align:left;}
  .heading h1{
    font-size:23px;
    line-height:1.04;
    letter-spacing:-.035em;
    white-space:nowrap;
  }
  .heading p{
    margin-top:4px;
    font-size:12.5px;
    line-height:1.1;
    white-space:nowrap;
  }
  .period-row{
    min-height:0;
    margin-top:2px;
    padding:8px 0 4px;
    display:grid;
    grid-template-columns:1fr;
    gap:9px;
    align-items:center;
  }
  .date-display{
    min-height:24px;
    padding:0 3px;
    gap:9px;
    font-size:13.5px;
    line-height:1.25;
    font-weight:620;
  }
  .date-display i{font-size:15px;}
  .period-control{
    width:100%;
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    align-items:center;
    gap:12px;
  }
  .period-label{
    font-size:13px;
    line-height:1;
    padding-left:3px;
  }
  .period{width:100%;min-width:0;}
  .period select{
    height:46px;
    border-radius:15px;
    padding-left:15px;
    font-size:14px;
  }
  .page{margin-top:11px;gap:14px;}
  .goal-hero{margin-top:0;}
}
@media (max-width:380px){
  .shell{width:calc(100% - 24px);}
  .heading h1{font-size:21px;}
  .heading p{font-size:11.5px;}
  .heading-lockup{grid-template-columns:21px auto;column-gap:7px;}
  .heading-lockup img{width:21px;height:25px;}
}
</style>
'''
          if marker not in s:
              raise SystemExit('style/script marker missing')
          if 'reportes-mobile-shell-v2' in s:
              raise SystemExit('mobile shell already present')
          s=s.replace(marker,'</style>\n'+mobile+'<script src="homeeasy-core.js?v=3.5"></script>',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'reportes-mobile-shell-v2' reportes.html
          grep -q 'safe-area-inset-top' reportes.html
          grep -q 'font-size:23px' reportes.html
          git diff --check
      - name: Commit mobile fix
        run: |
          git config user.name 'homeeasy-ci'
          git config user.email 'homeeasy-ci@users.noreply.github.com'
          git add reportes.html
          git commit -m 'Align reports mobile header with HomeEasy shell'
          git push
