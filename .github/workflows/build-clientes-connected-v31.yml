name: Build connected Clientes 3.1 preview

on:
  push:
    branches:
      - build/clientes-connected-v31
    paths:
      - 'scripts/build_clientes_connected_v32.py'
      - 'scripts/refine_clientes_v33.py'
      - '.github/workflows/build-clientes-connected-v31.yml'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build connected preview
        run: python scripts/build_clientes_connected_v32.py

      - name: Refine audited product UI
        run: python scripts/refine_clientes_v33.py

      - name: Validate generated HTML and legacy parity
        shell: bash
        run: |
          set -euo pipefail
          test -s clientes-conectado-v31.html
          grep -q "clientes-conectado-v31.html': 'clientes.read'" clientes-conectado-v31.html
          grep -q '#B2566C' clientes-conectado-v31.html
          grep -q 'Historial de abonos' clientes-conectado-v31.html
          grep -q 'Historial de pagos' clientes-conectado-v31.html
          grep -q 'Ver recibos y movimientos' clientes-conectado-v31.html
          grep -q 'fa-regular fa-eye' clientes-conectado-v31.html
          grep -q 'v31-doc-popover' clientes-conectado-v31.html
          grep -q 'confirmarEdicion' clientes-conectado-v31.html
          grep -q 'confirmarAnulacion' clientes-conectado-v31.html
          grep -q 'abrirVisorPDF' clientes-conectado-v31.html
          grep -q 'ANALIZAR_ANULACION_DOCUMENTO' clientes-conectado-v31.html
          grep -q 'EJECUTAR_ANULACION_SEGURA' clientes-conectado-v31.html
          grep -q 'guardarEdicionCliente' clientes-conectado-v31.html
          grep -q 'pedido.html?cotizacion=' clientes-conectado-v31.html
          grep -q '.v31-new-search:hover' clientes-conectado-v31.html
          grep -q '.v31-shell{width:calc(100% - 40px)' clientes-conectado-v31.html
          grep -q 'triangulo.png' clientes-conectado-v31.html
          grep -q 'triangulogold.png' clientes-conectado-v31.html
          grep -q 'abonos_detalle' clientes-conectado-v31.html
          grep -q 'HISTORIAL_CLIENTE' clientes-conectado-v31.html
          grep -q 'shell.append(buildContact(client));' clientes-conectado-v31.html
          grep -q 'actions.append(wa);card.append(actions)' clientes-conectado-v31.html
          if grep -q 'shell.append(buildContact(client),buildSummary(orders));' clientes-conectado-v31.html; then
            echo 'Commercial summary is still rendered.' >&2
            exit 1
          fi
          if grep -q 'actions.append(wa,bottomMore)' clientes-conectado-v31.html; then
            echo 'Duplicate client overflow menu is still rendered.' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          source = Path('clientes.html').read_text(encoding='utf-8')
          html = Path('clientes-conectado-v31.html').read_text(encoding='utf-8')

          fn = re.compile(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(')
          source_functions = set(fn.findall(source))
          generated_functions = set(fn.findall(html))
          missing = sorted(source_functions - generated_functions)
          if missing:
              raise SystemExit('Legacy functions missing from generated Clientes: ' + ', '.join(missing))

          required_flows = [
              'listaClientes=1', 'HISTORIAL_CLIENTE', 'abrirVisorPDF', 'cerrarVisorPDF',
              'abrirModalEditar', 'guardarEdicionCliente', 'confirmarEdicion',
              'confirmarAnulacion', 'analizarAnulacion', 'solicitarConfirmacionFinalAnulacion',
              'ejecutarAnulacionSegura', 'ANALIZAR_ANULACION_DOCUMENTO',
              'EJECUTAR_ANULACION_SEGURA', 'pedido.html?cotizacion=', 'normalizarTexto',
              'reiniciarBusqueda', 'abonos_detalle'
          ]
          absent = [token for token in required_flows if token not in html]
          if absent:
              raise SystemExit('Critical Clientes flows missing: ' + ', '.join(absent))

          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, re.I)
          if len(scripts) < 3:
              raise SystemExit(f'Expected at least 3 inline scripts, got {len(scripts)}')
          for i, script in enumerate(scripts):
              p = Path(tempfile.gettempdir()) / f'clientes-connected-{i}.js'
              p.write_text(script, encoding='utf-8')
              subprocess.run(['node','--check',str(p)], check=True)

          print(f'Audit OK: {len(source_functions)} legacy functions retained; {len(scripts)} inline scripts valid')
          PY

      - name: Publish preview only
        shell: bash
        run: |
          set -euo pipefail
          cp clientes-conectado-v31.html /tmp/clientes-conectado-v31.html
          rm -f clientes-conectado-v31.html
          git fetch origin main
          git checkout -B publish-connected origin/main
          cp /tmp/clientes-conectado-v31.html clientes-conectado-v31.html
          git config user.name 'HomeEasy Clientes Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add clientes-conectado-v31.html
          if git diff --cached --quiet; then
            echo 'Connected preview already current.'
            exit 0
          fi
          if git diff --cached --name-only | grep -v '^clientes-conectado-v31.html$'; then
            echo 'Unexpected staged files.' >&2
            exit 1
          fi
          git commit -m 'Audit Clientes 3.1 UI and legacy parity'
          git push origin HEAD:main