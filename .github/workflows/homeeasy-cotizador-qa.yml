name: HomeEasy Cotizador QA

on:
  push:
    paths:
      - 'homeeasy-cost-calculator.js'
      - 'homeeasy-cost-calculator.css'
      - 'cotizador-persianas.html'
      - 'cotizacion.html'
      - 'homeeasy-quote-pdf.js'
      - 'tests/formal-quote-pdf-layout.cjs'
      - 'tests/cost-calculator-*.cjs'
      - '.github/workflows/homeeasy-cotizador-qa.yml'
  pull_request:
    paths:
      - 'homeeasy-cost-calculator.js'
      - 'homeeasy-cost-calculator.css'
      - 'cotizador-persianas.html'
      - 'cotizacion.html'
      - 'homeeasy-quote-pdf.js'
      - 'tests/formal-quote-pdf-layout.cjs'
      - 'tests/cost-calculator-*.cjs'
      - '.github/workflows/homeeasy-cotizador-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cotizador:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check script syntax
        run: node --check homeeasy-cost-calculator.js
      - name: Check native quote PDF syntax
        run: node --check homeeasy-quote-pdf.js
      - name: Install isolated test dependencies
        run: npm install --no-save --no-package-lock jsdom@25 jspdf@2.5.1
      - name: Verify actual PDF and pagination
        run: node tests/formal-quote-pdf-layout.cjs
      - name: Verify price calculations (unchanged)
        run: node tests/cost-calculator-10b.cjs
      - name: Verify enrollable UI (unchanged)
        run: node tests/cost-calculator-enrollables-ui.cjs
      - name: Verify window editing and duplication
        run: node tests/cost-calculator-active-window.cjs
