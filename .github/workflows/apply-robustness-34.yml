name: Apply HomeEasy robustness 3.4 candidate

on:
  push:
    branches: [audit/full-fire-2026-08-27]
    paths:
      - '.github/workflows/apply-robustness-34.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply candidate patch
        run: python3 .github/scripts/apply_robustness_34.py
      - name: Validate syntax and scope
        shell: bash
        run: |
          node --check homeeasy-auth.js
          node --check homeeasy-core.js
          node --check homeeasy-page-guard.js
          grep -q 'HomeEasy Auth v0.4.1' homeeasy-auth.js
          grep -q 'HomeEasy Core v3.4' homeeasy-core.js
          grep -q 'HomeEasy Page Guard v3.4' homeeasy-page-guard.js
          grep -q 'isTransientError' homeeasy-auth.js
          if git diff --name-only | grep -E '^(production/|products/|ar-sheer-v221/|.*\.glb$)' ; then
            echo 'AR/product files changed unexpectedly' >&2
            exit 1
          fi
      - name: Commit candidate
        run: |
          git config user.name 'HomeEasy QA'
          git config user.email 'homeeasy-qa@users.noreply.github.com'
          git add homeeasy-auth.js homeeasy-core.js homeeasy-page-guard.js '*.html'
          git commit -m 'Harden sessions against transient connectivity failures'
          git push origin HEAD:audit/full-fire-2026-08-27
