name: Patch WhatsApp Effective Since 10C

on:
  push:
    branches:
      - whatsapp-context-10c
    paths:
      - '.github/workflows/patch-whatsapp-effective-since-10c.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: whatsapp-context-10c
          fetch-depth: 0

      - name: Apply canonical window to all context evidence
        run: python infra/whatsapp/patch_effective_since_10c.py

      - name: Validate JavaScript syntax
        run: node --check infra/whatsapp/bridge/server.js

      - name: Commit hardening
        run: |
          if git diff --quiet -- infra/whatsapp/bridge/server.js; then
            echo 'No effective-window patch required.'
            exit 0
          fi
          git config user.name 'homeeasy-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add infra/whatsapp/bridge/server.js
          git commit -m 'Apply canonical time window to WhatsApp evidence'
          git push origin HEAD:whatsapp-context-10c
