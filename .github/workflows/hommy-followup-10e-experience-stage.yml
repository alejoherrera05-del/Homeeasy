name: Hommy Follow-up 10E Experience Stage

on:
  push:
    branches:
      - hommy-followup-10e-experience
    paths:
      - 'hommy_backend/followup_experience.py'
      - 'tests/test_hommy_followup_experience.py'
      - 'scripts/patch_hommy_followup_10e_experience.py'
      - 'scripts/patch_hommy_followup_history_route_10e.py'
      - '.github/workflows/hommy-followup-10e-experience-stage.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: hommy-followup-10e-experience

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply 10E backend patches
        run: |
          python scripts/patch_hommy_followup_10e_experience.py
          python scripts/patch_hommy_followup_history_route_10e.py

      - name: Compile Python
        run: python -m compileall -q hommy_backend servidor.py

      - name: Run follow-up regression suite
        run: |
          python -m unittest -v tests.test_hommy_followup
          python -m unittest -v tests.test_hommy_followup_whatsapp
          python -m unittest -v tests.test_hommy_followup_experience
          python -m unittest -v tests.test_auth_upstream_transport
          python -m unittest -v tests.test_homeeasy_session_stability

      - name: Verify 10E contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          followup = Path('hommy_backend/followup.py').read_text(encoding='utf-8')
          server = Path('servidor.py').read_text(encoding='utf-8')
          helper = Path('hommy_backend/followup_experience.py').read_text(encoding='utf-8')
          assert 'PLAYBOOK_VERSION = "1.3"' in followup
          assert 'FOLLOWUP_STAGE = "10E"' in followup
          assert 'conversationStyle' in followup
          assert 'FOLLOWUP_UNVERIFIED_TEMPORAL_CLAIM' in followup
          assert 'sourceAttemptCount' in followup
          assert 'def history(' in followup
          assert '/api/hommy/followup/history' in server
          assert 'doña Sandra' in followup
          assert 'has_unverified_payment_completion_claim' in helper
          print('Hommy 10E experience contracts: PASS')
          PY

      - name: Diff hygiene
        run: git diff --check

      - name: Commit certified backend patch
        run: |
          git config user.name 'homeeasy-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add hommy_backend/followup.py servidor.py hommy_backend/followup_experience.py tests/test_hommy_followup_experience.py
          if git diff --cached --quiet; then
            echo 'No backend changes to commit'
          else
            git commit -m 'Hommy 10E: preserve conversation style and expose history'
            git push origin HEAD:hommy-followup-10e-experience
          fi
