name: HomeEasy Documentos Direct Access

on:
  push:
    paths:
      - '.github/documentos-direct-access-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove visible PIN gate and load Documentos directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess

          path = Path('documentos.html')
          raw = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          expected = 'a59a8a53af8945c175c67a05ea008498f71373f2'
          if blob != expected:
              raise SystemExit(f'SAFETY STOP: documentos.html blob {blob} != {expected}')

          text = raw.decode('utf-8')
          index_hash = hashlib.sha256(Path('index.html').read_bytes()).hexdigest()

          lock_html = '''<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <div class="lock-symbol"><i class="fa-solid fa-folder-lock"></i></div>
    <h2>Documentos</h2>
    <p>Ingresa el PIN administrativo para acceder a cuentas de cobro y documentación privada de HomeEasy.</p>
    <input class="input" id="pinInput" type="password" inputmode="numeric" maxlength="12" autocomplete="off" aria-label="PIN administrativo">
    <button class="primary" id="unlockBtn" style="margin-top:13px">Entrar</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>
'''
          if lock_html not in text:
              raise SystemExit('SAFETY STOP: exact PIN screen not found')
          text = text.replace(lock_html, '', 1)

          old_header = '<button id="lockBtn" class="round-btn lock-state" aria-label="Cerrar sesión"><i class="fa-solid fa-lock"></i></button>'
          new_header = '<button id="lockBtn" class="round-btn lock-state" aria-label="Actualizar"><i class="fa-solid fa-arrows-rotate"></i></button>'
          if old_header not in text:
              raise SystemExit('SAFETY STOP: lock header button not found')
          text = text.replace(old_header, new_header, 1)

          old_chip = '<div class="session-chip"><i class="fa-solid fa-shield-check"></i> Sesión protegida</div>'
          new_chip = '<div class="session-chip"><i class="fa-solid fa-folder-open"></i> Centro documental</div>'
          if old_chip not in text:
              raise SystemExit('SAFETY STOP: session chip not found')
          text = text.replace(old_chip, new_chip, 1)

          old_load = "async function loadCenter(){token=readToken();const r=await post({tipo:'GET_DOCUMENTOS_SEGURA',documentSessionToken:token,meta:meta()});"
          new_load = "async function loadCenter(){token='DIRECT';const r=await post({tipo:'GET_DOCUMENTOS_SEGURA',documentSessionToken:token,meta:meta()});"
          if old_load not in text:
              raise SystemExit('SAFETY STOP: loadCenter fragment not found')
          text = text.replace(old_load, new_load, 1)

          old_events = "$('unlockBtn').addEventListener('click',unlock);$('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});$('lockBtn').addEventListener('click',closeSession);"
          new_events = "$('lockBtn').addEventListener('click',async()=>{showLoading('Actualizando documentos…');try{await loadCenter();toast('Centro documental actualizado.')}catch(e){toast(e.message||'No se pudo actualizar.')}finally{hideLoading()}});"
          if old_events not in text:
              raise SystemExit('SAFETY STOP: PIN listeners fragment not found')
          text = text.replace(old_events, new_events, 1)

          old_boot = 'refreshPreview();validateStored();'
          new_boot = "token='DIRECT';refreshPreview();showLoading('Cargando centro documental…');loadCenter().catch(e=>toast(e.message||'No se pudo cargar Documentos.')).finally(hideLoading);"
          if old_boot not in text:
              raise SystemExit('SAFETY STOP: boot fragment not found')
          text = text.replace(old_boot, new_boot, 1)

          # PIN UI must be gone. Dormant legacy helper functions stay untouched for minimal regression risk.
          for marker in ['id="lockScreen"','id="pinInput"','id="unlockBtn"','Ingresa el PIN administrativo']:
              if marker in text:
                  raise SystemExit('SAFETY STOP: visible PIN marker remains: '+marker)

          for marker in ['GET_DOCUMENTOS_SEGURA','PREPARAR_CUENTA_COBRO','GUARDAR_CUENTA_COBRO','LISTAR_CUENTAS_COBRO','HOMEEASY DOCUMENTOS 8B.1']:
              if marker not in text:
                  raise SystemExit('SAFETY STOP: business marker lost: '+marker)

          ids = re.findall(r'id="([^"]+)"', text)
          if len(ids) != len(set(ids)):
              raise SystemExit('SAFETY STOP: duplicate IDs')

          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
          for i, script in enumerate(scripts):
              if not script.strip(): continue
              p = Path(f'/tmp/documentos-{i}.js')
              p.write_text(script, encoding='utf-8')
              subprocess.run(['node','--check',str(p)], check=True)

          path.write_text(text, encoding='utf-8')
          if hashlib.sha256(Path('index.html').read_bytes()).hexdigest() != index_hash:
              raise SystemExit('SAFETY STOP: index.html changed')
          print('OK: visible PIN removed; direct mode enabled')
          PY
      - name: Commit scoped update and self-clean
        shell: bash
        run: |
          rm -f .github/workflows/documentos-direct-access.yml .github/documentos-direct-access-trigger.txt
          git config user.name 'HomeEasy Update'
          git config user.email 'actions@users.noreply.github.com'
          git add documentos.html .github/workflows/documentos-direct-access.yml .github/documentos-direct-access-trigger.txt
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' '.github/documentos-direct-access-trigger.txt' '.github/workflows/documentos-direct-access.yml' 'documentos.html' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'Remove standalone PIN from HomeEasy documents'
          git push
