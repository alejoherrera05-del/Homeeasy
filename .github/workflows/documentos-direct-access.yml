name: HomeEasy Documentos Direct Access

on:
  push:
    paths:
      - '.github/documentos-direct-access-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove module PIN without changing document logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess

          path = Path('documentos.html')
          raw = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          expected = 'a59a8a53af8945c175c67a05ea008498f71373f2'
          if blob != expected:
              raise SystemExit(f'SAFETY STOP: documentos.html blob {blob} != {expected}')

          text = raw.decode('utf-8')
          original = text
          index_hash = hashlib.sha256(Path('index.html').read_bytes()).hexdigest()

          lock_html = '''<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <div class="lock-symbol"><i class="fa-solid fa-folder-lock"></i></div>
    <h2>Documentos</h2>
    <p>Ingresa el PIN administrativo para acceder a cuentas de cobro y documentación privada de HomeEasy.</p>
    <input class="input" id="pinInput" type="password" inputmode="numeric" maxlength="12" autocomplete="off" aria-label="PIN administrativo">
    <button class="primary" id="unlockBtn" style="margin-top:13px">Entrar</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>
'''
          if lock_html not in text:
              raise SystemExit('SAFETY STOP: lock screen block not found exactly')
          text = text.replace(lock_html, '', 1)

          old_header = '<header class="topbar"><div class="topbar-inner"><a href="index.html" class="round-btn" aria-label="Volver"><i class="fa-solid fa-chevron-left"></i></a><div class="brand"><img src="triangulogold.png" alt=""><div><strong>HomeEasy</strong><small>Centro documental</small></div></div><button id="lockBtn" class="round-btn lock-state" aria-label="Cerrar sesión"><i class="fa-solid fa-lock"></i></button></div></header>'
          new_header = '<header class="topbar"><div class="topbar-inner"><a href="index.html" class="round-btn" aria-label="Volver"><i class="fa-solid fa-chevron-left"></i></a><div class="brand"><img src="triangulogold.png" alt=""><div><strong>HomeEasy</strong><small>Centro documental</small></div></div><button id="refreshBtn" class="round-btn" aria-label="Actualizar"><i class="fa-solid fa-arrows-rotate"></i></button></div></header>'
          if old_header not in text:
              raise SystemExit('SAFETY STOP: header block not found')
          text = text.replace(old_header, new_header, 1)

          old_intro = '<section class="intro"><div><h1>Documentos</h1><p>Genera cuentas de cobro, consulta documentación oficial y prepara los archivos de HomeEasy desde un solo lugar.</p></div><div class="session-chip"><i class="fa-solid fa-shield-check"></i> Sesión protegida</div></section>'
          new_intro = '<section class="intro"><div><h1>Documentos</h1><p>Genera cuentas de cobro, consulta documentación oficial y prepara los archivos de HomeEasy desde un solo lugar.</p></div><div class="session-chip"><i class="fa-solid fa-folder-open"></i> Centro documental</div></section>'
          if old_intro not in text:
              raise SystemExit('SAFETY STOP: intro block not found')
          text = text.replace(old_intro, new_intro, 1)

          replacements = [
            ("const API_TIMEOUT=60000, TOKEN_KEY='HOMEEASY_DOCUMENT_SESSION';", "const API_TIMEOUT=60000;"),
            ("let token='', center=null, mode='OP', loadedOp=null, prepared=null, lastPdfBlob=null, lastPdfName='', lastDriveUrl='';", "let center=null, mode='OP', loadedOp=null, prepared=null, lastPdfBlob=null, lastPdfName='', lastDriveUrl='';"),
            ("function saveToken(v){token=v||'';try{sessionStorage.setItem(TOKEN_KEY,token)}catch(e){}} function readToken(){try{return sessionStorage.getItem(TOKEN_KEY)||''}catch(e){return ''}}\n", ""),
            ("async function unlock(){const pin=$('pinInput').value.trim();if(!pin)return;$('lockError').textContent='';showLoading('Validando acceso…');try{const r=await post({tipo:'ABRIR_SESION_DOCUMENTOS',pin,meta:meta()});if(r.status!=='success'&&!r.token)throw new Error(r.msg||'PIN incorrecto.');saveToken(r.token);$('pinInput').value='';await loadCenter();$('lockScreen').classList.add('hidden')}catch(e){$('lockError').textContent=e.message||'No se pudo abrir Documentos.'}finally{hideLoading()}}\n", ""),
            ("async function validateStored(){token=readToken();if(!token)return false;try{const r=await post({tipo:'VALIDAR_SESION_DOCUMENTOS',documentSessionToken:token,meta:meta()});if(r.status==='success'&&r.valido){await loadCenter();$('lockScreen').classList.add('hidden');return true}}catch(e){} saveToken('');return false}\n", ""),
            ("async function loadCenter(){token=readToken();const r=await post({tipo:'GET_DOCUMENTOS_SEGURA',documentSessionToken:token,meta:meta()});", "async function loadCenter(){const r=await post({tipo:'GET_DOCUMENTOS_SEGURA',meta:meta()});"),
            ("async function loadHistory(){if(!token)return;try{const r=await post({tipo:'LISTAR_CUENTAS_COBRO',documentSessionToken:token,meta:meta()});", "async function loadHistory(){try{const r=await post({tipo:'LISTAR_CUENTAS_COBRO',meta:meta()});"),
            ("const r=await post({tipo:'PREPARAR_CUENTA_COBRO',modo:'OP',numeroOp:op,documentSessionToken:token,requestId:uuid(),meta:meta()});", "const r=await post({tipo:'PREPARAR_CUENTA_COBRO',modo:'OP',numeroOp:op,requestId:uuid(),meta:meta()});"),
            ("const payload={tipo:'PREPARAR_CUENTA_COBRO',modo:mode,numeroOp:mode==='OP'&&loadedOp?loadedOp.numeroOp:'',documentSessionToken:token,requestId,meta:meta()};", "const payload={tipo:'PREPARAR_CUENTA_COBRO',modo:mode,numeroOp:mode==='OP'&&loadedOp?loadedOp.numeroOp:'',requestId,meta:meta()};"),
            ("const payload={tipo:'GUARDAR_CUENTA_COBRO',documentSessionToken:token,requestId:prep.requestId,", "const payload={tipo:'GUARDAR_CUENTA_COBRO',requestId:prep.requestId,"),
            ("async function closeSession(){try{await post({tipo:'CERRAR_SESION_DOCUMENTOS',documentSessionToken:token,meta:meta()})}catch(e){}saveToken('');location.reload()}\n", ""),
            ("$('unlockBtn').addEventListener('click',unlock);$('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});$('lockBtn').addEventListener('click',closeSession);", "$('refreshBtn').addEventListener('click',async()=>{showLoading('Actualizando documentos…');try{await loadCenter();toast('Centro documental actualizado.')}catch(e){toast(e.message||'No se pudo actualizar.')}finally{hideLoading()}});"),
            ("refreshPreview();validateStored();", "refreshPreview();showLoading('Cargando centro documental…');loadCenter().catch(e=>toast(e.message||'No se pudo cargar Documentos.')).finally(hideLoading);")
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('SAFETY STOP: expected JS fragment not found: ' + old[:90])
              text = text.replace(old, new, 1)

          # Remove obsolete lock-only CSS while preserving loading/toast CSS.
          text, n = re.subn(r'\.lock-screen\{.*?\.lock-error\{[^}]*\}', '', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('SAFETY STOP: lock-only CSS block not removed exactly once')

          if 'HOMEEASY_DOCUMENT_SESSION' in text or 'documentSessionToken' in text or 'pinInput' in text or 'unlockBtn' in text or 'lockScreen' in text:
              raise SystemExit('SAFETY STOP: PIN/session remnants remain')
          for marker in ['GET_DOCUMENTOS_SEGURA','PREPARAR_CUENTA_COBRO','GUARDAR_CUENTA_COBRO','LISTAR_CUENTAS_COBRO','HOMEEASY DOCUMENTOS 8B.1']:
              if marker not in text:
                  raise SystemExit('SAFETY STOP: business marker lost: ' + marker)

          ids = re.findall(r'id="([^"]+)"', text)
          if len(ids) != len(set(ids)):
              raise SystemExit('SAFETY STOP: duplicate ids after patch')

          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
          for i, script in enumerate(scripts):
              if not script.strip(): continue
              p = Path(f'/tmp/documentos-direct-{i}.js')
              p.write_text(script, encoding='utf-8')
              subprocess.run(['node','--check',str(p)], check=True)

          path.write_text(text, encoding='utf-8')
          if hashlib.sha256(Path('index.html').read_bytes()).hexdigest() != index_hash:
              raise SystemExit('SAFETY STOP: index.html changed')
          print('OK direct access patch; bytes', len(text.encode('utf-8')))
          PY
      - name: Commit only documentos.html and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/documentos-direct-access.yml .github/documentos-direct-access-trigger.txt
          git config user.name 'HomeEasy Update'
          git config user.email 'actions@users.noreply.github.com'
          git add documentos.html .github/workflows/documentos-direct-access.yml .github/documentos-direct-access-trigger.txt
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' '.github/documentos-direct-access-trigger.txt' '.github/workflows/documentos-direct-access.yml' 'documentos.html' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'Remove standalone PIN from HomeEasy documents'
          git push
