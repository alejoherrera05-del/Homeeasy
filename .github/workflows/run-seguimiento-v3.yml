name: run Seguimiento v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-seguimiento-v3.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply-seguimiento-v3.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/seg-v3.log 2>&1 &
          sleep 2
      - name: Run QA
        run: node tools/qa-seguimiento-v3.js
      - uses: actions/upload-artifact@v4
        with:
          name: seguimiento-v3-preview
          path: |
            seguimiento-mobile-v3.png
            seguimiento-desktop-v3.png
      - name: Commit tested change
        run: |
          git config user.name 'homeeasy-ci'
          git config user.email 'homeeasy-ci@users.noreply.github.com'
          git add seguimiento.html
          git commit -m 'Compact Seguimiento mobile hierarchy'
          git push
