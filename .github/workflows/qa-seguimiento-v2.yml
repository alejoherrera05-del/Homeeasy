name: qa Seguimiento v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-seguimiento-v2.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/seguimiento-qa.log 2>&1 &
          sleep 2
      - name: Test desktop and mobile
        run: |
          cat > qa-seguimiento.js <<'NODE'
          const { chromium } = require('playwright');

          const daysAgo = n => {
            const d = new Date();
            d.setHours(12,0,0,0);
            d.setDate(d.getDate() - n);
            return d.toISOString();
          };

          const cotizaciones = [
            { numero:'201', nombre:'Laura Gómez', estado:'COTIZACION', total:2450000, notas_seguimiento:'Confirmar tela y programar llamada de cierre.', url:'https://drive.google.com/file/d/abc/view?usp=drivesdk', fecha:daysAgo(2) },
            { numero:'202', nombre:'Carlos Pérez', estado:'COTIZACION', total:1800000, notas_seguimiento:'', url:'https://drive.google.com/file/d/def/view', fecha:daysAgo(10) },
            { numero:'203', nombre:'Ana Martínez', estado:'COTIZACION', total:3250000, notas_seguimiento:'Cliente pidió unos días para revisar la propuesta con su familia.', url:'', fecha:daysAgo(20) },
            { numero:'204', nombre:'Archivada', estado:'ARCHIVADA', total:990000, notas_seguimiento:'', url:'', fecha:daysAgo(1) }
          ];

          async function prepare(page) {
            await page.route('**/homeeasy-page-guard.js*', route => route.fulfill({
              status: 200,
              contentType: 'application/javascript',
              body: 'window.HomeEasyPageGuard={ready:Promise.resolve(true)};'
            }));
            await page.route('**/homeeasy-core.js*', route => route.fulfill({
              status: 200,
              contentType: 'application/javascript',
              body: 'window.HomeEasyCore={};'
            }));
            await page.route('**/script.google.com/**', async route => {
              if (route.request().method() === 'POST') {
                return route.fulfill({status:200, contentType:'application/json', body:JSON.stringify({status:'success'})});
              }
              return route.fulfill({status:200, contentType:'application/json', body:JSON.stringify({status:'ok', cotizaciones})});
            });
          }

          async function inspect(page, width, height, label) {
            await page.setViewportSize({width,height});
            await page.goto('http://127.0.0.1:4173/seguimiento.html', {waitUntil:'domcontentloaded'});
            await page.waitForFunction(() => getComputedStyle(document.getElementById('loader')).display === 'none', null, {timeout:10000});
            await page.waitForTimeout(250);

            const state = await page.evaluate(() => ({
              title: document.querySelector('.hero h1')?.textContent.trim(),
              count: document.getElementById('kpi-count')?.textContent.trim(),
              cards: document.querySelectorAll('.crm-card').length,
              overflow: document.documentElement.scrollWidth > innerWidth + 1,
              back: document.querySelector('.btn-back')?.getBoundingClientRect().width,
              actionH: document.querySelector('.btn-crm')?.getBoundingClientRect().height,
              classes: [...document.querySelectorAll('.crm-card')].map(el => el.className),
              columns: getComputedStyle(document.getElementById('tarjetas-container')).gridTemplateColumns
            }));
            console.log(label, state);

            if (state.title !== 'Cotizaciones en seguimiento') throw new Error(label + ': title mismatch');
            if (state.count !== '3' || state.cards !== 3) throw new Error(label + ': active quotation count regression');
            if (state.overflow) throw new Error(label + ': horizontal overflow');
            if (state.back < 43 || state.actionH < 43) throw new Error(label + ': tap target too small');
            if (!state.classes.some(x => x.includes('age-new')) || !state.classes.some(x => x.includes('age-mid')) || !state.classes.some(x => x.includes('age-old'))) throw new Error(label + ': age traffic-light regression');

            await page.screenshot({path:`seguimiento-${label}.png`, fullPage:true});
          }

          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({locale:'es-CO'});
            await prepare(page);

            await inspect(page, 1440, 950, 'desktop');

            const filtered = await page.evaluate(() => {
              const start = new Date();
              start.setDate(start.getDate() - 12);
              document.getElementById('fecha-desde').value = start.toISOString().slice(0,10);
              document.getElementById('fecha-hasta').value = new Date().toISOString().slice(0,10);
              aplicarFiltros();
              return {
                count: document.getElementById('kpi-count').textContent.trim(),
                cards: document.querySelectorAll('.crm-card').length
              };
            });
            if (filtered.count !== '2' || filtered.cards !== 2) throw new Error('Date filter regression');

            await page.evaluate(() => restablecerFiltros());
            await page.waitForTimeout(50);
            if (await page.locator('.crm-card').count() !== 3) throw new Error('Reset to current month regression');

            await page.locator('.btn-view').first().click();
            await page.waitForTimeout(100);
            const pdf = await page.evaluate(() => ({
              display: getComputedStyle(document.getElementById('pdf-viewer-overlay')).display,
              src: document.getElementById('pdf-iframe').src
            }));
            if (pdf.display !== 'flex' || !pdf.src.includes('/preview')) throw new Error('PDF viewer regression');
            await page.evaluate(() => cerrarVisorPDF());

            await inspect(page, 430, 932, 'mobile');
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node qa-seguimiento.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seguimiento-v2-qa
          path: seguimiento-*.png
          if-no-files-found: ignore
