name: reportes mobile QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reportes-mobile-qa.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/he-mobile.log 2>&1 &
          sleep 2
      - name: Validate mobile geometry
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:3,locale:'es-CO'});
            await page.route('**/homeeasy-page-guard.js*',route=>route.fulfill({status:200,contentType:'application/javascript',body:'window.HomeEasyPageGuard={ready:Promise.resolve(true)};'}));
            await page.route('**/homeeasy-core.js*',route=>route.fulfill({status:200,contentType:'application/javascript',body:'window.HomeEasyCore={get:async()=>({}),post:async()=>({status:"ok"})};'}));
            await page.goto('http://127.0.0.1:4173/reportes.html?periodo=este_mes',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(600);
            await page.evaluate(()=>{const l=document.querySelector('#loaderFinance');if(l)l.style.display='none';});
            const g=await page.evaluate(()=>{const h=document.querySelector('.heading h1'),head=document.querySelector('.report-header'),hm=document.querySelector('.header-main'),date=document.querySelector('.date-display'),period=document.querySelector('.period select'),hero=document.querySelector('.goal-hero'),back=document.querySelector('.back');const r=e=>{const x=e.getBoundingClientRect();return{top:x.top,bottom:x.bottom,left:x.left,right:x.right,width:x.width,height:x.height}};return{vw:innerWidth,scrollWidth:document.documentElement.scrollWidth,headerPadding:parseFloat(getComputedStyle(head).paddingTop),headerMain:r(hm),title:r(h),titleFont:parseFloat(getComputedStyle(h).fontSize),back:r(back),date:r(date),period:r(period),hero:r(hero)};});
            console.log('MOBILE_GEOMETRY',JSON.stringify(g,null,2));
            if(g.scrollWidth>g.vw+1)throw new Error('Horizontal overflow '+g.scrollWidth+'>'+g.vw);
            if(g.headerPadding<23)throw new Error('Safe top insufficient '+g.headerPadding);
            if(g.title.top<g.headerPadding+5)throw new Error('Title enters system-safe zone');
            if(g.titleFont>24)throw new Error('Mobile title too large '+g.titleFont);
            if(g.back.width<43||g.back.height<43)throw new Error('Back target too small');
            if(g.hero.top<=g.period.bottom+8)throw new Error('Hero spacing too tight');
            await page.screenshot({path:'reportes-mobile.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-mobile-qa
          path: reportes-mobile.png
          if-no-files-found: ignore
