name: Pentagrama Catalog Sync QA

on:
  push:
    paths:
      - 'apps-script/ETAPA_10C_PENTAGRAMA_SYNC.gs'
      - 'infra/whatsapp/bridge/pentagrama-sync/catalog-inventory.js'
      - 'infra/whatsapp/bridge/pentagrama-sync/catalog-inventory.test.js'
      - 'infra/whatsapp/bridge/pentagrama-sync/catalog-bindings.js'
      - 'infra/whatsapp/bridge/pentagrama-sync/catalog-bindings.test.js'
      - 'infra/whatsapp/bridge/pentagrama-sync/phase2.js'
      - 'infra/whatsapp/bridge/pentagrama-sync/phase2.test.js'
      - 'infra/whatsapp/bridge/pentagrama-sync/index.js'
      - 'infra/whatsapp/bridge/pentagrama-agents/gateway.js'
      - 'infra/pentagrama-agent/src/agent.js'
      - 'infra/pentagrama-agent/test/agent.test.js'
      - 'infra/pentagrama-agent/package.json'
      - '.github/workflows/pentagrama-catalog-sync-qa.yml'
  pull_request:
    paths:
      - 'apps-script/ETAPA_10C_PENTAGRAMA_SYNC.gs'
      - 'infra/whatsapp/bridge/pentagrama-sync/catalog-inventory.js'
      - 'infra/whatsapp/bridge/pentagrama-sync/catalog-inventory.test.js'
      - 'infra/whatsapp/bridge/pentagrama-sync/catalog-bindings.js'
      - 'infra/whatsapp/bridge/pentagrama-sync/catalog-bindings.test.js'
      - 'infra/whatsapp/bridge/pentagrama-sync/phase2.js'
      - 'infra/whatsapp/bridge/pentagrama-sync/phase2.test.js'
      - 'infra/whatsapp/bridge/pentagrama-sync/index.js'
      - 'infra/whatsapp/bridge/pentagrama-agents/gateway.js'
      - 'infra/pentagrama-agent/src/agent.js'
      - 'infra/pentagrama-agent/test/agent.test.js'
      - 'infra/pentagrama-agent/package.json'
      - '.github/workflows/pentagrama-catalog-sync-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check infra/whatsapp/bridge/pentagrama-sync/catalog-inventory.js
          node --check infra/whatsapp/bridge/pentagrama-sync/catalog-bindings.js
          node --check infra/whatsapp/bridge/pentagrama-sync/phase2.js
          node --check infra/whatsapp/bridge/pentagrama-sync/index.js
          node --check infra/whatsapp/bridge/pentagrama-agents/gateway.js
          node --check infra/pentagrama-agent/src/agent.js
          node --check apps-script/ETAPA_10C_PENTAGRAMA_SYNC.gs
      - name: Catalog inventory tests
        run: node --test infra/whatsapp/bridge/pentagrama-sync/catalog-inventory.test.js
      - name: Catalog binding tests
        run: node --test infra/whatsapp/bridge/pentagrama-sync/catalog-bindings.test.js
      - name: Phase 2 tests
        run: node --test infra/whatsapp/bridge/pentagrama-sync/phase2.test.js
      - name: Agent tests
        run: node --test infra/pentagrama-agent/test/agent.test.js
