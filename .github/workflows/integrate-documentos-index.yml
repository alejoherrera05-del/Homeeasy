name: Integrate Documentos and simplify Index

on:
  push:
    paths:
      - '.github/index-documentos-trigger.txt'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded Index patch
        shell: bash
        run: python3 .github/patch-index-documentos.py

      - name: Validate and publish Index
        shell: bash
        run: |
          grep -q 'href="documentos.html" class="nav-row"' index.html
          grep -q '<strong>Centro documental</strong><span>Cuentas de cobro y paquetes</span>' index.html
          grep -q 'HOMEEASY INDEX 4.4 — SHELLS SEPARADOS IOS 26' index.html
          ! grep -q 'HOMEEASY_DAILY_IDEAS' index.html
          ! grep -q 'data-daily-quote' index.html
          ! grep -q 'data-daily-source' index.html
          git config user.name 'HomeEasy Update'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrate Documentos and remove daily phrases from index'
          git push
