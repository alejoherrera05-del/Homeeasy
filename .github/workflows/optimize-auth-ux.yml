name: Optimize HomeEasy auth UX

on:
  push:
    branches:
      - feature/auth-rbac
    paths:
      - .github/workflows/optimize-auth-ux.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth-rbac
          fetch-depth: 0

      - name: Patch auth UX
        run: python .github/scripts/optimize_auth_ux.py

      - name: Validate JavaScript and AR isolation
        run: |
          set -euo pipefail
          node --check homeeasy-auth.js
          node --check homeeasy-core.js
          node --check homeeasy-page-guard.js
          node --check homeeasy-account.js
          node --check homeeasy-settings-auth-ui.js
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('login.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('/tmp/login-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/login-inline.js
          if git diff --name-only | grep -E '^ar-|^ar-sheer-' ; then
            echo 'AR file changed unexpectedly.' >&2
            exit 1
          fi
          grep -q 'getCachedHomeEasySession' homeeasy-auth.js
          grep -q 'homeeasy-account.js' homeeasy-core.js
          grep -q 'showSuccess' login.html

      - name: Commit optimized UX and remove one-shot files
        run: |
          set -euo pipefail
          rm -f .github/workflows/optimize-auth-ux.yml .github/scripts/optimize_auth_ux.py
          git config user.name 'HomeEasy Auth Bot'
          git config user.email 'actions@github.com'
          git add homeeasy-auth.js homeeasy-core.js login.html .github/workflows/optimize-auth-ux.yml .github/scripts/optimize_auth_ux.py
          git commit -m 'Make HomeEasy sessions fast and polish login success'
          git push origin HEAD:feature/auth-rbac
