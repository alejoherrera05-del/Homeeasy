name: Patch Seguimiento 10D Review Send UI

on:
  push:
    branches:
      - seguimiento-human-send-10d
    paths:
      - 'scripts/patch_seguimiento_review_send_ui_10d.py'
      - '.github/workflows/patch-seguimiento-review-send-ui-10d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seguimiento-human-send-10d
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply UI patch
        run: python scripts/patch_seguimiento_review_send_ui_10d.py

      - name: Validate JavaScript
        run: |
          node --check homeeasy-whatsapp-client.js
          node --check seguimiento-hommy.js

      - name: Verify 10D UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          client = Path('homeeasy-whatsapp-client.js').read_text(encoding='utf-8')
          page = Path('seguimiento.html').read_text(encoding='utf-8')
          hommy = Path('seguimiento-hommy.js').read_text(encoding='utf-8')

          assert "const VERSION = '0.6.0'" in client
          assert "request('/api/whatsapp/send-followup'" in client
          start = client.index('function sendFollowup(options)')
          end = client.index('function connectedPhone', start)
          send = client[start:end]
          assert 'phone:' not in send
          assert 'reference:' in send and 'planId:' in send and 'expectedVersion:' in send and 'generatedAt:' in send

          assert 'homeeasy-whatsapp-client.js?v=0.6.0' in page
          assert 'seguimiento-hommy.js?v=10d1' in page

          assert "hasPermission('cotizaciones.write')" in hommy
          assert "sendLabel.textContent = 'Revisar y enviar'" in hommy
          assert 'HomeEasyWhatsApp' in hommy and '.sendFollowup' in hommy
          assert "tipo: 'ACTUALIZAR_ESTADO_SEGUIMIENTO_IA'" in hommy
          assert "tipo: 'REGISTRAR_EVENTO_SEGUIMIENTO'" in hommy
          assert "eventType: 'MESSAGE_SENT'" in hommy
          assert "channel: 'WHATSAPP'" in hommy
          assert 'sourceStateVersion' in hommy
          assert 'planId' in hommy
          assert "reference: `COT-${clean(numero)}`" in hommy
          send_call = hommy[hommy.index('whatsapp.sendFollowup({'):hommy.index('});', hommy.index('whatsapp.sendFollowup({'))]
          assert 'phone:' not in send_call
          assert "decision === 'SEND' && canSendFollowup()" in hommy
          assert 'FOLLOWUP_CONVERSATION_CHANGED' in hommy
          assert 'FOLLOWUP_STATE_CHANGED' in hommy
          print('Seguimiento 10D review-send UI security boundary: PASS')
          PY

      - name: Client transport smoke test
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          let captured = null;
          const window = {
            location: { pathname: '/seguimiento.html' },
            setTimeout,
            clearTimeout,
            fetch: async (url, options) => {
              captured = { url, options, body: JSON.parse(options.body) };
              return { ok: true, status: 200, json: async () => ({ ok: true, delivery: 'SENT', messageId: 'm1' }) };
            },
            HomeEasyAuth: {
              getAppSessionToken: () => 'session',
              buildMeta: () => ({ dispositivoId: 'device' })
            },
            document: { readyState: 'complete' }
          };
          window.window = window;
          vm.runInNewContext(fs.readFileSync('homeeasy-whatsapp-client.js', 'utf8'), {
            window,
            MutationObserver: class {},
            URL,
            console,
            CustomEvent: class {},
            AbortController,
            setTimeout,
            clearTimeout,
            encodeURIComponent
          });
          (async () => {
            await window.HomeEasyWhatsApp.sendFollowup({
              reference: 'COT-32', text: 'Hola Karen', planId: 'FUP-TEST123', expectedVersion: 7,
              generatedAt: '2026-09-03T17:50:00-05:00', phone: '573999999999'
            });
            if (!captured || !captured.url.endsWith('/api/whatsapp/send-followup')) throw new Error('wrong route');
            if ('phone' in captured.body) throw new Error('browser phone leaked');
            if (captured.body.reference !== 'COT-32' || captured.body.planId !== 'FUP-TEST123') throw new Error('contract mismatch');
            console.log('Seguimiento WhatsApp send client smoke test: PASS');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit patched UI
        run: |
          if git diff --quiet -- homeeasy-whatsapp-client.js seguimiento.html seguimiento-hommy.js; then
            echo 'No UI changes to commit'
            exit 0
          fi
          git config user.name homeeasy-automation
          git config user.email actions@users.noreply.github.com
          git add homeeasy-whatsapp-client.js seguimiento.html seguimiento-hommy.js
          git commit -m 'Seguimiento 10D: add human review and send UI'
          git push origin HEAD:seguimiento-human-send-10d
