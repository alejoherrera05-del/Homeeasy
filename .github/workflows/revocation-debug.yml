name: HomeEasy revocation trace
on:
  push:
    branches: [audit/full-fire-2026-08-27]
    paths:
      - '.github/workflows/revocation-debug.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - run: node .github/scripts/revocation_debug.mjs
