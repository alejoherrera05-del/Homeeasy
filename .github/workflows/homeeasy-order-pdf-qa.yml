name: HomeEasy Order PDF Visual Regression

on:
  pull_request:
    paths:
      - 'pedido.html'
      - 'homeeasy-docs.js'
      - 'tests/pedido-pdf-browser-regression.mjs'
      - 'tests/cotizacion-integracion-integridad.cjs'
      - '.github/workflows/homeeasy-order-pdf-qa.yml'
  push:
    branches: [main]
    paths:
      - 'pedido.html'
      - 'homeeasy-docs.js'
      - 'tests/pedido-pdf-browser-regression.mjs'
      - 'tests/cotizacion-integracion-integridad.cjs'
      - '.github/workflows/homeeasy-order-pdf-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check original document and scripts
        run: |
          node tests/homeeasy-inline-js-syntax.mjs
          node --check homeeasy-docs.js
          node --check tests/pedido-pdf-browser-regression.mjs
          node tests/cotizacion-integracion-integridad.cjs
      - name: Install isolated QA tools
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 bootstrap@5.3.3 @fontsource/montserrat@5.2.6 @fortawesome/fontawesome-free@6.4.0 jspdf@2.5.1 html2canvas@1.4.1
          npx playwright install --with-deps chromium
      - name: Package reproducible local PDF QA assets
        run: |
          mkdir -p qa/pedido-pdf/_offline/node_modules/{bootstrap/dist/css,html2canvas/dist,jspdf/dist,@fortawesome/fontawesome-free/css,@fortawesome/fontawesome-free/webfonts,@fontsource/montserrat/files}
          cp pedido.html homeeasy-docs.js homeeasy-core.js homeeasy-page-guard.js homeeasy-runtime.js homeeasy-runtime-cache.js homeeasy-cost-calculator.js cotizador-persianas.html configuracion.html cotizacion.html homeeasy-whatsapp-doc-actions.js logohomeeasy.png triangulogold.png Hommypiedepagina.png Hommycompleto.png qa/pedido-pdf/_offline/
          cp node_modules/bootstrap/dist/css/bootstrap.min.css qa/pedido-pdf/_offline/node_modules/bootstrap/dist/css/
          cp node_modules/html2canvas/dist/html2canvas.min.js qa/pedido-pdf/_offline/node_modules/html2canvas/dist/
          cp node_modules/jspdf/dist/jspdf.umd.min.js qa/pedido-pdf/_offline/node_modules/jspdf/dist/
          cp node_modules/@fortawesome/fontawesome-free/css/all.min.css qa/pedido-pdf/_offline/node_modules/@fortawesome/fontawesome-free/css/
          cp node_modules/@fortawesome/fontawesome-free/webfonts/* qa/pedido-pdf/_offline/node_modules/@fortawesome/fontawesome-free/webfonts/
          cp node_modules/@fontsource/montserrat/files/montserrat-latin-*-normal.woff2 qa/pedido-pdf/_offline/node_modules/@fontsource/montserrat/files/
      - name: Serve checked-out Hommy without live backend
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/homeeasy-order-pdf-http.log 2>&1 &
          sleep 2
      - name: Generate original order PDF in real Chromium, mobile and desktop with mock backend
        run: node tests/pedido-pdf-browser-regression.mjs
      - name: Inspect PDF pagination and produce visual previews
        if: always()
        run: |
          for pdf in qa/pedido-pdf/*.pdf; do
            [ -f "$pdf" ] || continue
            echo "PDF: $pdf"
            if command -v pdfinfo >/dev/null 2>&1; then pdfinfo "$pdf" | grep -E 'Pages:|Page size:|File size:'; fi
            if command -v pdftoppm >/dev/null 2>&1; then pdftoppm -png -scale-to 950 "$pdf" "${pdf%.pdf}-render" >/dev/null 2>&1 || true; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homeeasy-order-pdf-qa
          path: qa/pedido-pdf/
          retention-days: 14
