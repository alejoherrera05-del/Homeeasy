name: fix report PDF normal flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-report-pdf-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Render executive report in normal document flow during export
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('reportes-diseno-v4.html')
          s=p.read_text(encoding='utf-8')
          old='.board-pdf-root{position:fixed;left:0;top:0;width:210mm;background:#fff;color:#202024;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;z-index:2147483000;pointer-events:none;'
          new='.board-pdf-root{position:relative;width:210mm;margin:0 auto;background:#fff;color:#202024;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;pointer-events:none;'
          if old not in s:
              raise SystemExit('current board-pdf-root marker missing')
          s=s.replace(old,new,1)
          css_marker='.export:disabled{opacity:.65;cursor:wait}'
          css_add=css_marker+'.pdf-report-exporting{background:#fff!important;overflow:hidden!important}.pdf-report-exporting #informe-exportar,.pdf-report-exporting .loader-overlay{display:none!important}'
          if '.pdf-report-exporting #informe-exportar' not in s:
              if css_marker not in s: raise SystemExit('export disabled marker missing')
              s=s.replace(css_marker,css_add,1)
          old_fn="async function exportPDF(){const btn=$('exportBtn'),label=btn.querySelector('span'),old=label?label.textContent:'Exportar reporte';let report=null;btn.disabled=true;if(label)label.textContent='Preparando reporte…';try{if(!lastMetrics)throw new Error('El reporte aún está cargando.');report=buildBoardReport();if(document.fonts&&document.fonts.ready)await document.fonts.ready;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));await html2pdf().set({margin:0,filename:pdfFilename(),image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(report).save()}catch(e){console.error('PDF report',e);alert('No se pudo generar el reporte PDF. Inténtalo nuevamente.')}finally{if(report)report.remove();btn.disabled=false;if(label)label.textContent=old}}"
          new_fn="async function exportPDF(){const btn=$('exportBtn'),label=btn.querySelector('span'),old=label?label.textContent:'Exportar reporte',sx=window.scrollX,sy=window.scrollY;let report=null;btn.disabled=true;if(label)label.textContent='Preparando reporte…';try{if(!lastMetrics)throw new Error('El reporte aún está cargando.');report=buildBoardReport();document.body.classList.add('pdf-report-exporting');window.scrollTo(0,0);if(document.fonts&&document.fonts.ready)await document.fonts.ready;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));await html2pdf().set({margin:0,filename:pdfFilename(),image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(report).save()}catch(e){console.error('PDF report',e);alert('No se pudo generar el reporte PDF. Inténtalo nuevamente.')}finally{document.body.classList.remove('pdf-report-exporting');if(report)report.remove();window.scrollTo(sx,sy);btn.disabled=false;if(label)label.textContent=old}}"
          if old_fn not in s:
              raise SystemExit('exportPDF current implementation missing')
          s=s.replace(old_fn,new_fn,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'board-pdf-root{position:relative;width:210mm' reportes-diseno-v4.html
          grep -q 'pdf-report-exporting #informe-exportar' reportes-diseno-v4.html
          grep -q "document.body.classList.add('pdf-report-exporting')" reportes-diseno-v4.html
          git diff --check
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'homeeasy-ci'
          git config user.email 'homeeasy-ci@users.noreply.github.com'
          git rm .github/workflows/fix-report-pdf-flow.yml
          git add reportes-diseno-v4.html
          git commit -m 'Render executive PDF in stable document flow'
          git push
