name: refine reportes mobile card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-reportes-mobile-card.yml'

permissions:
  contents: write

jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate mobile goal card layout
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('reportes.html')
          s = p.read_text(encoding='utf-8')

          for style_id in ('reportes-mobile-goal-v3', 'reportes-mobile-goal-v4', 'reportes-mobile-goal-v5'):
              s = re.sub(r'<style id="' + re.escape(style_id) + r'">.*?</style>\s*', '', s, flags=re.S)

          marker = '<script src="homeeasy-core.js?v=3.5"></script>'
          if marker not in s:
              raise SystemExit('homeeasy-core marker missing')

          css = '''<style id="reportes-mobile-goal-v5">
          @media (max-width:620px){
            .goal-hero{
              display:block!important;
              min-height:0!important;
              padding:21px 18px 12px!important;
              border-radius:25px!important;
              isolation:isolate;
            }
            .goal-hero::after{
              content:"";
              position:absolute;
              z-index:0;
              width:224px;
              height:224px;
              right:-28px;
              bottom:-7px;
              top:auto!important;
              background:url('assets/hommy-dinero-mobile.svg') center/contain no-repeat;
              opacity:.21;
              filter:saturate(.96) contrast(1.03);
              pointer-events:none;
              -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.16) 14%,rgba(0,0,0,.82) 44%,#000 70%);
              mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.16) 14%,rgba(0,0,0,.82) 44%,#000 70%);
            }
            .goal-copy{
              position:relative;
              z-index:2;
              max-width:none!important;
              width:100%!important;
            }
            .goal-kicker{gap:8px;font-size:15px}
            .goal-kicker i{width:32px;height:32px;border-radius:10px}
            .goal-label{margin-top:17px;font-size:14px}
            .goal-total-row{gap:9px;margin-top:5px;align-items:center}
            .goal-total{font-size:40px;line-height:1;white-space:nowrap}
            .edit-goal{width:36px;height:36px;border-radius:11px;font-size:14px;flex:0 0 auto}
            .goal-progress-copy{margin-top:18px;display:flex;align-items:baseline;gap:8px;flex-wrap:nowrap}
            .goal-progress-copy span{font-size:14.5px}
            .goal-achieved{font-size:29px;white-space:nowrap}
            .goal-remaining{margin-top:8px;font-size:13.5px;line-height:1.4;max-width:84%}
            .goal-copy:after{
              content:"";
              display:block;
              height:1px;
              margin-top:16px;
              background:linear-gradient(90deg,rgba(60,60,67,.09),rgba(60,60,67,.03),transparent 92%);
            }
            .ring-wrap{
              position:relative;
              z-index:2;
              width:54%!important;
              min-height:151px;
              padding:14px 0 2px!important;
              margin-left:0!important;
              margin-right:auto!important;
              justify-self:start!important;
              display:flex!important;
              align-items:center!important;
              justify-content:center!important;
            }
            .ring{width:128px;height:128px;box-shadow:0 8px 22px rgba(178,86,108,.055)}
            .ring:after{inset:13px}
            .ring-center strong{font-size:31px}
            .ring-center span{margin-top:6px;font-size:12px}
            .ring-note{display:none!important}
            .hommy-stage{display:none!important}
          }

          @media (max-width:380px){
            .goal-hero{padding:19px 15px 10px!important}
            .goal-hero::after{width:202px;height:202px;right:-28px;bottom:-4px;opacity:.20}
            .goal-total{font-size:35px}
            .goal-achieved{font-size:26px}
            .goal-progress-copy span{font-size:13.5px}
            .goal-remaining{font-size:13px;max-width:86%}
            .ring-wrap{width:55%!important;min-height:141px;padding-top:12px!important}
            .ring{width:118px;height:118px}
            .ring:after{inset:12px}
            .ring-center strong{font-size:28px}
            .ring-center span{font-size:11.5px}
          }
          </style>
          '''

          s = s.replace(marker, css + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'reportes-mobile-goal-v5' reportes.html
          test "$(grep -o 'reportes-mobile-goal-v3' reportes.html | wc -l)" -eq 0
          test "$(grep -o 'reportes-mobile-goal-v4' reportes.html | wc -l)" -eq 0
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate mobile card geometry
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/he-card.log 2>&1 &
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:3,locale:'es-CO'});
            await page.route('**/homeeasy-page-guard.js*', r => r.fulfill({status:200,contentType:'application/javascript',body:'window.HomeEasyPageGuard={ready:Promise.resolve(true)};'}));
            await page.route('**/homeeasy-core.js*', r => r.fulfill({status:200,contentType:'application/javascript',body:'window.HomeEasyCore={get:async()=>({}),post:async()=>({status:"ok"})};'}));
            await page.goto('http://127.0.0.1:4173/reportes.html?periodo=este_mes',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(450);
            await page.evaluate(()=>{
              const t=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
              const loader=document.getElementById('loaderFinance'); if(loader) loader.style.display='none';
              t('dateDisplay','Mostrando: 1/8/2026 - 31/8/2026');
              t('goalKicker','Meta de ventas · Agosto');
              t('goalTotal','$10.000.000');
              t('goalAchieved','$7.199.000');
              t('goalPct','72%');
              const rem=document.getElementById('goalRemaining'); if(rem) rem.innerHTML='Nos faltan <strong>$2.801.000</strong> para cumplir la meta.';
              const ring=document.getElementById('ring'); if(ring) ring.style.background='conic-gradient(#B2566C 0 72%,#E9E6E7 72% 100%)';
            });
            const g = await page.evaluate(()=>{
              const b=s=>{const e=document.querySelector(s),r=e.getBoundingClientRect();return{top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height,display:getComputedStyle(e).display}};
              const hero=document.querySelector('.goal-hero');
              const pseudo=getComputedStyle(hero,'::after');
              return {vw:innerWidth,sw:document.documentElement.scrollWidth,hero:b('.goal-hero'),ring:b('.ring'),ringWrap:b('.ring-wrap'),stage:b('.hommy-stage'),pseudo:{width:parseFloat(pseudo.width),height:parseFloat(pseudo.height),right:pseudo.right,bottom:pseudo.bottom,opacity:Number(pseudo.opacity),bg:pseudo.backgroundImage}};
            });
            console.log('MOBILE_CARD',JSON.stringify(g,null,2));
            if(g.sw>g.vw+1) throw new Error('horizontal overflow');
            if(g.hero.height>420) throw new Error('card remains too tall: '+g.hero.height);
            if(g.stage.display!=='none') throw new Error('old Hommy stage visible');
            if(!g.pseudo.bg.includes('hommy-dinero-mobile.svg')) throw new Error('approved Hommy asset missing');
            if(g.pseudo.width>230) throw new Error('Hommy too large');
            if(g.pseudo.opacity>.23) throw new Error('Hommy too dominant');
            if(g.ringWrap.width>230) throw new Error('ring area not shifted left');
            if(g.ring.left > g.hero.left + 105) throw new Error('ring still too centered');
            await page.screenshot({path:'reportes-card-mobile-v5.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: reportes-card-mobile-v5
          path: reportes-card-mobile-v5.png

      - name: Commit tested HTML refinement
        run: |
          git config user.name 'homeeasy-ci'
          git config user.email 'homeeasy-ci@users.noreply.github.com'
          git rm .github/workflows/refine-reportes-mobile-card.yml
          git add reportes.html
          git commit -m 'Polish mobile sales goal composition'
          git push
