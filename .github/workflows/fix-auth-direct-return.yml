name: fix auth direct return

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix-auth-direct-return.py'
      - '.github/workflows/fix-auth-direct-return.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply auth return fix
        run: |
          python3 tools/fix-auth-direct-return.py
          grep -q "allowCurrent: true" homeeasy-auth.js
          grep -q "HomeEasy Auth v0.4.2" homeeasy-auth.js
          grep -q "homeeasy-auth.js?v=3.5" login.html
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test protected-page return target
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/auth-return.log 2>&1 &
          sleep 2
          cat > auth-return-test.js <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            await page.route('**/script.google.com/**', r => r.fulfill({status:200,contentType:'application/json',body:'{"status":"ok","cotizaciones":[]}'}));
            await page.route('**/homeeasy-page-guard.js*', r => r.fulfill({status:200,contentType:'application/javascript',body:''}));
            await page.goto('http://127.0.0.1:4173/seguimiento.html?rev=return-test',{waitUntil:'domcontentloaded'});
            await page.addScriptTag({url:'http://127.0.0.1:4173/homeeasy-auth-config.js?v=3.3'});
            await page.addScriptTag({url:'http://127.0.0.1:4173/homeeasy-auth.js?v=3.5'});
            const protectedResult = await page.evaluate(()=>{
              const built = HomeEasyAuth.buildLoginUrl('seguimiento.html?rev=return-test');
              const u = new URL(built);
              return {ret:u.searchParams.get('return'), built};
            });
            console.log('PROTECTED_RETURN', protectedResult);
            if(protectedResult.ret !== 'seguimiento.html?rev=return-test') throw new Error('protected page return target was lost');

            await page.goto('http://127.0.0.1:4173/login.html?return=seguimiento.html%3Frev%3Dreturn-test',{waitUntil:'domcontentloaded'});
            const loginResult = await page.evaluate(()=>({
              target: HomeEasyAuth.safeReturnUrl(new URLSearchParams(location.search).get('return'),'index.html'),
              exactSelf: HomeEasyAuth.safeReturnUrl(location.pathname.split('/').pop() + location.search,'index.html')
            }));
            console.log('LOGIN_RETURN', loginResult);
            if(loginResult.target !== 'seguimiento.html?rev=return-test') throw new Error('login rejected valid module return');
            if(loginResult.exactSelf !== 'index.html') throw new Error('exact login self-loop protection regressed');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node auth-return-test.js

      - name: Commit tested fix
        run: |
          git config user.name 'homeeasy-ci'
          git config user.email 'homeeasy-ci@users.noreply.github.com'
          git add homeeasy-auth.js login.html activar-cuenta.html homeeasy-core.js homeeasy-page-guard.js
          git commit -m 'Preserve protected module after login'
          git push
