name: fix report QA tolerance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-report-qa-tolerance.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-and-rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Accept precise goal percentage in QA
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/reportes-v4-qa.yml')
          s=p.read_text(encoding='utf-8')
          old="if(board.pages!==2||board.goal!=='72%'||board.bars!==12||board.paySegments<2) throw new Error('Estructura gráfica del PDF incompleta: '+JSON.stringify(board));"
          new="if(board.pages!==2||Math.abs(parseFloat(board.goal)-72)>.05||board.bars!==12||board.paySegments<2) throw new Error('Estructura gráfica del PDF incompleta: '+JSON.stringify(board));"
          if old not in s: raise SystemExit('QA goal assertion marker missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          grep -q 'Math.abs(parseFloat(board.goal)-72)>.05' .github/workflows/reportes-v4-qa.yml
      - name: Commit QA fix and remove temporary workflow
        run: |
          git config user.name 'homeeasy-ci'
          git config user.email 'homeeasy-ci@users.noreply.github.com'
          git rm .github/workflows/fix-report-qa-tolerance.yml
          git add .github/workflows/reportes-v4-qa.yml
          git commit -m 'Fix executive report QA percentage tolerance'
          git push
      - name: Dispatch corrected QA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run reportes-v4-qa.yml --ref main
