name: Apply Config Login 4.0

on:
  push:
    paths:
      - '.github/workflows/apply-config-login-4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch configuracion.html safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, base64
          def dec(value): return base64.b64decode(value).decode('utf-8')
          path = Path('configuracion.html')
          raw = path.read_bytes()
          git_sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          expected = 'cd17e221938ca9ba41f331c123e38857c8585763'
          if git_sha != expected:
              raise SystemExit(f'SAFETY STOP: configuracion.html SHA {git_sha} != expected {expected}')
          text = raw.decode('utf-8')
          old_font = dec('Zm9udC1mYW1pbHk6ICdNb250c2VycmF0Jywgc2Fucy1zZXJpZjs=')
          new_font = dec('Zm9udC1mYW1pbHk6IC1hcHBsZS1zeXN0ZW0sIEJsaW5rTWFjU3lzdGVtRm9udCwgIlNGIFBybyBUZXh0IiwgIlNGIFBybyBEaXNwbGF5IiwgIlNlZ29lIFVJIFZhcmlhYmxlIiwgIlNlZ29lIFVJIiwgc3lzdGVtLXVpLCBzYW5zLXNlcmlmOw==')
          old_logo = dec('')
          new_logo = dec('ICAgICAgICAgICAgICAgIDxkaXYgY2xhc3M9ImFjY2Vzcy1pY29uLWJhZGdlIiBhcmlhLWhpZGRlbj0idHJ1ZSI+PGkgY2xhc3M9ImZhLXNvbGlkIGZhLWdlYXIiPjwvaT48L2Rpdj4KICAgICAgICAgICAgICAgIDxkaXYgY2xhc3M9ImFjY2Vzcy1leWVicm93Ij48aSBjbGFzcz0iZmEtc29saWQgZmEtZ2VhciI+PC9pPiBBanVzdGVzIGRlIEhvbWVFYXN5PC9kaXY+')
          override = dec('')
          if text.count(old_font) != 1:
              raise SystemExit('SAFETY STOP: font target count != 1')
          if text.count(old_logo) != 1:
              raise SystemExit('SAFETY STOP: access logo target count != 1')
          if 'CONFIGURACIÓN 4.0 — PULIDO VISUAL DEL LOGIN' in text:
              raise SystemExit('SAFETY STOP: patch already present')
          if text.count('</style>') != 1:
              raise SystemExit('SAFETY STOP: style close count != 1')
          text = text.replace(old_font, new_font, 1)
          text = text.replace(old_logo, new_logo, 1)
          text = text.replace('</style>', override + '\n    </style>', 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Validate required access IDs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('configuracion.html').read_text(encoding='utf-8')
          required=['accessScreen','accessCard','pinInput','pinEyeButton','pinEyeIcon','accessSubmit','accessStatus','settingsApp','lockButton']
          missing=[x for x in required if f'id="{x}"' not in s]
          if missing:
              raise SystemExit('Missing required IDs: '+','.join(missing))
          if 'CONFIGURACIÓN 4.0 — PULIDO VISUAL DEL LOGIN' not in s:
              raise SystemExit('Visual patch marker missing')
          if 'access-icon-badge' not in s:
              raise SystemExit('Gear badge missing')
          PY
      - name: Commit polish and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-config-login-4.yml
          git config user.name "HomeEasy Update"
          git config user.email "actions@users.noreply.github.com"
          git add configuracion.html .github/workflows/apply-config-login-4.yml
          git commit -m "Polish Configuración login 4.0"
          git push
