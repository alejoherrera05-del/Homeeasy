name: Clean Hommy Follow-up Audit 10F.1

on:
  push:
    branches:
      - hommy-followup-audit-10f1
    paths:
      - 'hommy_backend/followup.py'
      - 'hommy_backend/followup_experience.py'
      - 'tests/test_hommy_followup.py'
      - 'tests/test_hommy_followup_experience.py'
      - 'tests/test_hommy_whatsapp_context.py'
      - 'tests/test_hommy_followup_audit_10f1.py'
      - '.github/workflows/hommy-followup-audit-10f1-clean-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: test-key-not-for-network-calls
      HOMMY_CONVERSATION_SECRET: hommy-ci-conversation-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend
        run: python -m py_compile servidor.py hommy_backend/*.py
      - name: Run full Hommy unit contracts
        run: python -m unittest discover -s tests -v
      - name: Verify 10F.1 audit contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('hommy_backend/followup.py').read_text(encoding='utf-8')
          experience = Path('hommy_backend/followup_experience.py').read_text(encoding='utf-8')
          assert 'PLAYBOOK_VERSION = "1.4"' in source
          assert 'FOLLOWUP_STAGE = "10F.1"' in source
          assert 'has_unverified_relationship_claim' in source
          assert 'FOLLOWUP_UNVERIFIED_RELATIONSHIP_CLAIM' in source
          assert 'quedo pendiente' in source.lower()
          assert 'normalmente NO las repitas' in source
          plan_start = source.index('    def plan(')
          plan_source = source[plan_start:]
          assert 'latest_detail = self.followup_client.detail' not in plan_source
          assert 'latest_whatsapp = self.whatsapp_client.context' not in plan_source
          assert 'revalidates both state version and WhatsApp conversation' in plan_source
          assert '_PRODUCT_CANONICAL' in experience
          assert 'Onda Serena' in experience
          assert '_RELATIONSHIP_PATTERNS' in experience
          print('Clean Hommy 10F.1 audit contract: PASS')
          PY
      - name: Diff hygiene
        run: git diff --check
