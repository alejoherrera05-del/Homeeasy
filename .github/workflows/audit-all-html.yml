name: audit all HomeEasy HTML

on:
  push:
    branches: [main]
    paths:
      - 'tools/audit-all-html.py'
      - 'tools/audit-all-html-browser.js'
      - '.github/workflows/audit-all-html.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Static audit of every HTML
        run: python3 tools/audit-all-html.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/homeeasy-html-audit.log 2>&1 &
          sleep 2

      - name: Browser audit of every HTML
        id: browser
        continue-on-error: true
        run: node tools/audit-all-html-browser.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homeeasy-html-audit
          path: |
            audit-html-static.json
            audit-html-browser.json
          if-no-files-found: warn

      - name: Enforce production browser health
        if: steps.browser.outcome != 'success'
        run: |
          echo 'Production HTML browser audit found blockers. See previous step and artifact.'
          exit 1
