name: Adaptive Sales History

on:
  push:
    paths:
      - '.github/ventas-adaptive-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply responsive CSS with regression barriers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re

          encoded = ''''''
          css = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          p = Path('ventas.html')
          raw = p.read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          expected = '0f2540effa4ca1f7b4809c59cb87a8a0845b437e'
          if sha != expected:
              raise SystemExit(f'SAFETY STOP: ventas.html SHA {sha} != {expected}')

          text = raw.decode('utf-8')
          marker = 'HOMEEASY VENTAS 2.0 — ESCALA ADAPTATIVA'
          if marker in text:
              raise SystemExit('SAFETY STOP: adaptive block already present')
          if text.count('</style>') != 1:
              raise SystemExit('SAFETY STOP: style close count mismatch')

          body_before = text[text.index('<body>'):]
          ids_before = set(re.findall(r'id="([^"]+)"', text))
          hrefs_before = re.findall(r'href="([^"]+)"', text)
          js_before = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', text, re.S)

          text = text.replace('</style>', css + '\n</style>', 1)

          if text[text.index('<body>'):] != body_before:
              raise SystemExit('SAFETY STOP: body/markup changed')
          if set(re.findall(r'id="([^"]+)"', text)) != ids_before:
              raise SystemExit('SAFETY STOP: IDs changed')
          if re.findall(r'href="([^"]+)"', text) != hrefs_before:
              raise SystemExit('SAFETY STOP: routes changed')
          if re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', text, re.S) != js_before:
              raise SystemExit('SAFETY STOP: inline JavaScript changed')
          if text.count(marker) != 1:
              raise SystemExit('SAFETY STOP: adaptive marker missing/duplicated')

          p.write_text(text, encoding='utf-8', newline='\n')
          Path('/tmp/ventas-inline.js').write_text('\n'.join(js_before), encoding='utf-8')
          PY
      - name: Validate syntax and responsive markers
        shell: bash
        run: |
          node --check /tmp/ventas-inline.js
          grep -q 'HOMEEASY VENTAS 2.0 — ESCALA ADAPTATIVA' ventas.html
          grep -q 'tbody tr{display:grid' ventas.html
          grep -q 'table-row' ventas.html
          grep -q '@media(max-width:560px)' ventas.html
          grep -q 'font-size:1rem' ventas.html
      - name: Commit and remove deployment helpers
        shell: bash
        run: |
          rm -f .github/workflows/ventas-adaptive.yml .github/ventas-adaptive-trigger.txt
          git config user.name 'HomeEasy Update'
          git config user.email 'actions@users.noreply.github.com'
          git add ventas.html .github/workflows/ventas-adaptive.yml .github/ventas-adaptive-trigger.txt
          git commit -m 'Make sales history adaptive and readable'
          git push
