name: Patch WhatsApp LID Context 10C1

on:
  push:
    branches:
      - whatsapp-lid-context-10c1
    paths:
      - 'infra/whatsapp/patch_lid_context_10c1.py'
      - '.github/workflows/patch-whatsapp-lid-context-10c1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: whatsapp-lid-context-10c1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply patch
        run: python infra/whatsapp/patch_lid_context_10c1.py

      - name: Validate syntax and context tests
        run: |
          node --check infra/whatsapp/bridge/server.js
          node --check infra/whatsapp/bridge/conversation.js
          node --check infra/whatsapp/bridge/test-conversation.js
          node --check infra/whatsapp/bridge/test-conversation-smoke.js
          node infra/whatsapp/bridge/test-conversation.js
          node infra/whatsapp/bridge/test-conversation-smoke.js

      - name: Verify LID boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('infra/whatsapp/bridge/server.js').read_text(encoding='utf-8')
          assert "const BRIDGE_VERSION = '0.6.1'" in source
          assert '/lids/pn/' in source
          assert '/api/contacts?contactId=' in source
          assert 'resolveConversationChatCandidates' in source
          assert 'fetchConversationMessagesCandidate' in source
          assert 'downloadMedia' in source
          assert 'lidResolved' in source
          assert "url.searchParams.get('phone')" not in source
          print('LID-aware quote-bound context boundary: PASS')
          PY

      - name: Diff hygiene
        run: git diff --check

      - name: Commit patch result
        run: |
          if git diff --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git config user.name 'homeeasy-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add infra/whatsapp/bridge/server.js infra/whatsapp/bridge/test-conversation-smoke.js
          git commit -m 'Resolve WhatsApp PN and LID history for follow-up context'
          git push origin HEAD:whatsapp-lid-context-10c1
