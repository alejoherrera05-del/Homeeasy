name: fix Seguimiento v2 builder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-seguimiento-v2-builder.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make card replacement structural
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-seguimiento-v2.yml')
          s=p.read_text(encoding='utf-8')
          old="""          if old_card not in s:\n              raise SystemExit('card template marker missing')\n          s = s.replace(old_card, new_card, 1)\n"""
          new="""          card_pattern = re.compile(r'                container\\.innerHTML \\+= `.*?                `;', re.S)\n          s, card_count = card_pattern.subn(new_card, s, count=1)\n          if card_count != 1:\n              raise SystemExit('card template structural match failed')\n"""
          if old not in s:
              raise SystemExit('builder patch marker missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
      - name: Commit builder fix
        run: |
          git config user.name 'homeeasy-ci'
          git config user.email 'homeeasy-ci@users.noreply.github.com'
          git rm .github/workflows/fix-seguimiento-v2-builder.yml
          git add .github/workflows/build-seguimiento-v2.yml
          git commit -m 'Fix Seguimiento v2 structural card replacement'
          git push
