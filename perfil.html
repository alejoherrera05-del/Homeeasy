<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7">
<title>HomeEasy | Mi perfil</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="homeeasy-core.js?v=3.4"></script><script src="homeeasy-page-guard.js?v=3.4"></script>
<style>
:root{--wine:#a6455a;--gold:#c2a468;--text:#292529;--muted:#817b80;--line:#e8e5e7;--bg:#f5f5f7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}button,input{font:inherit}.header{position:sticky;top:0;z-index:10;background:rgba(245,245,247,.84);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.04)}.header-inner{width:min(900px,100%);margin:auto;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}.round{width:42px;height:42px;border:0;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(45,35,40,.07);display:grid;place-items:center;color:var(--wine);text-decoration:none}.brand{text-align:center}.brand strong{display:block;color:var(--wine);font-size:.94rem;font-weight:700}.brand span{display:block;margin-top:2px;color:var(--muted);font-size:.62rem}.shell{width:min(760px,100%);margin:auto;padding:28px 18px 70px}.hero{padding:26px;border-radius:28px;background:linear-gradient(145deg,#ad4b62,#8c354a);color:#fff;box-shadow:0 22px 55px rgba(130,54,70,.22)}.hero-top{display:flex;align-items:center;gap:16px}.avatar{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.23);font-size:1.1rem;font-weight:700}.hero h1{margin:0;font-size:1.45rem;font-weight:700;letter-spacing:-.035em}.email{margin-top:5px;color:rgba(255,255,255,.78);font-size:.75rem}.role{display:inline-flex;margin-top:10px;padding:6px 9px;border-radius:999px;background:rgba(194,164,104,.22);color:#f7e2aa;font-size:.58rem;font-weight:700;letter-spacing:.06em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.tile{padding:16px;border-radius:18px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 8px 26px rgba(40,32,36,.035)}.tile span{display:block;color:var(--muted);font-size:.58rem;font-weight:650;text-transform:uppercase;letter-spacing:.04em}.tile strong{display:block;margin-top:6px;font-size:.79rem;font-weight:650;line-height:1.4}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.action{height:50px;border-radius:15px;border:1px solid var(--line);background:#fff;color:var(--wine);font-weight:650}.action.primary{background:var(--wine);border-color:var(--wine);color:#fff}.action.danger{grid-column:1/-1;color:#b53a51}.session-note{margin-top:18px;padding:14px 15px;border-radius:15px;background:rgba(194,164,104,.09);color:#75643d;font-size:.68rem;line-height:1.5}.session-note i{color:var(--gold);margin-right:7px}@media(max-width:560px){.grid,.actions{grid-template-columns:1fr}.action.danger{grid-column:auto}.hero{padding:22px}.avatar{width:60px;height:60px;border-radius:19px}}</style>
<style id="he-font-synthesis-fix">body,button,input,select,textarea{font-synthesis:none}</style>
</head>
<body><header class="header"><div class="header-inner"><a class="round" href="index.html" aria-label="Volver"><i class="fa-solid fa-chevron-left"></i></a><div class="brand"><strong>Mi perfil</strong><span>Sistema Hommy</span></div><span></span></div></header>
<main class="shell"><section class="hero"><div class="hero-top"><div class="avatar" id="avatar">HE</div><div><h1 id="name">Usuario HomeEasy</h1><div class="email" id="email"></div><div class="role" id="role">USUARIO</div></div></div></section>
<section class="grid"><div class="tile"><span>Estado</span><strong id="status">—</strong></div><div class="tile"><span>Último acceso</span><strong id="lastAccess">—</strong></div><div class="tile"><span>Dispositivo</span><strong id="device">—</strong></div><div class="tile"><span>Plataforma</span><strong id="platform">—</strong></div></section>
<section class="actions"><button class="action primary" id="changePassword"><i class="fa-solid fa-key"></i> Cambiar contraseña</button><button class="action" id="renameDevice"><i class="fa-solid fa-laptop"></i> Renombrar dispositivo</button><button class="action danger" id="logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar sesión</button></section><div class="session-note"><i class="fa-solid fa-shield-halved"></i>Tu perfil usa la sesión personal de HomeEasy. No necesita el PIN de Configuración.</div></main>
<script>
'use strict';
function fmt(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})}
function init(){const a=window.HomeEasyAuth,p=a&&a.getCurrentProfile?a.getCurrentProfile():null;if(!p)return;const parts=String(p.nombre||'').trim().split(/\s+/).filter(Boolean);document.getElementById('avatar').textContent=parts.length>1?(parts[0][0]+parts.at(-1)[0]).toUpperCase():(parts[0]||'HE').slice(0,2).toUpperCase();document.getElementById('name').textContent=p.nombre||'Usuario HomeEasy';document.getElementById('email').textContent=p.email||'';document.getElementById('role').textContent=p.rol||'USUARIO';document.getElementById('status').textContent=p.estado||'ACTIVO';document.getElementById('lastAccess').textContent=fmt(p.ultimoAcceso);const d=HomeEasyCore.getDeviceInfo();document.getElementById('device').textContent=d.name||'Este dispositivo';document.getElementById('platform').textContent=[d.platform,d.browser].filter(Boolean).join(' · ')||'—'}
window.addEventListener('homeeasy:page-auth-ready',init);document.addEventListener('DOMContentLoaded',()=>setTimeout(init,60));
document.getElementById('changePassword').onclick=async()=>{const r=await Swal.fire({title:'Cambiar contraseña',html:'<input id="p1" class="swal2-input" type="password" placeholder="Nueva contraseña"><input id="p2" class="swal2-input" type="password" placeholder="Repetir contraseña">',showCancelButton:true,confirmButtonText:'Cambiar',cancelButtonText:'Cancelar',confirmButtonColor:'#a6455a',preConfirm:()=>{const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<8)return Swal.showValidationMessage('Usa al menos 8 caracteres.');if(a!==b)return Swal.showValidationMessage('Las contraseñas no coinciden.');return a}});if(r.isConfirmed){try{await HomeEasyAuth.changePassword(r.value);Swal.fire({icon:'success',title:'Contraseña actualizada',confirmButtonColor:'#a6455a'})}catch(e){Swal.fire({icon:'error',title:'No se pudo cambiar',text:e.message,confirmButtonColor:'#a6455a'})}}};
document.getElementById('renameDevice').onclick=async()=>{const d=HomeEasyCore.getDeviceInfo();const r=await Swal.fire({title:'Nombre del dispositivo',input:'text',inputValue:d.name||'',showCancelButton:true,confirmButtonText:'Guardar',cancelButtonText:'Cancelar',confirmButtonColor:'#a6455a'});if(r.isConfirmed){HomeEasyCore.setDeviceName(r.value);init()}};
document.getElementById('logout').onclick=async()=>{try{await HomeEasyAuth.signOut({meta:HomeEasyCore.buildMeta()})}finally{HomeEasyCore.clearSensitiveBrowserCaches();location.replace('login.html')}};
</script></body></html>
