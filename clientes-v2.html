<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9fa">
  <title>HomeEasy | Clientes 2.0 Preview</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f8f9fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",sans-serif;color:#1d1d1f}
    .preview-bootstrap{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#f8f9fa;z-index:999999}
    .preview-card{width:min(360px,100%);text-align:center}
    .preview-mark{width:52px;height:52px;margin:0 auto 16px;border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:0 10px 32px rgba(38,31,34,.08);color:#a6455a;font-size:22px;font-weight:800}
    .preview-title{font-size:1.08rem;font-weight:750;letter-spacing:-.02em}
    .preview-sub{margin-top:7px;color:#8e8e93;font-size:.82rem}
    .preview-error{display:none;margin-top:18px;padding:14px 16px;border-radius:16px;background:#fff;color:#8a3b4c;font-size:.78rem;line-height:1.5}
  </style>
</head>
<body>
  <div class="preview-bootstrap" id="previewBootstrap">
    <div class="preview-card">
      <div class="preview-mark">H</div>
      <div class="preview-title">Preparando Clientes</div>
      <div class="preview-sub">Cargando la vista de prueba…</div>
      <div class="preview-error" id="previewError">No fue posible abrir la vista de prueba. Inténtalo nuevamente.</div>
    </div>
  </div>

  <script>
  (async function(){
    try{
      const stamp='clientes-v2-20260828-r2';
      const [pageResponse,guardResponse]=await Promise.all([
        fetch('./clientes.html?previewSource='+stamp,{cache:'no-store'}),
        fetch('./homeeasy-page-guard.js?previewGuard='+stamp,{cache:'no-store'})
      ]);
      if(!pageResponse.ok||!guardResponse.ok) throw new Error('No fue posible cargar Clientes.');

      let source=await pageResponse.text();
      let guard=await guardResponse.text();
      guard=guard.replace(/const currentPage = \(\(global\.location[\s\S]*?\.trim\(\);/,"const currentPage = 'clientes.html';");
      guard=guard.replace(/<\/script/gi,'<\\/script');
      source=source.replace('`clientes.html?search=${cedula}`','`clientes-v2.html?search=${cedula}`');
      source=source.replace("window.history.replaceState({}, '', 'clientes.html');","window.history.replaceState({}, '', 'clientes-v2.html');");

      const parser=new DOMParser();
      const doc=parser.parseFromString(source,'text/html');
      doc.title='HomeEasy | Clientes 2.0';
      doc.body.classList.add('clientes-v2-preview');

      const guardTag=[...doc.querySelectorAll('script[src]')].find(node=>String(node.getAttribute('src')||'').includes('homeeasy-page-guard.js'));
      if(!guardTag) throw new Error('No se encontró el guard de Clientes.');
      const inlineGuard=doc.createElement('script');
      inlineGuard.textContent=guard;
      guardTag.replaceWith(inlineGuard);

      const css=doc.createElement('link');
      css.rel='stylesheet';
      css.href='./clientes-v2-preview.css?v=2';
      doc.head.appendChild(css);

      const enhancer=doc.createElement('script');
      enhancer.src='./clientes-v2-preview.js?v=2';
      enhancer.defer=false;
      doc.body.appendChild(enhancer);

      document.open();
      document.write('<!DOCTYPE html>'+doc.documentElement.outerHTML);
      document.close();
    }catch(error){
      console.error('Clientes 2.0 preview:',error);
      const box=document.getElementById('previewError');
      if(box)box.style.display='block';
    }
  })();
  </script>
</body>
</html>
