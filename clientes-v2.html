<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9fa">
  <title>HomeEasy | Clientes 2.0 Preview</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8f9fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:#1d1d1f}
    #clientesPreviewFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f8f9fa;opacity:0;transition:opacity .16s ease}
    #clientesPreviewFrame.is-ready{opacity:1}
    .preview-loader{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:#f8f9fa;transition:opacity .16s ease}
    .preview-loader.is-hidden{opacity:0;pointer-events:none}
    .preview-card{width:min(360px,100%);text-align:center}
    .preview-mark{width:52px;height:52px;margin:0 auto 16px;border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:0 10px 32px rgba(38,31,34,.08);color:#a6455a;font-size:22px;font-weight:800}
    .preview-title{font-size:1.08rem;font-weight:760;letter-spacing:-.02em}
    .preview-sub{margin-top:7px;color:#8e8e93;font-size:.82rem;line-height:1.45}
    .preview-error{display:none;margin-top:18px;padding:14px 16px;border-radius:16px;background:#fff;color:#8a3b4c;font-size:.78rem;line-height:1.5;box-shadow:0 8px 26px rgba(30,24,27,.06)}
  </style>
</head>
<body>
  <div class="preview-loader" id="previewLoader">
    <div class="preview-card">
      <div class="preview-mark">H</div>
      <div class="preview-title">Preparando Clientes</div>
      <div class="preview-sub">Cargando la experiencia de prueba…</div>
      <div class="preview-error" id="previewError">No fue posible aplicar la vista de prueba. Cierra esta pestaña e inténtalo nuevamente.</div>
    </div>
  </div>

  <iframe id="clientesPreviewFrame" title="Clientes HomeEasy" src="./clientes.html?clientesPreview=iphone-r3"></iframe>

  <script>
  (function(){
    'use strict';
    const frame=document.getElementById('clientesPreviewFrame');
    const loader=document.getElementById('previewLoader');
    const errorBox=document.getElementById('previewError');
    let injecting=false;

    async function injectPreview(){
      if(injecting)return;
      injecting=true;
      try{
        const doc=frame.contentDocument;
        const win=frame.contentWindow;
        if(!doc||!doc.head||!doc.body||!win)throw new Error('Documento de Clientes no disponible');

        const path=(win.location.pathname.split('/').pop()||'').toLowerCase();
        if(path&&path!=='clientes.html'){
          window.location.replace(win.location.href);
          return;
        }

        const stamp='iphone-r3-20260828';
        const [cssResponse,jsResponse]=await Promise.all([
          fetch('./clientes-v2-preview.css?'+stamp,{cache:'no-store'}),
          fetch('./clientes-v2-preview.js?'+stamp,{cache:'no-store'})
        ]);
        if(!cssResponse.ok||!jsResponse.ok)throw new Error('Assets de Clientes 2.0 no disponibles');

        const [cssText,jsText]=await Promise.all([cssResponse.text(),jsResponse.text()]);
        doc.getElementById('clientesV2InjectedStyle')?.remove();
        doc.getElementById('clientesV2InjectedScript')?.remove();

        const style=doc.createElement('style');
        style.id='clientesV2InjectedStyle';
        style.textContent=cssText;
        doc.head.appendChild(style);

        const script=doc.createElement('script');
        script.id='clientesV2InjectedScript';
        script.textContent=jsText+'\n//# sourceURL=clientes-v2-preview-injected.js';
        doc.body.appendChild(script);

        doc.addEventListener('click',function(event){
          const link=event.target&&event.target.closest?event.target.closest('a[href]'):null;
          if(!link)return;
          const href=String(link.getAttribute('href')||'');
          if(href==='index.html'||href.startsWith('index.html?')){
            event.preventDefault();
            window.location.href='./index.html';
          }
        },true);

        frame.classList.add('is-ready');
        loader.classList.add('is-hidden');
        setTimeout(()=>{loader.style.display='none'},220);
      }catch(error){
        console.error('Clientes 2.0 preview:',error);
        if(errorBox)errorBox.style.display='block';
      }finally{
        injecting=false;
      }
    }

    frame.addEventListener('load',()=>setTimeout(injectPreview,0));
  })();
  </script>
</body>
</html>
