    function previewEnhancer(){
      'use strict';
      const previewState={OP:[],COT:[]};
      let toastTimer=null;

      function text(id){const el=document.getElementById(id);return el?String(el.textContent||'').trim():''}
      function number(value){const parsed=Number(String(value??'').replace(/[^0-9.-]/g,''));return Number.isFinite(parsed)?parsed:0}
      function money(value){return '$'+Math.round(number(value)).toLocaleString('es-CO')}
      function initials(name){return String(name||'C').trim().split(/\s+/).filter(Boolean).slice(0,2).map(part=>part[0]).join('').toUpperCase()||'C'}
      function phoneDigits(raw){
        let digits=String(raw||'').replace(/\D/g,'');
        if(digits.length===10&&digits.startsWith('3')) digits='57'+digits;
        if(digits.length===12&&digits.startsWith('57')) return digits;
        return digits;
      }
      function contactText(){
        const email=text('c_email');
        return [
          text('c_nombre'),
          'Cédula: '+text('c_cedula'),
          'Teléfono: '+text('c_tel'),
          'Correo: '+(email||'Sin correo registrado'),
          'Dirección: '+text('c_dir')
        ].filter(Boolean).join('\n');
      }
      function showToast(message){
        let toast=document.querySelector('.cliente-v2-toast');
        if(!toast){toast=document.createElement('div');toast.className='cliente-v2-toast';document.body.appendChild(toast)}
        toast.textContent=message;
        requestAnimationFrame(()=>toast.classList.add('is-visible'));
        clearTimeout(toastTimer);
        toastTimer=setTimeout(()=>toast.classList.remove('is-visible'),1500);
      }
      async function copyText(value){
        try{
          if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value)}
          else{
            const area=document.createElement('textarea');area.value=value;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();
          }
          showToast('Datos copiados');
        }catch(error){showToast('No se pudo copiar')}
      }
      function makeAction(icon,label,handler){
        const button=document.createElement('button');
        button.type='button';button.className='cliente-v2-action';button.setAttribute('aria-label',label);
        const i=document.createElement('i');i.className='fas '+icon;i.setAttribute('aria-hidden','true');
        const span=document.createElement('span');span.textContent=label;
        button.append(i,span);button.addEventListener('click',handler);return button;
      }
      function makeMetric(label,value,extraClass){
        const card=document.createElement('div');card.className='cliente-v2-metric'+(extraClass?' '+extraClass:'');
        const l=document.createElement('div');l.className='cliente-v2-metric-label';l.textContent=label;
        const v=document.createElement('div');v.className='cliente-v2-metric-value';v.textContent=value;
        card.append(l,v);return card;
      }
      function updateTabs(){
        [['ordenes-tab','Órdenes',previewState.OP.length],['cotizaciones-tab','Cotizaciones',previewState.COT.length]].forEach(([id,label,count])=>{
          const tab=document.getElementById(id);if(!tab)return;
          tab.textContent='';
          const title=document.createElement('span');title.textContent=label;
          const badge=document.createElement('span');badge.className='cliente-v2-tab-count';badge.textContent=String(count||0);
          tab.append(title,badge);
        });
      }
      function updateMetrics(){
        const host=document.querySelector('.cliente-v2-metrics');if(!host)return;
        const validOps=previewState.OP.filter(item=>!String(item&&item.estado||'').toUpperCase().includes('ANUL'));
        const validQuotes=previewState.COT.filter(item=>!String(item&&item.estado||'').toUpperCase().includes('ANUL'));
        const total=validOps.reduce((sum,item)=>sum+number(item&&item.total),0);
        const saldo=validOps.reduce((sum,item)=>sum+Math.max(0,number(item&&item.saldo)),0);
        host.replaceChildren(
          makeMetric('Compras registradas',money(total)),
          makeMetric('Saldo pendiente',money(saldo),'cliente-v2-metric--saldo'),
          makeMetric('Órdenes',String(validOps.length)),
          makeMetric('Cotizaciones',String(validQuotes.length))
        );
      }
      function decorateCards(prefix){
        const container=document.getElementById(prefix==='OP'?'lista_ordenes':'lista_cotizaciones');if(!container)return;
        container.querySelectorAll('.item-card').forEach(card=>{
          if(card.dataset.v2Decorated==='1')return;
          card.dataset.v2Decorated='1';
          if(prefix==='OP'){
            const history=card.querySelector('.payment-history');
            const footer=card.querySelector('.item-footer');
            if(history&&footer){
              const count=history.querySelectorAll('.payment-item').length;
              const toggle=document.createElement('button');toggle.type='button';toggle.className='preview-payments-toggle';
              const label=document.createElement('span');label.textContent=count?('Ver historial de pagos · '+count):'Ver historial de pagos';
              const icon=document.createElement('i');icon.className='fas fa-chevron-down';icon.setAttribute('aria-hidden','true');
              toggle.append(label,icon);
              toggle.addEventListener('click',event=>{event.stopPropagation();if(typeof togglePagos==='function')togglePagos(history.id);icon.className=history.style.display==='block'?'fas fa-chevron-up':'fas fa-chevron-down'});
              footer.before(toggle);
            }
          }
        });
      }
      function buildClientWorkspace(){
        const card=document.querySelector('.client-card');
        const nameRow=card&&card.querySelector('.client-name');
        const nameSpan=document.getElementById('c_nombre');
        const info=card&&card.querySelector('.client-info');
        const tabs=card&&card.querySelector('.nav-tabs-custom');
        if(!card||!nameRow||!info||!tabs||!nameSpan)return;

        if(!nameRow.querySelector('.cliente-v2-avatar')){
          const avatar=document.createElement('div');avatar.className='cliente-v2-avatar';avatar.textContent=initials(nameSpan.textContent);
          nameRow.insertBefore(avatar,nameSpan);
        }else{nameRow.querySelector('.cliente-v2-avatar').textContent=initials(nameSpan.textContent)}

        const labels=['Cédula','Teléfono','Correo','Dirección'];
        [...info.children].forEach((row,index)=>{row.dataset.v2Label=labels[index]||'Dato'});
        const email=document.getElementById('c_email');
        if(email&&/sincorreo|no registrado/i.test(String(email.textContent||''))) email.textContent='Sin correo registrado';

        let actions=card.querySelector('.cliente-v2-actions');
        if(!actions){
          actions=document.createElement('div');actions.className='cliente-v2-actions';
          actions.append(
            makeAction('fa-whatsapp','WhatsApp',()=>{const digits=phoneDigits(text('c_tel'));if(digits)window.open('https://wa.me/'+digits,'_blank','noopener,noreferrer');else showToast('Sin teléfono válido')}),
            makeAction('fa-phone','Llamar',()=>{const digits=phoneDigits(text('c_tel'));if(digits)window.location.href='tel:+'+digits;else showToast('Sin teléfono válido')}),
            makeAction('fa-copy','Copiar',()=>copyText(contactText())),
            makeAction('fa-share-nodes','Compartir',async()=>{const value=contactText();if(navigator.share){try{await navigator.share({title:'Cliente HomeEasy',text:value});return}catch(error){if(error&&error.name==='AbortError')return}}await copyText(value)})
          );
          info.after(actions);
        }

        let section=card.querySelector('.cliente-v2-section-title');
        if(!section){section=document.createElement('div');section.className='cliente-v2-section-title';section.textContent='Resumen del cliente';actions.after(section)}
        let metrics=card.querySelector('.cliente-v2-metrics');
        if(!metrics){metrics=document.createElement('div');metrics.className='cliente-v2-metrics';section.after(metrics)}
        updateMetrics();updateTabs();
      }

      if(typeof renderLista==='function'){
        const originalRenderLista=renderLista;
        renderLista=function(items,containerId,prefix){
          previewState[prefix]=Array.isArray(items)?items:[];
          const result=originalRenderLista.apply(this,arguments);
          queueMicrotask(()=>{decorateCards(prefix);buildClientWorkspace();updateMetrics();updateTabs()});
          return result;
        };
      }
      if(typeof buscarHistorial==='function'){
        const originalBuscarHistorial=buscarHistorial;
        buscarHistorial=async function(){
          const result=await originalBuscarHistorial.apply(this,arguments);
          requestAnimationFrame(()=>{buildClientWorkspace();decorateCards('OP');decorateCards('COT');updateMetrics();updateTabs()});
          return result;
        };
      }
      window.addEventListener('DOMContentLoaded',()=>{document.body.classList.add('clientes-v2-preview')},{once:true});
    }

    try{
      const stamp='20260828-clientes-v2';
      const [pageResponse,guardResponse]=await Promise.all([
        fetch('./clientes.html?previewSource='+stamp,{cache:'no-store'}),
        fetch('./homeeasy-page-guard.js?previewGuard='+stamp,{cache:'no-store'})
      ]);
      if(!pageResponse.ok||!guardResponse.ok) throw new Error('No fue posible cargar la base de Clientes.');
      let source=await pageResponse.text();
      let guard=await guardResponse.text();

      guard=guard.replace(/const currentPage = \(\(global\.location[\s\S]*?\.trim\(\);/,"const currentPage = 'clientes.html';");
      guard=guard.replace(/<\/script/gi,'<\\/script');
      source=source.replace('`clientes.html?search=${cedula}`','`clientes-v2.html?search=${cedula}`');
      source=source.replace("window.history.replaceState({}, '', 'clientes.html');","window.history.replaceState({}, '', 'clientes-v2.html');");

      const parser=new DOMParser();
      const doc=parser.parseFromString(source,'text/html');
      doc.body.classList.add('clientes-v2-preview');
      doc.title='HomeEasy | Clientes 2.0';

      const guardTag=[...doc.querySelectorAll('script[src]')].find(node=>String(node.getAttribute('src')||'').includes('homeeasy-page-guard.js'));
      if(!guardTag) throw new Error('No se encontró el guard de Clientes.');
      const inlineGuard=doc.createElement('script');inlineGuard.textContent=guard;guardTag.replaceWith(inlineGuard);

      const style=doc.createElement('style');style.id='clientes-v2-preview-style';style.textContent=previewCss;doc.head.appendChild(style);
      const enhancer=doc.createElement('script');enhancer.id='clientes-v2-preview-script';enhancer.textContent='('+previewEnhancer.toString()+')();';doc.body.appendChild(enhancer);

      document.open();
      document.write('<!DOCTYPE html>'+doc.documentElement.outerHTML);
      document.close();
    }catch(error){
      console.error('Clientes preview:',error);
      const box=document.getElementById('previewError');if(box)box.style.display='block';
    }
  })();
  </script>
</body>
</html>
