    <style>
        /* --- VARIABLES PREMIUM --- */
        :root { 
            --homeeasy-wine: #f8f9fa; 
            --homeeasy-gold: #c2a468;
            --homeeasy-dark: #1c1c1e;
            --ios-gray: #f8f9fa;
            --success-ios: #34c759;
            --warning-ios: #ffcc00;
            --brand-wine: #a6455a;

            margin: 0;

            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh;       
            background-color: var(--homeeasy-wine); z-index: 2000; 
            display: flex; flex-direction: column; justify-content: space-between;
            overflow: hidden; transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

            position: absolute; top: 60px; left: 25px; width: 50px; height: 50px; 
            background-color: rgba(255, 255, 255, 0.5); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            color: var(--brand-wine); font-size: 1.2rem; text-decoration: none; 
            z-index: 3000; backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            transition: transform 0.1s; 
        }
        .btn-back-cover:active { transform: scale(0.90); background-color: rgba(255, 255, 255, 0.8); }

        .inicio-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 20px; }
        .brand-box { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .logo-img { width: 38px; height: auto; }
        .brand-txt { color: var(--brand-wine); font-size: 2rem; font-weight: 600; margin: 0; letter-spacing: -0.5px; }

        .main-title { color: var(--homeeasy-gold); font-size: 2.8rem; font-weight: 700; margin: 0; line-height: 1.1; text-align: center; text-shadow: 0 4px 10px rgba(194, 164, 104, 0.2); letter-spacing: -1px; }
        .sub-title { color: var(--brand-wine); font-size: 1.1rem; margin-top: 8px; font-weight: 500; text-align: center; margin-bottom: 40px; }

        .search-wrapper { position: relative; width: 85%; max-width: 450px; }
        .input-cover { width: 100%; border: none; background: white; padding: 22px 25px 22px 60px; border-radius: 50px; font-size: 1.1rem; color: #333; font-weight: 500; box-shadow: 0 10px 30px rgba(166, 69, 90, 0.1); }
        .input-cover:focus { outline: none; box-shadow: 0 10px 35px rgba(166, 69, 90, 0.25); }

        .icon-cover { position: absolute; left: 25px; top: 50%; transform: translateY(-50%); color: #bbb; font-size: 1.3rem; }

        .bottom-area { position: relative; width: 100%; display: flex; justify-content: center; align-items: flex-end; }
        .hommy-img { width: 240px; max-width: 60%; z-index: 2; margin-bottom: -5px; pointer-events: none; }
        .gold-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 55px; background-color: var(--homeeasy-gold); z-index: 1; padding-bottom: env(safe-area-inset-bottom); box-sizing: content-box; }

        /* --- PANTALLA RESULTADOS --- */
        #pantalla-resultados { display: none; padding-top: 130px; padding-bottom: 40px; background-color: var(--ios-gray); min-height: 100vh; }
        .header-mini { position: fixed; top: 0; left: 0; width: 100%; background-color: var(--brand-wine) !important; padding: 20px 25px 15px; padding-top: 70px; z-index: 1000; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 5px 20px rgba(0,0,0,0.15); height: 110px; }
        .mini-brand { color: white; font-weight: 700; font-size: 1.3rem; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        
        .client-card { background: white; border-radius: 28px; padding: 25px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-left: 8px solid var(--homeeasy-gold); }
        .client-name { font-weight: 700; color: var(--brand-wine); font-size: 1.3rem; letter-spacing: -0.5px; margin-bottom: 18px; text-transform: uppercase; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
        .btn-edit-client { background: rgba(166, 69, 90, 0.1); color: var(--brand-wine); border: none; border-radius: 12px; font-weight: 600; font-size: 0.8rem; padding: 6px 14px; transition: all 0.2s; }

        .nav-tabs-custom { background: #efeff4; border-radius: 14px; padding: 3px; margin: 20px 0 0; border: none; }
        .nav-tabs-custom .nav-link { border: none; color: #8e8e93; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; border-radius: 11px; padding: 10px; flex: 1; letter-spacing: 0.5px;}
        .nav-tabs-custom .nav-link.active { background: white; color: var(--brand-wine); box-shadow: 0 3px 10px rgba(0,0,0,0.1); font-weight: 700;}

        .item-card { background: white; border-radius: 22px; margin-bottom: 18px; overflow: visible; box-shadow: 0 5px 15px rgba(0,0,0,0.03); position: relative; }
        
        .item-card::before { content: ""; position: absolute; left: 0; top: 15%; height: 70%; width: 7px; border-radius: 0 10px 10px 0; }
        .card-COMPLETADO::before { background: var(--success-ios); }
        .card-ACTIVO::before { background: var(--warning-ios); }
        .card-COT::before { background: #af52de; }
        .card-ANULADA::before { background: #e74c3c; } 
        .card-ANULADA .item-body { opacity: 0.55; }

        .item-header { padding: 18px 20px 5px; display: flex; justify-content: space-between; align-items: center; background: #fafafa; border-radius: 22px 22px 0 0; }
        .status-badge { font-size: 0.65rem; font-weight: 700; padding: 5px 12px; border-radius: 10px; letter-spacing: 0.5px; }
        .status-COMPLETADO { color: #155724; background: #d4edda; }
        .status-ACTIVO { color: #856404; background: #fff3cd; }
        .status-ANULADA { color: #721c24; background: #fadbd8; } 
        .badge-cot { color: #9333ea; background: #f3e8ff; }

        .item-body { padding: 15px 20px; transition: opacity 0.3s; }
        .item-footer { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: white; border-top: 1px dashed #eee; border-radius: 0 0 22px 22px; }
        
        .payment-history { display: none; padding: 0 20px 20px; background: #fff; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .payment-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; background: #f9f9f9; border-radius: 12px; margin-bottom: 8px; font-size: 0.8rem; transition: background 0.2s;}
        .payment-item:active { background: #eee; }

        .total-price { font-weight: 700; color: var(--brand-wine); font-size: 1.1rem; letter-spacing: -0.5px;}
        .saldo-price { font-weight: 600; color: #ff3b30; font-size: 0.9rem; }
        .saldo-finalizado { color: #8e8e93 !important; }

        .btn-pdf { background: white; color: var(--brand-wine); border: 1.5px solid var(--brand-wine); border-radius: 15px; font-size: 0.7rem; font-weight: 700; padding: 6px 14px; text-decoration: none; display: inline-block; cursor: pointer; transition: all 0.2s;}
        .btn-pdf:active { background: rgba(166, 69, 90, 0.1); transform: scale(0.95); }
        
        /* Modal Bootstrap Contactos */
        .modal-content { border-radius: 20px; border: none; }
        .modal-header { background: var(--brand-wine); color: white; border-radius: 20px 20px 0 0; border-bottom: none; }
        
        /* SweetAlert Premium */
        .swal2-premium { border-radius: 24px !important; font-family: inherit !important;}
        
        /* --- NUBECITA DE OPCIONES (Dropdown) --- */
        .opciones-icono { color: #aaa; cursor: pointer; padding: 6px 12px; border-radius: 50%; transition: background 0.2s; position: relative; }
        .opciones-icono:active { background: #eee; }

        .dropdown-opciones {
            position: absolute; top: 100%; right: 0; background: white; border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15); min-width: 140px; z-index: 2000;
            display: none; flex-direction: column; overflow: hidden; border: 1px solid #eee;
            transform-origin: top right; animation: popDropdown 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popDropdown { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .drop-item { padding: 12px 18px; font-size: 0.85rem; font-weight: 600; color: var(--text-dark); cursor: pointer; display: flex; align-items: center; transition: background 0.2s; }
        .drop-item:active { background: #f5f5f5; }
        .drop-item.text-danger { color: #e74c3c !important; border-top: 1px solid #f5f5f5; }
        .drop-item i { width: 20px; text-align: center; margin-right: 6px; }

        /* 🚨 NUEVO: MODAL VISOR DE PDF */
        #pdf-viewer-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 10000; flex-direction: column;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        
        .pdf-viewer-header {
            padding: calc(env(safe-area-inset-top) + 15px) 20px 15px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.5); color: white; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .pdf-viewer-title { font-weight: 600; font-size: 1rem; }
        .btn-close-pdf {
            background: rgba(255,255,255,0.2); border: none; color: white;
            width: 36px; height: 36px; border-radius: 18px;
            display: flex; justify-content: center; align-items: center; font-size: 1.1rem;
        }
        .btn-close-pdf:active { background: rgba(255,255,255,0.4); }
        
        #pdf-iframe { flex: 1; width: 100%; border: none; background: #ececec; }

    </style>

    <script id="clientes-v31-inline-guard">
/**
 * HomeEasy Page Guard v3.6
 * Navegación cache-first: usa la sesión ya validada para abrir módulos al instante

 */
(function (global) {
    'use strict';

    const PAGE_PERMISSIONS = Object.freeze({
        'clientes.html': 'clientes.read',
        'clientes-conectado-v31.html': 'clientes.read',

        'cotizacion.html': 'cotizaciones.write',
        'seguimiento.html': 'cotizaciones.read',
        'pedido.html': 'pedidos.write',
        'abono.html': 'abonos.write',
        'caja.html': 'caja.read',
        'documentos.html': 'documentos.read',
        'calendario.html': 'agenda.read',
        'reportes.html': 'reportes.read',
        'configuracion.html': 'config.read',
        'perfil.html': 'perfil.read',

    const API_URL = global.HomeEasyCore && global.HomeEasyCore.API_URL
        ? global.HomeEasyCore.API_URL

    const currentPage = ((global.location && global.location.pathname ? global.location.pathname.split('/').pop() : '') || '').trim();
    const requiredPermission = PAGE_PERMISSIONS[currentPage] || '';
    if (!requiredPermission) return;

    const nativeFetch = global.fetch.bind(global);
    const PENDING_CLASS = 'homeeasy-module-auth-pending';
    const REVALIDATE_AFTER_MS = 5 * 60 * 1000;
    let pageAuthStatus = 'checking';
    let resolvePageReady;
    let pendingTimer = null;
    let sessionRecoveryPromise = null;
    const pageReady = new Promise(resolve => { resolvePageReady = resolve; });

    function showPendingCover() {
        if (pageAuthStatus !== 'checking' || !global.document || !global.document.documentElement) return;
        global.document.documentElement.classList.add(PENDING_CLASS);
        if (global.document.getElementById('homeeasy-module-auth-style')) return;
        const style = global.document.createElement('style');
        style.id = 'homeeasy-module-auth-style';
        style.textContent = `
            html.${PENDING_CLASS} body { visibility: hidden !important; }
            html.${PENDING_CLASS} { min-height: 100%; background: #f2f2f7 !important; }
            html.${PENDING_CLASS}::before { content:''; position:fixed; z-index:2147483646; inset:0; background:#f2f2f7; }
            html.${PENDING_CLASS}::after { content:'Abriendo HomeEasy…'; position:fixed; z-index:2147483647; left:50%; top:50%; transform:translate(-50%,-50%); color:#777075; font:650 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; white-space:nowrap; }
        `;
        (global.document.head || global.document.documentElement).appendChild(style);
    }

    function schedulePendingCover() {
        clearTimeout(pendingTimer);
        pendingTimer = global.setTimeout(showPendingCover, 220);
    }

    function reveal() {
        clearTimeout(pendingTimer);
        if (global.document && global.document.documentElement) {
            global.document.documentElement.classList.remove(PENDING_CLASS);
        }
    }

    function loadScriptOnce(src, id, ready) {
        if (typeof ready === 'function' && ready()) return Promise.resolve();
        const existing = global.document.getElementById(id);
        if (existing) {
            if (existing.dataset.loaded === 'true' || (typeof ready === 'function' && ready())) return Promise.resolve();
            return new Promise((resolve, reject) => {
                existing.addEventListener('load', resolve, { once: true });
                existing.addEventListener('error', reject, { once: true });
            });
        }
        return new Promise((resolve, reject) => {
            const script = global.document.createElement('script');
            script.id = id;
            script.src = src;
            script.async = false;
            script.addEventListener('load', () => { script.dataset.loaded = 'true'; resolve(); }, { once: true });
            script.addEventListener('error', reject, { once: true });
            (global.document.head || global.document.documentElement).appendChild(script);
        });
    }

    function buildMetaQuery(url) {
        const target = new URL(url, global.location.href);
        const auth = global.HomeEasyAuth;
        const core = global.HomeEasyCore;
        const token = auth && auth.getAppSessionToken ? auth.getAppSessionToken() : '';
        if (token) target.searchParams.set('appSessionToken', token);
        if (core && core.getDeviceInfo) {
            const device = core.getDeviceInfo();
            target.searchParams.set('dispositivoId', device.id || 'SIN_ID');
            target.searchParams.set('dispositivoNombre', device.name || '');
            target.searchParams.set('plataforma', device.platform || '');
            target.searchParams.set('navegador', device.browser || '');
        }
        target.searchParams.set('pagina', currentPage);
        target.searchParams.set('versionApp', '3.4');
        return target.href;
    }

    function parseJsonBody(body) {
        if (typeof body !== 'string') return null;
        try {
            const data = JSON.parse(body);
            return data && typeof data === 'object' && !Array.isArray(data) ? data : null;
        } catch (error) { return null; }
    }

    function isAuthPayload(data) {
        return Boolean(data && /^AUTH_/i.test(String(data.tipo || '')));
    }

    function enrichPost(options) {
        const data = parseJsonBody(options.body);
        if (!data || isAuthPayload(data)) return { options, isAuth: isAuthPayload(data) };
        const token = global.HomeEasyAuth && global.HomeEasyAuth.getAppSessionToken ? global.HomeEasyAuth.getAppSessionToken() : '';
        const meta = global.HomeEasyCore && global.HomeEasyCore.buildMeta ? global.HomeEasyCore.buildMeta() : { pagina: currentPage, versionApp: '3.4' };
        options.body = JSON.stringify({
            ...data,
            appSessionToken: token,
            meta: { ...meta, ...(data.meta && typeof data.meta === 'object' ? data.meta : {}) }
        });
        return { options, isAuth: false };
    }

    async function readSecurityPayload(response) {
        try {
            const data = await response.clone().json();
            return data && typeof data === 'object' ? data : null;
        } catch (error) {
            return null;
        }
    }

    function authErrorCode(error) {
        return String(error && error.code || '').trim().toUpperCase();
    }

    function isRecoverableSessionError(error) {
        const code = authErrorCode(error);
        return code === 'APP_SESSION_EXPIRED' || code === 'APP_SESSION_REJECTED' || code === 'NO_SESSION';
    }

    async function recoverOperationalSession() {
        const auth = global.HomeEasyAuth;
        if (!auth || typeof auth.restoreHomeEasySession !== 'function') return false;
        if (sessionRecoveryPromise) return sessionRecoveryPromise;

        sessionRecoveryPromise = (async () => {
            try {
                const recovered = await auth.restoreHomeEasySession({
                    validateFirebase: false,
                    reopen: true,
                    silent: false,
                    preferCache: false,
                    meta: global.HomeEasyCore && global.HomeEasyCore.buildMeta ? global.HomeEasyCore.buildMeta() : {}
                });
                if (!recovered) return false;
                if (!auth.hasPermission(requiredPermission)) {
                    showDenied('Tu rol cambió y ya no tiene acceso a este módulo.');
                    return false;
                }
                return true;
            } catch (error) {
                if (isTransientAuthError(error)) {
                    showConnectionIssue(error);
                    return null;
                }
                console.warn('HomeEasy: no fue posible recuperar la sesión operativa.', error);
                return false;
            } finally {
                sessionRecoveryPromise = null;
            }
        })();
        return sessionRecoveryPromise;
    }

    function installFetchBridge() {
        global.fetch = function homeEasyAuthorizedFetch(resource, init) {
            const rawUrl = typeof resource === 'string' ? resource : (resource && resource.url ? resource.url : '');
            const options = { ...(init || {}) };
            const method = String(options.method || (resource && resource.method) || 'GET').toUpperCase();
            const targetsHomeEasy = rawUrl.startsWith(API_URL);
            if (!targetsHomeEasy) return nativeFetch(resource, options);

            let isAuth = false;
            if (method === 'POST') isAuth = enrichPost(options).isAuth;

            const execute = async (allowRecovery) => {
                if (method === 'POST' && !isAuth) enrichPost(options);
                const finalUrl = method === 'GET' ? buildMetaQuery(rawUrl) : rawUrl;
                const response = await nativeFetch(finalUrl || resource, options);
                const data = await readSecurityPayload(response);

                if (data && data.requiresLogin === true) {
                    if (allowRecovery) {
                        const recovered = await recoverOperationalSession();
                        if (recovered === true) return execute(false);
                        if (recovered === null) return response;
                    }
                    redirectToLogin();
                } else if (data && (data.forbidden === true || data.code === 'PERMISSION_DENIED')) {
                    showDenied(data.msg || 'Tu rol no tiene permiso para realizar esta acción.');
                }
                return response;
            };

            if (isAuth) return execute(false);
            return pageReady.then(allowed => {
                if (!allowed) throw new Error('PERMISSION_DENIED');
                return execute(true);
            });
        };
    }

    function redirectToLogin() {
        if (pageAuthStatus === 'redirecting') return;
        pageAuthStatus = 'redirecting';
        reveal();
        if (global.HomeEasyCore && global.HomeEasyCore.clearSensitiveBrowserCaches) global.HomeEasyCore.clearSensitiveBrowserCaches();

            global.location.replace(url.href);
        }
    }

    function isTransientAuthError(error) {
        return Boolean(global.HomeEasyAuth && typeof global.HomeEasyAuth.isTransientError === 'function' && global.HomeEasyAuth.isTransientError(error));
    }

    function showConnectionIssue(error) {

        const render = () => {

            overlay.innerHTML = '<section style="width:min(430px,100%);padding:28px;border-radius:24px;background:#fff;box-shadow:0 22px 60px rgba(45,35,40,.14);text-align:center"><div style="font-size:30px;margin-bottom:12px">↻</div><h1 style="margin:0;font-size:1.35rem;letter-spacing:-.035em">Conexión interrumpida</h1><p style="margin:10px auto 20px;max-width:35ch;color:#777075;font-size:.84rem;line-height:1.5">No se cerró tu sesión. Reintenta cuando tengas conexión con HomeEasy.</p><button id="homeeasyRetryModule" style="width:100%;height:50px;border:0;border-radius:14px;background:#a6455a;color:#fff;font-weight:720">Reintentar</button><button id="homeeasyBackFromConnection" style="width:100%;height:46px;margin-top:8px;border:0;background:transparent;color:#a6455a;font-weight:680">Volver al Inicio</button></section>';

        reveal();
        const profile = global.HomeEasyAuth && global.HomeEasyAuth.getCurrentProfile ? global.HomeEasyAuth.getCurrentProfile() : null;

        global.document.getElementById('heBackHome').addEventListener('click', () => {
            if (global.HomeEasyCore && typeof global.HomeEasyCore.goHome === 'function') global.HomeEasyCore.goHome();
            else global.location.assign('index.html');
        });
    }

    function authorizeLocally(session) {
        if (!session || !global.HomeEasyAuth) return false;
        if (!global.HomeEasyAuth.hasPermission(requiredPermission)) {
            showDenied('Tu rol no tiene permiso para abrir este módulo.');
            return false;
        }
        const profile = global.HomeEasyAuth.getCurrentProfile();
        if (profile && global.HomeEasyCore && global.HomeEasyCore.setOperator) global.HomeEasyCore.setOperator(profile.nombre || profile.email || 'Sin identificar');
        pageAuthStatus = 'authorized';

        reveal();
        try { global.dispatchEvent(new CustomEvent('homeeasy:page-auth-ready', { detail: { page: currentPage, permission: requiredPermission, profile, timestamp: Date.now() } })); } catch (error) {}

    }

    function revalidateInBackground() {
        const auth = global.HomeEasyAuth;
        if (!auth || !auth.validateAppSession) return;
        if (auth.shouldRevalidateAppSession && !auth.shouldRevalidateAppSession(REVALIDATE_AFTER_MS)) return;
        auth.validateAppSession({ meta: global.HomeEasyCore && global.HomeEasyCore.buildMeta ? global.HomeEasyCore.buildMeta() : {} })
            .then(() => {
                if (!auth.hasPermission(requiredPermission)) showDenied('Tu rol cambió y ya no tiene acceso a este módulo.');
            })
            .catch(async error => {
                if (isTransientAuthError(error)) {
                    console.warn('HomeEasy: revalidación del módulo aplazada por conexión.', error);
                    return;
                }
                if (isRecoverableSessionError(error)) {
                    const recovered = await recoverOperationalSession();
                    if (recovered !== false) return;
                }
                redirectToLogin();
            });
    }

    async function authorizePage() {
        schedulePendingCover();
        try {
            await loadScriptOnce('homeeasy-auth-config.js?v=3.3', 'homeeasyAuthConfigScript', () => Boolean(global.HOMEEASY_AUTH_CONFIG));
            await loadScriptOnce('homeeasy-auth.js?v=3.4', 'homeeasyAuthScript', () => Boolean(global.HomeEasyAuth));
            if (!global.HomeEasyAuth || !global.HomeEasyAuth.isConfigured()) { redirectToLogin(); return; }

            const cached = global.HomeEasyAuth.getCachedHomeEasySession ? global.HomeEasyAuth.getCachedHomeEasySession() : null;
            if (cached && authorizeLocally(cached)) {
                revalidateInBackground();
                return;
            }

            const session = await global.HomeEasyAuth.restoreHomeEasySession({
                validateFirebase: false,
                reopen: true,
                silent: true,
                preferCache: true,
                backgroundValidate: false,
                meta: global.HomeEasyCore && global.HomeEasyCore.buildMeta ? global.HomeEasyCore.buildMeta() : {}
            });
            if (!session) { redirectToLogin(); return; }
            if (authorizeLocally(session)) revalidateInBackground();
        } catch (error) {
            console.error('HomeEasy Page Guard:', error);
            if (isTransientAuthError(error)) {
                showConnectionIssue(error);
                return;
            }
            redirectToLogin();
        }
    }

    installFetchBridge();
    authorizePage();

    global.HomeEasyPageGuard = Object.freeze({
        currentPage,
        requiredPermission,
        permissions: PAGE_PERMISSIONS,
        getStatus: () => pageAuthStatus
    });
})(window);
