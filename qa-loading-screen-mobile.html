<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390,initial-scale=1"><title>HomeEasy Loading QA Mobile</title><style>

:root{--home:#a6455a;--home-light:#b54f67;--home-dark:#823646;--text:#252125;--muted:#777075}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#fff;color:var(--text)}
.splash{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.06fr) minmax(430px,.94fr);background:#fff;overflow:hidden}
.copy{display:flex;align-items:center;justify-content:center;padding:clamp(44px,6vw,88px);background:radial-gradient(circle at 16% 12%,rgba(166,69,90,.03),transparent 30%),#fff}
.inner{width:min(610px,100%)}
.brand{width:max-content;display:grid;justify-items:center;margin:0 0 clamp(52px,7vh,74px)}
.mark{width:52px;height:52px;object-fit:contain;margin-bottom:8px}
.word{color:var(--home);font-size:clamp(2rem,3vw,2.58rem);line-height:.98;font-weight:500;letter-spacing:-.052em;white-space:nowrap}
.system{margin-top:8px;width:100%;text-align:center;color:#8a7a7f;font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.20em}
.title{margin:0;max-width:680px;font-size:clamp(2.72rem,4.45vw,4.65rem);line-height:.98;font-weight:700;letter-spacing:-.052em}
.name{display:block;margin-top:2px;color:var(--home)}
.sub{margin:17px 0 0;color:var(--muted);font-size:clamp(.98rem,1.28vw,1.15rem);line-height:1.5;font-weight:450;max-width:39ch}
.progress-wrap{margin-top:36px;width:min(430px,80%)}
.progress{position:relative;height:3px;overflow:hidden;border-radius:999px;background:rgba(60,60,67,.10)}
.progress:before{content:"";position:absolute;inset:0 auto 0 -38%;width:38%;border-radius:inherit;background:linear-gradient(90deg,var(--home-light),var(--home),var(--home-dark));animation:loading 1.65s cubic-bezier(.2,.8,.2,1) infinite}
.status{margin-top:12px;color:#817a7e;font-size:.8rem;font-weight:520}
.visual{position:relative;overflow:hidden;background:radial-gradient(circle at 28% 15%,rgba(255,255,255,.10),transparent 31%),linear-gradient(150deg,var(--home-light) 0%,var(--home) 50%,var(--home-dark) 100%)}
.visual:before{content:"";position:absolute;z-index:5;top:-7%;left:-86px;width:176px;height:114%;border-radius:50%;background:#fff;box-shadow:-16px 0 34px rgba(78,24,39,.07)}
.visual:after{content:"";position:absolute;z-index:2;right:-16%;bottom:-22%;width:68%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.045)}
.watermark{position:absolute;z-index:1;top:49%;left:50%;width:min(70%,480px);transform:translate(-56%,-52%);opacity:.13;filter:brightness(.42) saturate(.70)}
.hommy{position:absolute;z-index:3;left:52%;bottom:-2%;height:86%;width:auto;max-width:91%;transform:translateX(-50%);object-fit:contain;object-position:center bottom;filter:none;animation:hommyIn .5s .04s cubic-bezier(.2,.8,.2,1) both}
@keyframes loading{0%{left:-40%;width:34%}55%{width:46%}100%{left:112%;width:34%}}
@keyframes hommyIn{from{opacity:0;transform:translateX(-50%) translateY(18px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

html,body{width:390px;min-width:390px;max-width:390px;height:844px;min-height:844px;max-height:844px;overflow:hidden}
.splash{width:390px;height:844px;min-height:844px;display:flex;flex-direction:column}
.visual{order:1;min-height:270px;flex:0 0 270px}
.visual:before{top:auto;bottom:-72px;left:-10%;width:120%;height:142px;border-radius:50%;background:#fff;box-shadow:0 -16px 32px rgba(78,24,39,.06)}
.visual:after{width:88%;right:-35%;bottom:-45%}
.watermark{width:50%;top:48%;left:26%;transform:translate(-50%,-50%);opacity:.11}
.hommy{height:91%;left:71%;bottom:-11%}
.copy{order:2;display:block;flex:1;padding:34px 24px 28px;background:#fff}
.inner{width:100%;margin:0 auto}
.brand{margin:0 auto 28px}
.mark{width:44px;height:44px;margin-bottom:6px}
.word{font-size:1.88rem}
.system{margin-top:5px;font-size:.53rem;letter-spacing:.17em}
.title{font-size:2.65rem;line-height:.98}
.sub{margin-top:11px;font-size:.92rem;max-width:31ch}
.progress-wrap{width:100%;margin-top:26px}
.status{font-size:.76rem}
</style></head><body>
<main class="splash">
<section class="copy"><div class="inner">
<header class="brand"><img class="mark" src="triangulo.png" alt=""><div class="word">HomeEasy</div><div class="system">Sistema Hommy</div></header>
<h1 class="title">Hola de nuevo,<span class="name">Alejandro</span></h1>
<p class="sub">Hommy está preparando todo para ti.</p>
<div class="progress-wrap"><div class="progress"></div><div class="status">Recuperando tu sesión…</div></div>
</div></section>
<aside class="visual"><img class="watermark" src="triangulo.png" alt=""><img class="hommy" src="hommysaludando.png" alt=""></aside>
</main></body></html>
