services:
  waha:
    image: devlikeapro/waha:chrome-2026.9.1
    container_name: homeeasy-waha
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/Bogota}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WAHA_WORKER_RESTART_SESSIONS: "true"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WAHA_AUTO_START_DELAY_SECONDS: "5"
      WAHA_PRINT_QR: "true"
      WAHA_CLIENT_DEVICE_NAME: HomeEasy
      WAHA_CLIENT_BROWSER_NAME: Chrome
    volumes:
      - ./data/sessions:/app/.sessions
    ports:
      # Solo disponible dentro del VPS. No se expone WAHA directamente a Internet.
      - "127.0.0.1:3000:3000"
    networks:
      - homeeasy-whatsapp

  bridge:
    image: homeeasy-whatsapp-bridge:local
    build:
      context: ./bridge
    container_name: homeeasy-whatsapp-bridge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/Bogota}
      PORT: "8080"
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_SESSION: ${WAHA_SESSION:-homeeasy}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN}
      PENTAGRAMA_LOGIN: ${PENTAGRAMA_LOGIN:-}
      PENTAGRAMA_PASSWORD: ${PENTAGRAMA_PASSWORD:-}
      PENTAGRAMA_TIMEOUT_MS: ${PENTAGRAMA_TIMEOUT_MS:-20000}
      PENTAGRAMA_MODE: ${PENTAGRAMA_MODE:-direct}
      PENTAGRAMA_AGENT_BOOTSTRAP_TOKEN: ${PENTAGRAMA_AGENT_BOOTSTRAP_TOKEN:-}
      PENTAGRAMA_AGENT_TLS_PORT: ${PENTAGRAMA_AGENT_TLS_PORT:-0}
      PENTAGRAMA_AGENT_TLS_CERT: ${PENTAGRAMA_AGENT_TLS_CERT:-}
      PENTAGRAMA_AGENT_TLS_KEY: ${PENTAGRAMA_AGENT_TLS_KEY:-}
      PENTAGRAMA_AGENT_LATEST_VERSION: ${PENTAGRAMA_AGENT_LATEST_VERSION:-1.1.1}
      MAX_BODY_MB: ${MAX_BODY_MB:-18}
      DATA_DIR: /app/data
    volumes:
      - ./data/bridge:/app/data
      - ./maintenance-runtime:/app/maintenance
      - ./agent-tls:/app/agent-tls:ro
    ports:
      # Durante Fase 1 se prueba desde el propio VPS. HTTPS público se añade después.
      - "127.0.0.1:${BRIDGE_PORT:-8080}:8080"
      - "${PENTAGRAMA_AGENT_PUBLIC_PORT:-8443}:${PENTAGRAMA_AGENT_TLS_PORT:-8443}"
    depends_on:
      - waha
    networks:
      - homeeasy-whatsapp

networks:
  homeeasy-whatsapp:
    name: homeeasy-whatsapp

