<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a6455a"><title>HomeEasy | Activar acceso</title><script src="homeeasy-auth-config.js?v=3.1"></script><script src="homeeasy-auth.js?v=3.1"></script><style>body,button,input{font-synthesis:none}:root{--wine:#a6455a;--gold:#c2a468;--text:#292529;--muted:#7d777b;--line:#e6e2e4;--desktop:url('assets/auth/login-bg-desktop.png');--mobile:url('assets/auth/login-bg-mobile.png')}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}body{min-height:100svh;display:grid;place-items:center;padding:20px;background:#f6f5f6 var(--desktop) center/cover fixed no-repeat}.card{width:min(480px,100%);padding:30px;border:1px solid rgba(255,255,255,.9);border-radius:28px;background:rgba(255,255,255,.97);box-shadow:0 26px 70px rgba(49,37,42,.15)}.logo{width:54px;height:54px;object-fit:contain;display:block;margin:0 auto 12px}.title{text-align:center}.title h1{margin:0;font-size:1.65rem;font-weight:700;letter-spacing:-.04em}.title p{margin:8px auto 24px;color:var(--muted);font-size:.78rem;line-height:1.5;max-width:36ch}.invite{margin-bottom:18px;padding:12px 13px;border-radius:14px;background:rgba(194,164,104,.10);color:#765f31;font-size:.69rem;line-height:1.45}.field{margin-bottom:13px}.field label{display:block;margin:0 2px 6px;color:#5f595d;font-size:.68rem;font-weight:650}.input{width:100%;height:52px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;font-size:16px;outline:none}.input:focus{border-color:rgba(166,69,90,.48);box-shadow:0 0 0 4px rgba(166,69,90,.08)}.button{width:100%;height:52px;margin-top:8px;border:0;border-radius:14px;background:var(--wine);color:#fff;font-weight:700}.button:disabled{opacity:.55}.status{min-height:20px;margin-top:12px;text-align:center;color:#bd3b50;font-size:.69rem;line-height:1.4}.status.ok{color:#2e8a4b}.back{display:block;margin-top:15px;text-align:center;color:var(--wine);font-size:.69rem;text-decoration:none}@media(max-width:650px){body{background-image:var(--mobile);background-attachment:scroll}.card{padding:25px 20px;border-radius:25px}}</style></head><body><main class="card"><img src="triangulo.png" class="logo" alt="HomeEasy"><div class="title"><h1>Activa tu acceso</h1><p>Crea tu contraseña personal para entrar a HomeEasy.</p></div><div class="invite" id="inviteInfo">Verificando invitación…</div><div class="field"><label>Correo</label><input class="input" id="email" type="email" readonly></div><div class="field"><label>Nueva contraseña</label><input class="input" id="password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></div><div class="field"><label>Repetir contraseña</label><input class="input" id="confirm" type="password" autocomplete="new-password"></div><button class="button" id="activate">Activar mi cuenta</button><div class="status" id="status"></div><a class="back" href="login.html">Volver al inicio de sesión</a></main><script>'use strict';const q=new URLSearchParams(location.search),email=q.get('email')||'',token=q.get('token')||'',b=document.getElementById('activate'),status=document.getElementById('status'),info=document.getElementById('inviteInfo');document.getElementById('email').value=email;async function verify(){if(!email||!token){info.textContent='Este enlace de invitación está incompleto.';b.disabled=true;return}try{const r=await HomeEasyAuth.validateInvitation(email,token);info.textContent='Invitación para '+(r.usuario&&r.usuario.nombre||r.nombre||email)+' · Rol '+(r.usuario&&r.usuario.rol||r.rol||'USUARIO');}catch(e){info.textContent=e.message;b.disabled=true}}verify();b.onclick=async()=>{const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8){status.textContent='Usa al menos 8 caracteres.';return}if(p!==c){status.textContent='Las contraseñas no coinciden.';return}b.disabled=true;b.textContent='Activando…';status.textContent='';try{await HomeEasyAuth.activateInvitation(email,p,token,{remember:true,meta:HomeEasyAuth.buildMeta({pagina:'activar-cuenta.html'})});status.className='status ok';status.textContent='Cuenta activada. Abriendo HomeEasy…';setTimeout(()=>location.replace('index.html'),700)}catch(e){status.className='status';status.textContent=e.message||'No se pudo activar la cuenta.';b.disabled=false;b.textContent='Activar mi cuenta'}};</script></body></html>
